<script>
/* RéviCIEL — « Mes fiches » : créer, modifier, importer et exporter ses propres fiches */
(function () {
  'use strict';
  const { E, icon, $, $$, plural } = App;

  const TEMPLATE = [
    '## Le cours',
    '',
    'Écris ici ton cours. Tu peux mettre **du gras**, ==des mots clés surlignés== (cachés en « mode caché ») et des listes :',
    '',
    '- un point important',
    '- un autre point',
    '',
    '> [!retenir]',
    '> La phrase à connaître par cœur.',
    '',
    '=== CARTES ===',
    'Q: Ma question ?',
    'R: Ma réponse.',
    '',
    '=== QUIZ ===',
    '? Ma question à choix multiple ?',
    '- une mauvaise réponse',
    '+ la bonne réponse',
    '- une autre mauvaise réponse',
    '! Une explication affichée après la réponse (facultatif).',
    ''
  ].join('\n');

  const HELP = '<details class="card section help"><summary><b>Aide : comment écrire une fiche ?</b></summary>' +
    '<p>Le texte s\'écrit en <b>Markdown</b> simplifié :</p><pre>## Titre de partie\n### Sous-titre\n**gras**   *italique*   ==surligné==   `code`\nH~2~O (indice)   x^2^ (exposant)\n- liste à puces\n1. liste numérotée\n| Colonne 1 | Colonne 2 |\n|---|---|\n| case | case |\n\n> [!retenir]      (aussi : definition, exemple,\n> Texte encadré     attention, astuce, formule)</pre>' +
    '<p>Ensuite, les <b>cartes mémoire</b> après la ligne <code>=== CARTES ===</code> :</p><pre>Q: La question\nR: La réponse (peut faire plusieurs lignes)</pre>' +
    '<p>Et le <b>quiz</b> après <code>=== QUIZ ===</code> : une ligne <code>?</code> pour la question, <code>-</code> pour chaque mauvaise réponse, <code>+</code> pour la bonne, <code>!</code> pour l\'explication.</p>' +
    '<p>Et des <b>exercices</b> après <code>=== EXERCICES ===</code> :</p><pre># trous : Complète\nLe droit de grève date de [[1864]].\n# ordre : Remets dans l\'ordre\n- premier\n- deuxième\n- troisième\n# paires : Associe\n- 15 = SAMU\n- 18 = Pompiers\n- 112 = Urgence européenne\n# classer : Classe\nPrimaire : agriculteur, pêcheur\nTertiaire : vendeuse, infirmier\n# calcul : Calcule\n? 230 V × 2 A = ? (en W)\n= 460 W\n! P = U × I</pre></details>';

  function newId() { return 'perso-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function bodyOf(src) { return String(src || '').replace(/\r\n?/g, '\n').replace(/^---\n[\s\S]*?\n---[ \t]*(\n|$)/, '').replace(/^\n+/, ''); }
  function withId(src, id) {
    src = String(src).replace(/\r\n?/g, '\n').replace(/^﻿/, '');
    if (/^---\n[\s\S]*?\n---/.test(src)) {
      return src.replace(/^---\n([\s\S]*?)\n---/, (m, head) => {
        const lines = head.split('\n').filter((l) => !/^\s*id\s*:/i.test(l));
        return '---\nid: ' + id + '\n' + lines.join('\n') + '\n---';
      });
    }
    return '---\nid: ' + id + '\ntitre: Fiche importée\n---\n\n' + src;
  }
  function reload() { RC.load(); App.renderNav(); }

  /* ---------- Import ---------- */
  async function importFiles() {
    const files = await App.pickFiles('.md,.txt,.json,text/markdown,text/plain,application/json', true);
    if (!files.length) return 0;
    let n = 0;
    for (const file of files) {
      try {
        const text = await App.readFile(file);
        if (/\.json$/i.test(file.name)) {
          const data = JSON.parse(text);
          const list = Array.isArray(data.userFiches) ? data.userFiches : Array.isArray(data) ? data : [];
          list.forEach((u) => {
            if (!u || typeof u.src !== 'string') return;
            const id = typeof u.id === 'string' && /^perso-/.test(u.id) ? u.id : newId();
            Store.upsertUserFiche(id, withId(u.src, id)); n++;
          });
        } else {
          const parsed = RCMD.parseFiche(text);
          const id = /^perso-/.test(parsed.id) ? parsed.id : newId();
          Store.upsertUserFiche(id, withId(text, id)); n++;
        }
      } catch (err) { App.toast('« ' + file.name + ' » : ' + err.message); }
    }
    reload();
    App.toast(n ? plural(n, 'fiche importée', 'fiches importées') + ' !' : 'Aucune fiche trouvée dans ce fichier.');
    return n;
  }

  /* ---------- Liste « Mes fiches » ---------- */
  App.route(/^\/mes-fiches$/, (v) => {
    App.setTitle('Mes fiches');
    const render = () => {
      const list = Store.userFiches.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0)).map((u) => RC.fiche(u.id)).filter(Boolean);
      v.innerHTML = '<div class="page-head"><h1>Mes fiches</h1><p>Crée tes propres fiches (avec cartes et quiz) : elles s\'ajoutent à la matière choisie et à la révision du jour.</p></div>' +
        '<div class="row" style="margin-bottom:18px"><a class="btn" href="#/editeur">' + icon('plus') + ' Nouvelle fiche</a>' +
        '<button class="btn secondary" data-act="import">' + icon('upload') + ' Importer (.md / .json)</button>' +
        (list.length ? '<button class="btn ghost" data-act="export-all">' + icon('download') + ' Tout exporter</button>' : '') + '</div>' +
        (list.length ? '<div class="fiche-list">' + list.map((f) => {
          const s = RC.SUBJ[f.subject], u = Store.userFiches.find((x) => x.id === f.id);
          const date = u && u.updated ? new Date(u.updated).toLocaleDateString('fr-FR') : '';
          return '<div class="fiche-row" style="--c:' + s.color + '"><span class="num">' + icon('pen') + '</span><div class="body"><h3><a href="#/fiche/' + encodeURIComponent(f.id) + '">' + E(f.title) + '</a></h3>' +
            '<p>' + E(s.name) + (date ? ' · modifiée le ' + date : '') + ' · ' + plural(f.cards.length, 'carte') + ' · ' + plural(f.quiz.length, 'question') + '</p>' +
            (f.errors.length ? '<div class="badges"><span class="badge bad">' + plural(f.errors.length, 'erreur') + ' de format</span></div>' : '') + '</div>' +
            '<div class="row" style="flex:none"><a class="btn ghost sm" href="#/editeur/' + encodeURIComponent(f.id) + '">' + icon('pen') + ' Modifier</a>' +
            '<button class="btn ghost sm" data-act="export" data-id="' + E(f.id) + '" aria-label="Exporter">' + icon('download') + '</button>' +
            '<button class="btn ghost sm" data-act="delete" data-id="' + E(f.id) + '" aria-label="Supprimer">' + icon('trash') + '</button></div></div>';
        }).join('') + '</div>' :
          '<div class="card empty">' + icon('pen') + '<h2>Aucune fiche perso pour l\'instant</h2><p>Crée ta première fiche, importe un fichier .md, ou ouvre une fiche officielle et touche « Personnaliser » pour la copier.</p></div>') +
        HELP;
    };
    render();
    v.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act, id = b.dataset.id;
      if (act === 'import') { await importFiles(); render(); }
      else if (act === 'export-all') {
        App.download('mes-fiches-reviciel.json', JSON.stringify({ app: 'RéviCIEL', format: 1, type: 'fiches', userFiches: Store.userFiches }, null, 1), 'application/json');
      } else if (act === 'export') {
        const u = Store.userFiches.find((x) => x.id === id), f = RC.fiche(id);
        if (u) App.download(App.fileSlug(f ? f.title : id) + '.md', u.src, 'text/markdown');
      } else if (act === 'delete') {
        const f = RC.fiche(id);
        if (confirm('Supprimer définitivement la fiche « ' + (f ? f.title : id) + ' » ? (Pense à l\'exporter avant si tu veux la garder.)')) {
          Store.deleteUserFiche(id); reload(); render(); App.toast('Fiche supprimée.');
        }
      }
    });
  });

  /* ---------- Éditeur ---------- */
  App.route(/^\/editeur(?:\/([^/]+))?$/, (v, [id], params) => {
    const existing = id ? Store.userFiches.find((u) => u.id === id) : null;
    if (id && !existing) return App.notFound(v, 'Fiche perso introuvable');
    const fid = id || newId();
    const p = existing ? RCMD.parseFiche(existing.src) : null;
    let data = {
      titre: p ? p.title : '',
      matiere: p ? p.subject : (RC.SUBJ[params.get('matiere')] ? params.get('matiere') : 'perso'),
      chapitre: p ? p.chapter : '',
      resume: p ? p.summary : '',
      motscles: p ? p.tags.join(', ') : '',
      body: existing ? bodyOf(existing.src) : TEMPLATE
    };
    const draftKey = id || 'nouvelle';
    const draft = Store.getDraft();
    let restored = false;
    if (draft && draft.key === draftKey && draft.data && JSON.stringify(draft.data) !== JSON.stringify(data)) { data = Object.assign(data, draft.data); restored = true; }
    App.setTitle(existing ? 'Modifier · ' + data.titre : 'Nouvelle fiche');

    const opts = RC.SUBJECTS.map((s) => '<option value="' + s.id + '"' + (s.id === data.matiere ? ' selected' : '') + '>' + E(s.name) + '</option>').join('');
    v.innerHTML = '<div class="crumbs"><a href="#/mes-fiches">Mes fiches</a><span>›</span><span>' + (existing ? 'Modifier' : 'Nouvelle fiche') + '</span></div>' +
      '<div class="page-head row between"><h1 style="margin:0">' + (existing ? 'Modifier ma fiche' : 'Nouvelle fiche') + '</h1><div class="row">' +
      (existing ? '<button class="btn danger" id="del">' + icon('trash') + ' Supprimer</button>' : '') +
      '<a class="btn ghost" href="' + (existing ? '#/fiche/' + encodeURIComponent(fid) : '#/mes-fiches') + '" id="cancel">Annuler</a><button class="btn" id="save">' + icon('check') + ' Enregistrer</button></div></div>' +
      (restored ? '<div class="callout info" id="restored"><div class="callout-title">Brouillon restauré</div><p>Tes modifications non enregistrées ont été récupérées. <button class="btn ghost sm" id="discard">Les abandonner</button></p></div>' : '') +
      '<div class="editor-meta">' +
      '<div class="field"><label for="ed-titre">Titre *</label><input class="input" id="ed-titre" value="' + E(data.titre) + '" placeholder="Ex. : Le modèle OSI" maxlength="120"></div>' +
      '<div class="field"><label for="ed-matiere">Matière</label><select class="input" id="ed-matiere">' + opts + '</select></div>' +
      '<div class="field"><label for="ed-chapitre">Chapitre (facultatif)</label><input class="input" id="ed-chapitre" value="' + E(data.chapitre) + '" placeholder="Ex. : Réseaux — bases"></div>' +
      '<div class="field"><label for="ed-resume">Résumé (facultatif)</label><input class="input" id="ed-resume" value="' + E(data.resume) + '" placeholder="Une phrase qui résume la fiche"></div>' +
      '</div>' +
      '<div class="seg editor-tabs" id="tabs"><button class="active" data-pane="write">Écrire</button><button data-pane="preview">Aperçu</button></div>' +
      '<div class="editor-grid"><div class="pane" data-pane="write"><div class="toolbar" id="tb">' +
      [['h', 'Titre'], ['b', 'Gras'], ['m', 'Surligné'], ['ul', 'Liste'], ['tbl', 'Tableau'], ['call', 'Encadré'], ['card', '+ Carte'], ['q', '+ Question']].map((x) => '<button type="button" data-ins="' + x[0] + '">' + x[1] + '</button>').join('') +
      '</div><textarea class="editor-area" id="ed-body" spellcheck="true" aria-label="Contenu de la fiche">' + E(data.body) + '</textarea><div class="parse-info" id="info"></div></div>' +
      '<div class="pane" data-pane="preview" hidden><div class="preview-pane"><div class="md" id="preview"></div></div></div></div>' + HELP;

    const els = { titre: $('#ed-titre', v), matiere: $('#ed-matiere', v), chapitre: $('#ed-chapitre', v), resume: $('#ed-resume', v), body: $('#ed-body', v) };
    let dirty = restored;
    const collect = () => ({ titre: els.titre.value.trim(), matiere: els.matiere.value, chapitre: els.chapitre.value.trim(), resume: els.resume.value.trim(), motscles: data.motscles, body: els.body.value });
    const build = (d) => RCMD.buildSource({ id: fid, matiere: d.matiere, titre: d.titre || 'Sans titre', chapitre: d.chapitre, resume: d.resume, 'mots-cles': d.motscles }, d.body);
    function refresh() {
      const d = collect(), f = RCMD.parseFiche(build(d));
      $('#preview', v).innerHTML = '<h1 style="font-size:1.5rem">' + E(d.titre || 'Sans titre') + '</h1>' + RCMD.render(f.body).html +
        (f.cards.length ? '<h2>Cartes (' + f.cards.length + ')</h2><ol>' + f.cards.map((c) => '<li><b>' + RCMD.inline(c.q.split('\n')[0]) + '</b><br>' + RCMD.inline(c.a.split('\n')[0]) + '</li>').join('') + '</ol>' : '') +
        (f.quiz.length ? '<h2>Quiz (' + f.quiz.length + ')</h2><ol>' + f.quiz.map((q) => '<li>' + RCMD.inline(q.q.split('\n')[0]) + ' <span class="muted">→ ' + RCMD.inline(q.options[q.answer]) + '</span></li>').join('') + '</ol>' : '');
      $('#info', v).innerHTML = '<span>' + plural(f.cards.length, 'carte') + ' · ' + plural(f.quiz.length, 'question') + ' détectée(s)</span>' +
        f.errors.map((er) => '<div class="err">⚠ ' + E(er) + '</div>').join('');
    }
    const saveDraft = App.debounce(() => { if (dirty) Store.setDraft({ key: draftKey, data: collect() }); }, 400);
    const onInput = App.debounce(refresh, 250);
    v.addEventListener('input', (e) => { if (e.target.closest('.editor-meta, #ed-body')) { dirty = true; onInput(); saveDraft(); } });
    v.addEventListener('change', (e) => { if (e.target === els.matiere) { dirty = true; saveDraft(); } });

    // Barre d'outils : insertion de modèles
    const SNIP = {
      h: ['\n## ', 'Titre de partie', '\n'], b: ['**', 'texte en gras', '**'], m: ['==', 'mot clé', '=='],
      ul: ['\n- ', 'premier point', '\n- deuxième point\n'], tbl: ['\n| Colonne 1 | Colonne 2 |\n|---|---|\n| ', 'case', ' | case |\n'],
      call: ['\n> [!retenir]\n> ', 'Ce qu\'il faut retenir.', '\n'], card: ['\nQ: ', 'Ma question ?', '\nR: Ma réponse.\n'],
      q: ['\n? ', 'Ma question ?', '\n- mauvaise réponse\n+ bonne réponse\n- mauvaise réponse\n! Explication.\n']
    };
    $('#tb', v).addEventListener('click', (e) => {
      const b = e.target.closest('[data-ins]');
      if (!b) return;
      const ta = els.body, [pre, def, post] = SNIP[b.dataset.ins];
      let s = ta.selectionStart, en = ta.selectionEnd;
      const sel = ta.value.slice(s, en) || def;
      let before = pre;
      if (b.dataset.ins === 'card' && !/=== *CARTES *===/i.test(ta.value)) before = '\n=== CARTES ===' + pre;
      if (b.dataset.ins === 'q' && !/=== *(QUIZ|QCM) *===/i.test(ta.value)) { s = en = ta.value.length; before = '\n\n=== QUIZ ===' + pre; }
      ta.setRangeText(before + sel + post, s, en, 'end');
      ta.focus();
      const start = s + before.length;
      ta.setSelectionRange(start, start + sel.length);
      dirty = true; refresh(); saveDraft();
    });
    els.body.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); els.body.setRangeText('  ', els.body.selectionStart, els.body.selectionEnd, 'end'); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    });
    $('#tabs', v).addEventListener('click', (e) => {
      const b = e.target.closest('[data-pane]');
      if (!b) return;
      $$('#tabs button', v).forEach((x) => x.classList.toggle('active', x === b));
      $$('.editor-grid .pane', v).forEach((p) => { p.hidden = p.dataset.pane !== b.dataset.pane; });
      if (b.dataset.pane === 'preview') refresh();
    });

    function save() {
      const d = collect();
      if (!d.titre) { App.toast('Donne un titre à ta fiche.'); els.titre.focus(); return; }
      const ok = Store.upsertUserFiche(fid, build(d));
      if (!ok) { App.toast('Enregistrement impossible : le stockage du navigateur est plein ou bloqué.'); return; }
      Store.clearDraft(); dirty = false;
      reload();
      App.toast('Fiche enregistrée !');
      App.go('#/fiche/' + encodeURIComponent(fid));
    }
    $('#save', v).onclick = save;
    $('#cancel', v).addEventListener('click', () => { Store.clearDraft(); dirty = false; });
    const disc = $('#discard', v);
    if (disc) disc.onclick = () => { Store.clearDraft(); dirty = false; App.navigate(); };
    const del = $('#del', v);
    if (del) del.onclick = () => {
      if (!confirm('Supprimer définitivement cette fiche ?')) return;
      Store.deleteUserFiche(fid); Store.clearDraft(); dirty = false; reload(); App.toast('Fiche supprimée.'); App.go('#/mes-fiches');
    };
    refresh();
    if (!existing) els.titre.focus();
    const beforeUnload = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', beforeUnload);
    return () => window.removeEventListener('beforeunload', beforeUnload);
  });
})();

</script>
<script>
/* RéviCIEL — Atelier réseau : fenêtres des équipements (Config, CLI, Bureau, Services), terminal et configuration IP.
   Fonctionnement inspiré des simulateurs réseau pédagogiques ; dessins et code originaux. */
(function (global) {
  'use strict';
  const { E, $, $$ } = App;
  const NS = global.NetSim, CLI = global.NetCLI;
  const isHost = NS.isHost;
  const A = global.Atelier = global.Atelier || {};

  /* ---------- Icônes des équipements (centrées en 0,0) ---------- */
  A.ICONS = {
    router: '<circle r="23" class="ic"/><path d="M-14 0h28M0-14v28M10-4l4 4-4 4M-10-4l-4 4 4 4M-4 10l4 4 4-4M-4-10l4-4 4 4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
    switch: '<rect x="-33" y="-16" width="66" height="32" rx="8" class="ic"/><path d="M-19-5h32m-4-4 4 4-4 4M19 5h-32m4-4-4 4 4 4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
    pc: '<rect x="-21" y="-22" width="42" height="29" rx="4" class="ic"/><rect x="-17" y="-18" width="34" height="21" rx="2" fill="#dbeafe"/><path d="M-7 8h14l3 7h-20z" class="ic"/>',
    laptop: '<rect x="-19" y="-20" width="38" height="25" rx="3" class="ic"/><rect x="-15" y="-16" width="30" height="17" rx="2" fill="#dbeafe"/><path d="M-25 7h50l-4 7h-42z" class="ic"/>',
    server: '<rect x="-17" y="-25" width="34" height="48" rx="4" class="ic"/><path d="M-10-15h20M-10-7h20M-10 1h20" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="8" cy="13" r="2.6" fill="#4ade80"/>'
  };
  A.TYPES = { router: 'Routeur', switch: 'Switch', pc: 'PC', laptop: 'Ordinateur portable', server: 'Serveur' };
  A.miniIcon = (type, size) => '<svg viewBox="-36 -30 72 60" width="' + (size || 34) + '" height="' + Math.round((size || 34) * 0.83) + '" class="dev ' + type + '" aria-hidden="true">' + A.ICONS[type] + '</svg>';
  A.isConsolePort = (n) => n === 'Console' || n === 'RS232';
  A.shortPort = (n) => n.replace('GigabitEthernet', 'Gig').replace('FastEthernet', 'Fa');

  /* ---------- Terminal (CLI d'un routeur/switch ou invite de commandes d'un PC) ---------- */
  A.mountTerminal = function (box, ctx, id, kind) {
    const sim = ctx.sim(), d = sim.devices[id], isPc = kind === 'host';
    box.innerHTML = '<div class="term' + (isPc ? ' pc' : '') + '"><pre class="term-out"></pre><div class="term-line"><span class="term-prompt"></span>' +
      '<input class="term-in" aria-label="Commande" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></div></div>' +
      (isPc ? '' : '<div class="term-keys"><button data-k="?">?</button><button data-k="tab">Tab</button><button data-k="up">↑</button><button data-k="down">↓</button><button data-k="z">Ctrl+Z</button><button data-k="cls">Effacer l\'écran</button></div>');
    const term = $('.term', box), out = $('.term-out', box), inp = $('.term-in', box), pr = $('.term-prompt', box);
    if (!d.screen) d.screen = CLI.boot(sim, id);
    let hIdx = d.history.length;
    const paint = () => { out.textContent = d.screen; pr.textContent = CLI.promptOf(d); inp.type = CLI.isSecret(d) ? 'password' : 'text'; term.scrollTop = term.scrollHeight; };
    const add = (s) => { d.screen = (d.screen + s).slice(-12000); };
    const run = (line) => {
      const echo = CLI.promptOf(d) + (CLI.isSecret(d) ? '' : line);
      const secretInput = CLI.isSecret(d);
      const res = isPc ? CLI.pcExec(sim, id, line) : CLI.exec(sim, id, line);
      if (res === '\f') d.screen = ''; else add(echo + '\n' + (res ? res + '\n' : ''));
      hIdx = d.history.length;
      paint();
      const m = !secretInput && line.trim().match(/^(ping|tracert|traceroute)\s+(\S+)/i);
      if (m && ctx.onPing) {
        const ip = NS.ipToInt(m[2]) != null ? NS.ipToInt(m[2]) : isPc ? (sim.resolve(id, m[2]).ip || null) : null;
        if (ip != null) ctx.onPing(id, ip);
      }
      ctx.changed('cli');
    };
    const help = () => { const line = inp.value; add(CLI.promptOf(d) + line + '?\n' + CLI.help(sim, id, line) + '\n'); paint(); ctx.changed('cli'); inp.focus(); };
    const ctrlZ = () => { const p = CLI.promptOf(d), r = CLI.ctrlZ(sim, id); add(p + inp.value + '^Z\n' + (r ? r + '\n' : '')); inp.value = ''; paint(); ctx.changed('cli'); };
    const hist = (dir) => { if (dir < 0 && hIdx > 0) hIdx--; else if (dir > 0 && hIdx < d.history.length) hIdx++; inp.value = d.history[hIdx] || ''; };
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); const line = inp.value; inp.value = ''; run(line); }
      else if (e.key === '?' && !isPc && !CLI.isSecret(d)) { e.preventDefault(); help(); }
      else if (e.key === 'Tab') { e.preventDefault(); inp.value = CLI.complete(sim, id, inp.value); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); hist(-1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); hist(1); }
      else if (e.ctrlKey && (e.key === 'z' || e.key === 'Z') && !isPc) { e.preventDefault(); ctrlZ(); }
      e.stopPropagation();
    });
    inp.addEventListener('input', () => { if (!isPc && !CLI.isSecret(d) && inp.value.slice(-1) === '?') { inp.value = inp.value.slice(0, -1); help(); } });
    term.addEventListener('click', () => { if (!String(window.getSelection())) inp.focus({ preventScroll: true }); });
    $$('.term-keys button', box).forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.k;
      if (k === '?') help(); else if (k === 'tab') inp.value = CLI.complete(sim, id, inp.value);
      else if (k === 'up') hist(-1); else if (k === 'down') hist(1); else if (k === 'z') ctrlZ();
      else if (k === 'cls') { d.screen = ''; paint(); ctx.changed('cli'); }
      inp.focus({ preventScroll: true });
    }));
    paint();
    if (window.innerWidth > 900) setTimeout(() => inp.focus({ preventScroll: true }), 30);
  };

  /* ---------- Configuration IP d'un hôte (PC, portable, serveur) ---------- */
  A.ipForm = function (box, ctx, id) {
    const sim = ctx.sim(), d = sim.devices[id];
    box.innerHTML = '<div class="row between"><b>Interface FastEthernet0</b><div class="seg ipmode"><button data-m="dhcp">DHCP</button><button data-m="static">Statique</button></div></div>' +
      '<div class="pc-grid"><label class="field"><span>Adresse IPv4</span><input class="input" data-f="ip" inputmode="decimal" placeholder="192.168.1.10"></label>' +
      '<label class="field"><span>Masque de sous-réseau</span><input class="input" data-f="mask" inputmode="decimal" placeholder="255.255.255.0"></label>' +
      '<label class="field"><span>Passerelle par défaut</span><input class="input" data-f="gw" inputmode="decimal" placeholder="192.168.1.1"></label>' +
      '<label class="field"><span>Serveur DNS</span><input class="input" data-f="dns" inputmode="decimal" placeholder="8.8.8.8"></label></div>' +
      '<div class="row"><button class="btn" data-save>Enregistrer</button><span class="small ipmsg"></span></div><p class="small muted">Adresse MAC : ' + E(d.mac) + '</p>';
    const f = (k) => $('[data-f="' + k + '"]', box), msg = $('.ipmsg', box);
    const say = (t, ok) => { msg.textContent = t; msg.className = 'small ipmsg ' + (ok ? 'status-ok' : 'status-warn'); };
    const fill = () => {
      const p = d.pc, s = (n) => (n != null ? NS.ipStr(n) : '');
      f('ip').value = s(p.ip); f('mask').value = s(p.mask); f('gw').value = s(p.gw); f('dns').value = s(p.dns);
      $$('.ipmode button', box).forEach((b) => b.classList.toggle('active', (b.dataset.m === 'dhcp') === !!p.dhcp));
      $$('[data-f]', box).forEach((i) => { i.disabled = !!p.dhcp; });
    };
    f('ip').addEventListener('blur', () => {
      const ip = NS.ipToInt(f('ip').value);
      if (ip != null && !f('mask').value.trim()) f('mask').value = ip >>> 24 < 128 ? '255.0.0.0' : ip >>> 24 < 192 ? '255.255.0.0' : '255.255.255.0';
    });
    $('.ipmode', box).addEventListener('click', (e) => {
      const b = e.target.closest('[data-m]');
      if (!b) return;
      if (b.dataset.m === 'dhcp') {
        d.pc.dhcp = true;
        const r = CLI.dhcpApply(sim, d);
        say(r.ok ? 'Adresse obtenue du serveur DHCP ' + NS.ipStr(r.server) + '.' : 'Échec de la requête DHCP : adresse automatique APIPA (169.254.x.x).', r.ok);
      } else { d.pc.dhcp = false; sim.release(id); say('Mode statique : saisis l\'adresse puis Enregistrer.', true); }
      fill(); ctx.changed('ip');
    });
    $('[data-save]', box).addEventListener('click', () => {
      if (d.pc.dhcp) return say('L\'interface est en DHCP : passe en « Statique » pour saisir une adresse.', false);
      const v = (k) => f(k).value.trim();
      const ip = NS.ipToInt(v('ip')), mask = NS.ipToInt(v('mask'));
      const gw = v('gw') ? NS.ipToInt(v('gw')) : null, dns = v('dns') ? NS.ipToInt(v('dns')) : null;
      if (ip == null) return say('Adresse IP invalide (exemple : 192.168.1.10).', false);
      if (mask == null || NS.maskLen(mask) < 0) return say('Masque invalide (exemple : 255.255.255.0).', false);
      if (v('gw') && gw == null) return say('Passerelle invalide.', false);
      if (v('dns') && dns == null) return say('Adresse DNS invalide.', false);
      if (NS.maskLen(mask) < 31 && (ip === NS.net(ip, mask) || ip === ((NS.net(ip, mask) | ~mask) >>> 0))) return say('C\'est l\'adresse du réseau ou de broadcast : choisis une adresse d\'hôte.', false);
      Object.assign(d.pc, { ip, mask, gw, dns });
      if (gw != null && !NS.same(ip, gw, mask)) say('Enregistré, mais attention : la passerelle n\'est pas dans le même réseau.', false);
      else say('Configuration enregistrée.', true);
      ctx.changed('ip');
    });
    box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); $('[data-save]', box).click(); } });
    fill();
  };

  /* ---------- Configuration graphique d'un routeur/switch (avec commandes IOS équivalentes) ---------- */
  function iosRun(ctx, id, cmds, log) {
    const sim = ctx.sim(), d = sim.devices[id];
    const keep = { mode: d.mode, ctx: d.ctx, pending: d.pending, hist: d.history.length };
    d.mode = 'config'; d.ctx = null; d.pending = null;
    const lines = cmds.map((c) => { const p = CLI.promptOf(d); const o = CLI.exec(sim, id, c); return p + c + (o ? '\n' + o : ''); });
    d.mode = keep.mode; d.ctx = keep.ctx; d.pending = keep.pending; d.history.length = keep.hist;
    log.textContent += lines.join('\n') + '\n';
    log.scrollTop = log.scrollHeight;
    ctx.changed('config');
  }
  function netConfig(box, ctx, id) {
    const sim = ctx.sim(), d = sim.devices[id];
    const ifs = NS.sortIfs(Object.keys(d.cfg.ifs).filter((n) => n.indexOf('.') === -1));
    box.innerHTML = '<div class="dw-cols"><nav class="dw-side"><div class="dw-sec">Global</div><button data-p="global" class="on">Paramètres</button><div class="dw-sec">Interfaces</div>' +
      ifs.map((n) => '<button data-p="' + E(n) + '">' + E(n) + '</button>').join('') + '</nav><section class="dw-pane"></section></div>' +
      '<div class="ios-log"><div class="small muted">Commandes IOS équivalentes</div><pre></pre></div>';
    const pane = $('.dw-pane', box), log = $('.ios-log pre', box);
    function show(p) {
      $$('.dw-side button', box).forEach((b) => b.classList.toggle('on', b.dataset.p === p));
      if (p === 'global') {
        pane.innerHTML = '<h4>Paramètres globaux</h4><label class="field"><span>Nom affiché (sur le schéma)</span><input class="input" data-k="label" value="' + E(d.label) + '"></label>' +
          '<label class="field"><span>Hostname (nom IOS)</span><div class="row"><input class="input" data-k="host" value="' + E(d.cfg.hostname) + '" style="flex:1"><button class="btn sm" data-a="host">Appliquer</button></div></label>' +
          '<div class="row" style="margin-top:12px"><button class="btn secondary sm" data-a="save">Enregistrer la configuration (NVRAM)</button><span class="small ' + (sim.saved(id) ? 'status-ok' : 'status-warn') + '">' + (sim.saved(id) ? 'Configuration enregistrée' : 'Modifications non enregistrées') + '</span></div>';
        $('[data-k="label"]', pane).addEventListener('change', (e) => { d.label = e.target.value.trim() || d.id; ctx.changed('label'); });
        $('[data-a="host"]', pane).addEventListener('click', () => { const h = $('[data-k="host"]', pane).value.trim(); if (h) iosRun(ctx, id, ['hostname ' + h], log); show('global'); });
        $('[data-a="save"]', pane).addEventListener('click', () => { sim.save(id); log.textContent += d.cfg.hostname + '#copy running-config startup-config\nBuilding configuration...\n[OK]\n'; ctx.changed('config'); show('global'); });
        return;
      }
      const i = d.cfg.ifs[p], isSw = d.type === 'switch' && p.indexOf('Vlan') !== 0;
      const link = sim.linkOf(id, p), up = sim.ifUp(id, p);

  function escClose(e) { if (e.key === 'Escape') A.closeDevice(); }
  A.openDevice = function (ctx, id, tab) {
    A.closeDevice();

    const tabs = host ? [['config', 'Config'], ['bureau', 'Bureau']].concat(d.type === 'server' ? [['services', 'Services']] : []) : [['config', 'Config'], ['cli', 'CLI']];

    wrap.innerHTML = '<div class="dw" role="dialog" aria-modal="true" aria-label="' + E(d.label) + '"><div class="dw-head">' + A.miniIcon(d.type, 30) + '<div class="dw-title"><b>' + E(d.label) + '</b><span class="small muted">' + A.TYPES[d.type] + '</span></div>' +
      '<div class="seg dw-tabs">' + tabs.map((t) => '<button data-tab="' + t[0] + '">' + t[1] + '</button>').join('') + '</div><button class="icon-btn dw-close" aria-label="Fermer">✕</button></div><div class="dw-body"></div></div>';
    document.body.appendChild(wrap);

      $$('.dw-tabs button', wrap).forEach((b) => b.classList.toggle('active', b.dataset.tab === t));
      body.innerHTML = '';

      else if (t === 'config' && host) {
        body.innerHTML = '<label class="field" style="margin-bottom:14px"><span>Nom affiché</span><input class="input" data-k="label" value="' + E(d.label) + '"></label><div class="ipbox"></div>';
        $('[data-k="label"]', body).addEventListener('change', (e) => { d.label = e.target.value.trim() || d.id; ctx.changed('label'); $('.dw-title b', wrap).textContent = d.label; });

<script>
/* RéviCIEL — Atelier réseau : espace de travail (poser des équipements, câbler, envoyer des messages, mode Simulation). */
(function (global) {
  'use strict';
  const { E, $, $$ } = App;
  const NS = global.NetSim, A = global.Atelier;
  const isHost = NS.isHost;
  const CABLES = {
    auto: { name: 'Automatique', short: 'Auto', desc: 'choisit le bon câble et des ports libres' },
    droit: { name: 'Câble droit', short: 'Droit', desc: 'équipements différents : PC ou routeur ↔ switch' },
    croise: { name: 'Câble croisé', short: 'Croisé', desc: 'équipements semblables : switch ↔ switch, PC ↔ PC, PC ↔ routeur, routeur ↔ routeur' },
    console: { name: 'Câble console', short: 'Console', desc: 'port RS232 du PC → port Console d\'un routeur ou d\'un switch' }
  };
  const CABLE_ICON = {
    auto: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    droit: '<path d="M4 20 20 4"/>',
    croise: '<path d="M4 20 20 4" stroke-dasharray="4 3"/>',
    console: '<path d="M4 18c6 0 4-12 16-12" stroke-dasharray="2 3"/>'
  };
  const TOOL_ICON = {
    select: '<path d="m5 3 14 8-6 2-3 6z"/>',
    del: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    pdu: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="m3 7 9 6 9-6"/>'
  };
  const svgI = (p) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';

  /* opts : { sim(): Sim, world: {w,h}, canPlace, canCable, changed(kind) } */
  A.Workspace = function (root, opts) {
    const W = opts.world.w, H = opts.world.h;
    let tool = 'select', placeType = null, cableType = null, cableA = null, pduSrc = null, pointer = null, drag = null;
    let simMode = false, speed = 1;
    const pdus = [];
    let anim = null;
    const S = () => opts.sim();
    const editable = opts.canPlace || opts.canCable;

    root.innerHTML = '<div class="ws">' +
      '<div class="ws-bar"><div class="ws-tools">' +
      '<button data-tool="select" class="on" title="Sélectionner / ouvrir un équipement (Échap)">' + svgI(TOOL_ICON.select) + '<span>Sélection</span></button>' +
      (editable ? '<button data-tool="del" title="Supprimer un équipement ou un câble">' + svgI(TOOL_ICON.del) + '<span>Supprimer</span></button>' : '') +
      '<button data-tool="pdu" title="Message simple : envoie un ping d\'un équipement à un autre">' + svgI(TOOL_ICON.pdu) + '<span>Message simple</span></button></div>' +
      '<div class="seg ws-mode"><button data-sim="0" class="active">Temps réel</button><button data-sim="1">Simulation</button></div></div>' +
      '<div class="ws-hint"></div>' +
      '<div class="ws-wrap"><svg class="ws-svg' + (W <= 700 ? ' ws-fit' : '') + '" viewBox="0 0 ' + W + ' ' + H + '"' + (W > 700 ? ' style="min-width:700px"' : '') + ' role="img" aria-label="Espace de travail du réseau">' +
      '<defs><pattern id="ws-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" class="grid-line"/></pattern></defs>' +
      '<rect width="' + W + '" height="' + H + '" fill="url(#ws-grid)" class="ws-bg"/><g class="ws-main"></g><g class="ws-anim"></g></svg><div class="ws-menu" hidden></div></div>' +
      '<div class="ws-bottom">' +
      (editable ? '<div class="ws-palette">' +
        (opts.canPlace ? '<div class="pal-group"><span class="pal-title">Équipements</span><div class="pal-items">' +
          ['router', 'switch', 'pc', 'laptop', 'server'].map((t) => '<button data-place="' + t + '" title="' + A.TYPES[t] + '">' + A.miniIcon(t, 30) + '<span>' + A.TYPES[t].replace('Ordinateur portable', 'Portable') + '</span></button>').join('') + '</div></div>' : '') +
        (opts.canCable ? '<div class="pal-group"><span class="pal-title">Connexions</span><div class="pal-items">' +
          Object.keys(CABLES).map((c) => '<button data-cable="' + c + '" class="cb-' + c + '" title="' + CABLES[c].name + ' : ' + CABLES[c].desc + '">' + svgI(CABLE_ICON[c]) + '<span>' + CABLES[c].short + '</span></button>').join('') + '</div></div>' : '') +
        '</div>' : '') +
      '<div class="ws-pdus"><div class="row between"><b>Messages envoyés</b><span class="row"><label class="small sim-only" hidden>Vitesse <select class="spd"><option value="0.5">lente</option><option value="1" selected>normale</option><option value="2">rapide</option></select></label><button class="btn ghost sm" data-clear>Effacer</button></span></div>' +
      '<div class="pdu-list"></div><div class="events sim-only" hidden></div></div></div></div>';

    const svg = $('.ws-svg', root), main = $('.ws-main', root), animL = $('.ws-anim', root), menu = $('.ws-menu', root), wrap = $('.ws-wrap', root), hintEl = $('.ws-hint', root);

    const hint = (t) => { hintEl.textContent = t || defaultHint; };

    function ctx() {
      return {
        sim: S,
        changed: (k) => { draw(); opts.changed(k); },
        onPing: (src, ip) => { if (simMode) runAnim(S().trace(src, ip), src, ip); }

    /* ---------- Outils ---------- */
    function setTool(t, extra) {
      tool = t; placeType = t === 'place' ? extra : null; cableType = t === 'cable' ? extra : null; cableA = null; pduSrc = null;

      $$('[data-place]', root).forEach((b) => b.classList.toggle('on', t === 'place' && b.dataset.place === extra));

      if (t === 'place') hint('Touche l\'espace de travail pour poser : ' + A.TYPES[extra] + '.');
      else if (t === 'cable') hint(CABLES[extra].name + ' : touche le premier équipement' + (extra === 'auto' ? '.' : ', puis choisis le port.'));
      else if (t === 'del') hint('Touche un équipement ou un câble pour le supprimer.');
      else if (t === 'pdu') hint('Message simple : touche l\'équipement source.');
      else hint();
      draw();
    }
    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-tool],[data-place],[data-cable],[data-sim],[data-clear]');
      if (!b || !root.contains(b)) return;
      if (b.dataset.tool) setTool(b.dataset.tool === tool && b.dataset.tool !== 'select' ? 'select' : b.dataset.tool);

      else if (b.dataset.cable) setTool(tool === 'cable' && cableType === b.dataset.cable ? 'select' : 'cable', b.dataset.cable);
      else if (b.dataset.sim != null) {
        simMode = b.dataset.sim === '1';
        $$('[data-sim]', root).forEach((x) => x.classList.toggle('active', x === b));
        $$('.sim-only', root).forEach((x) => { x.hidden = !simMode; });

        if (!simMode) stopAnim();
        hint(simMode ? 'Mode Simulation : envoie un message simple (ou un ping depuis un PC) pour voir le paquet voyager.' : '');
      } else if (b.hasAttribute('data-clear')) { pdus.length = 0; renderPdus(); $('.events', root).innerHTML = ''; stopAnim(); }
    });
    $('.spd', root).addEventListener('change', (e) => { speed = parseFloat(e.target.value) || 1; });

    /* ---------- Menu de choix (ports, adresses) ---------- */
    function closeMenu() { menu.hidden = true; menu.innerHTML = ''; }
    function showMenu(ev, title, items, onPick) {
      menu.innerHTML = '<div class="menu-title">' + E(title) + '</div>' + items.map((it, k) => '<button data-k="' + k + '"' + (it.disabled ? ' disabled' : '') + '>' + E(it.label) + (it.sub ? '<small>' + E(it.sub) + '</small>' : '') + '</button>').join('');

      menu.onclick = (e) => { const b = e.target.closest('[data-k]'); if (!b || b.disabled) return; closeMenu(); onPick(items[+b.dataset.k].value); };
    }

    /* ---------- Dessin ---------- */
    function sideState(sim, l, side) {
      if (sim.physUp(side[0], side[1])) return 'up';

    function draw() {
      const sim = S();
      let s = '';
      sim.links.forEach((l, i) => {

        if (!a || !b) return;

        const kind = con ? 'console' : l.cable === 'auto' ? sim.rightCable(l.a[0], l.b[0]) : l.cable;
        const ok = con || sim.cableOk(l);
        s += '<line class="lk-hit" data-link="' + i + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"/>';
        s += '<line class="lk c-' + kind + (ok ? '' : ' bad') + (!con && sim.physUp(l.a[0], l.a[1]) ? ' up' : '') + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"/>';
        [[a, b, l.a], [b, a, l.b]].forEach(([D, O, side]) => {
          const len = Math.hypot(O.x - D.x, O.y - D.y) || 1, ux = (O.x - D.x) / len, uy = (O.y - D.y) / len;
          const dl = Math.min(36, len * 0.3), dt = Math.min(50, len * 0.4), px = -uy, py = ux;
          if (!con) s += '<circle cx="' + (D.x + ux * dl).toFixed(1) + '" cy="' + (D.y + uy * dl).toFixed(1) + '" r="5" class="light ' + sideState(sim, l, side) + '"/>';
          s += '<text x="' + (D.x + ux * dt + px * 13).toFixed(1) + '" y="' + (D.y + uy * dt + py * 13 + 4).toFixed(1) + '" class="pl" text-anchor="' + (px > 0.35 ? 'start' : px < -0.35 ? 'end' : 'middle') + '">' + A.shortPort(side[1]) + '</text>';
        });
      });
      if (cableA && pointer) { const a = sim.devices[cableA[0]]; if (a) s += '<line class="lk tmp" x1="' + a.x + '" y1="' + a.y + '" x2="' + pointer.x + '" y2="' + pointer.y + '"/>'; }
      sim.order.forEach((id) => {
        const d = sim.devices[id];
        const sel = (cableA && cableA[0] === id) || pduSrc === id;
        let sub = '';
        if (isHost(d.type)) sub = d.pc.ip != null ? NS.ipStr(d.pc.ip) : 'pas d\'IP';
        else if (d.cfg.hostname !== d.label && d.cfg.hostname !== (d.type === 'switch' ? 'Switch' : 'Router')) sub = d.cfg.hostname;
        s += '<g class="dev ' + d.type + (sel ? ' sel' : '') + '" data-dev="' + E(id) + '" transform="translate(' + d.x + ' ' + d.y + ')" tabindex="0" role="button" aria-label="' + E(d.label) + '">' +
          '<circle r="38" class="halo"/>' + A.ICONS[d.type] + '<text y="' + (d.type === 'server' ? 40 : 34) + '" class="dl">' + E(d.label) + '</text>' + (sub ? '<text y="' + (d.type === 'server' ? 53 : 47) + '" class="dip">' + E(sub) + '</text>' : '') + '</g>';
      });
      main.innerHTML = s;
    }

    /* ---------- Coordonnées et interactions ---------- */
    function toWorld(e) {
      const p = svg.createSVGPoint();
      p.x = e.clientX; p.y = e.clientY;
      const m = svg.getScreenCTM();
      const r = m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 };
      return { x: Math.max(30, Math.min(W - 30, r.x)), y: Math.max(30, Math.min(H - 45, r.y)) };
    }
    svg.addEventListener('pointerdown', (e) => {
      closeMenu();
      const g = e.target.closest('[data-dev]');
      if (g) {
        const d = S().devices[g.getAttribute('data-dev')], pt = toWorld(e);
        drag = { id: d.id, sx: pt.x, sy: pt.y, ox: d.x, oy: d.y, moved: false, ev: e };
        try { svg.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
        return;
      }
      const lk = e.target.closest('[data-link]');
      if (lk) { linkClick(S().links[+lk.getAttribute('data-link')]); return; }
      canvasClick(toWorld(e));
    });
    /* sur écran tactile : toucher un équipement le déplace au lieu de faire défiler la page */
    svg.addEventListener('touchstart', (e) => { if (e.target.closest && e.target.closest('[data-dev]')) e.preventDefault(); }, { passive: false });
    svg.addEventListener('pointermove', (e) => {
      pointer = toWorld(e);
      if (drag) {
        const dx = pointer.x - drag.sx, dy = pointer.y - drag.sy;
        if (!drag.moved && Math.hypot(dx, dy) < 6) return;
        drag.moved = true;
        const d = S().devices[drag.id];
        d.x = Math.round(Math.max(30, Math.min(W - 30, drag.ox + dx)));
        d.y = Math.round(Math.max(30, Math.min(H - 45, drag.oy + dy)));
        draw();
      } else if (cableA) draw();
    });
    svg.addEventListener('pointerup', (e) => {
      if (!drag) return;
      const dr = drag;
      drag = null;
      if (dr.moved) opts.changed('move'); else deviceClick(dr.id, e);
    });
    svg.addEventListener('keydown', (e) => {
      const g = e.target.closest && e.target.closest('[data-dev]');
      if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); deviceClick(g.getAttribute('data-dev'), { clientX: 200, clientY: 200 }); }
    });
    const onKey = (e) => { if (e.key === 'Escape' && !document.querySelector('.dw-back') && tool !== 'select') setTool('select'); };
    document.addEventListener('keydown', onKey);
    const onScroll = (e) => { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); };
    window.addEventListener('scroll', onScroll, true);

    function canvasClick(pt) {
      if (tool === 'place' && placeType) {
        const id = S().addDevice(placeType, Math.round(pt.x), Math.round(pt.y));
        hint(S().devices[id].label + ' ajouté. Touche-le pour le configurer.');
        setTool('select');
        opts.changed('device');
        return;
      }
      if (cableA) { cableA = null; hint('Câblage annulé.'); draw(); }
    }
    function linkClick(l) {
      if (tool !== 'del' || !l) return;
      S().removeLink(l);
      hint('Câble supprimé.');
      draw(); opts.changed('link');
    }
    function deviceClick(id, ev) {
      const sim = S(), d = sim.devices[id];
      if (tool === 'select' || tool === 'place') { A.openDevice(ctx(), id); return; }
      if (tool === 'del') {
        if (!opts.canPlace) { App.toast('Dans ce lab, on ne supprime pas les équipements (seulement les câbles).'); return; }
        if (confirm('Supprimer ' + d.label + ' et ses câbles ?')) { sim.removeDevice(id); hint(d.label + ' supprimé.'); draw(); opts.changed('device'); }
        return;
      }
      if (tool === 'cable') return cableClick(id, ev);
      if (tool === 'pdu') return pduClick(id, ev);
    }

    /* ---------- Câblage ---------- */
    function cableClick(id, ev) {
      const sim = S(), d = sim.devices[id];
      if (cableA && cableA[0] === id) return;
      const isCon = cableType === 'console';
      const ports = sim.ports(id).filter((p) => (isCon ? A.isConsolePort(p) : !A.isConsolePort(p)));
      const free = ports.filter((p) => !sim.portUsed(id, p));
      if (!free.length) { App.toast('Plus aucun port libre adapté sur ' + d.label + '.'); return; }
      const pick = (port) => {
        if (!cableA) { cableA = [id, port]; hint('Touche maintenant le deuxième équipement (Échap pour annuler).'); draw(); return; }
        const a = cableA, cable = cableType === 'auto' ? sim.rightCable(a[0], id) : cableType;
        const err = sim.addLink(a[0], a[1], id, port, cable);
        cableA = null;
        if (err) { App.toast(err, { duration: 5000 }); hint(); draw(); return; }
        const l = sim.links[sim.links.length - 1];
        setTool('select');
        if (cable !== 'console' && !sim.cableOk(l)) {
          const need = sim.rightCable(a[0], id) === 'croise' ? 'croisé' : 'droit';
          App.toast('Lien rouge : mauvais câble ! Entre ' + sim.devices[a[0]].label + ' et ' + d.label + ', il faut un câble ' + need + '.', { duration: 7000 });
          hint('Mauvais câble : supprime-le (outil Supprimer) et rebranche avec un câble ' + need + '.');
        } else hint('Câble branché : ' + sim.devices[a[0]].label + ' (' + A.shortPort(a[1]) + ') ↔ ' + d.label + ' (' + A.shortPort(port) + ').');
        opts.changed('link');
      };
      if (cableType === 'auto') pick(free[0]);
      else showMenu(ev, d.label + ' : choisis le port', ports.map((p) => ({ label: p, sub: sim.portUsed(id, p) ? 'occupé' : '', disabled: sim.portUsed(id, p), value: p })), pick);
    }

    /* ---------- Message simple (ping) ---------- */
    function ipsOf(id) {
      const d = S().devices[id];
      if (isHost(d.type)) return d.pc.ip != null ? [d.pc.ip] : [];
      return NS.sortIfs(Object.keys(d.cfg.ifs)).filter((n) => d.cfg.ifs[n].ip != null).map((n) => d.cfg.ifs[n].ip);
    }
    function pduClick(id, ev) {
      const sim = S(), d = sim.devices[id];
      if (!pduSrc) {
        if (!ipsOf(id).length) { App.toast(d.label + ' n\'a pas encore d\'adresse IP.'); return; }
        pduSrc = id; hint('Touche maintenant l\'équipement de destination.'); draw(); return;
      }
      if (id === pduSrc) return;
      const ips = ipsOf(id);
      if (!ips.length) { App.toast(d.label + ' n\'a pas d\'adresse IP : impossible de lui envoyer un message.'); return; }
      const src = pduSrc;
      const go = (ip) => { send(src, id, ip); setTool('select'); };
      if (ips.length === 1) go(ips[0]);
      else showMenu(ev, 'Adresse de destination', ips.map((ip) => ({ label: NS.ipStr(ip), value: ip })), go);
    }
    function send(src, dstId, ip) {
      const sim = S(), t = sim.trace(src, ip);
      const sd = sim.devices[src];
      (t.ok ? sd.pingOk : sd.pingFail)[NS.ipStr(ip)] = 1;
      pdus.unshift({ src, dst: dstId, ip, ok: t.ok, why: t.why, t });
      renderPdus();
      if (simMode) runAnim(t, src, ip);
      else App.toast((t.ok ? 'Réussi : ' : 'Échec : ') + sd.label + ' → ' + sim.devices[dstId].label + ' (' + NS.ipStr(ip) + ')');
      opts.changed('pdu');
    }
    const WHY = { noip: 'la source n\'a pas d\'adresse IP', nogw: 'pas de passerelle pour sortir du réseau', timeout: 'personne ne répond (câble, VLAN, adresse ?)', noroute: 'un routeur ne connaît pas le réseau de destination', acl: 'bloqué par une ACL', noreply: 'la réponse ne revient pas (passerelle ou route du retour ?)', ttl: 'boucle de routage' };
    function renderPdus() {
      const sim = S(), box = $('.pdu-list', root);
      if (!pdus.length) { box.innerHTML = '<p class="small muted">Aucun message. Utilise l\'outil « Message simple » (l\'enveloppe) : touche la source, puis la destination.</p>'; return; }
      box.innerHTML = '<table class="mini pdu"><thead><tr><th>Statut</th><th>Source</th><th>Destination</th><th>Type</th><th></th></tr></thead><tbody>' + pdus.slice(0, 12).map((p, k) => {
        const s = sim.devices[p.src], d = sim.devices[p.dst];
        return '<tr><td><span class="badge ' + (p.ok ? 'ok' : 'bad') + '">' + (p.ok ? 'Réussi' : 'Échec') + '</span></td><td>' + E(s ? s.label : '?') + '</td><td>' + E(d ? d.label : '?') + ' <span class="muted small">' + NS.ipStr(p.ip) + '</span></td><td>ICMP</td>' +
          '<td><button class="btn ghost sm" data-replay="' + k + '" title="Revoir dans le mode Simulation">▶</button></td></tr>' + (!p.ok && WHY[p.why] ? '<tr class="why"><td colspan="5" class="small muted">Cause probable : ' + WHY[p.why] + '</td></tr>' : '');
      }).join('') + '</tbody></table>';
    }
    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-replay]');
      if (!b) return;
      const p = pdus[+b.dataset.replay];
      if (!p) return;
      if (!simMode) $('[data-sim="1"]', root).click();
      runAnim(S().trace(p.src, p.ip), p.src, p.ip);
    });

    /* ---------- Animation du mode Simulation ---------- */
    function stopAnim() { if (anim) { cancelAnimationFrame(anim.raf); anim = null; } animL.innerHTML = ''; }
    function runAnim(t, src, ip) {
      stopAnim();
      const sim = S();
      const pts = t.path.map((id) => sim.devices[id]).filter(Boolean);
      const legs = [];
      for (let i = 0; i + 1 < pts.length; i++) legs.push({ a: pts[i], b: pts[i + 1], reply: false });
      if (t.ok) for (let i = pts.length - 1; i > 0; i--) legs.push({ a: pts[i], b: pts[i - 1], reply: true });
      const ev = $('.events', root);
      ev.innerHTML = '<div class="small muted">Liste des événements — ping de ' + E(sim.devices[src].label) + ' vers ' + NS.ipStr(ip) + '</div><ol>' + legs.map((l) => '<li>' + E(l.a.label) + ' → ' + E(l.b.label) + ' <span class="badge ' + (l.reply ? 'ok' : 'info') + '">ICMP ' + (l.reply ? 'Echo Reply' : 'Echo Request') + '</span></li>').join('') +
        '<li class="end">' + (t.ok ? '✓ Réponse reçue : ping réussi' : '✗ Échec : ' + (WHY[t.why] || 'le paquet est perdu')) + '</li></ol>';
      let k = 0, t0 = null;
      const env = (x, y, reply) => '<g class="env' + (reply ? ' reply' : '') + '" transform="translate(' + x + ' ' + (y - 30) + ')"><rect x="-12" y="-8" width="24" height="16" rx="2"/><path d="m-12-8 12 9 12-9"/></g>';
      const mark = (d, ok) => '<g class="mark ' + (ok ? 'ok' : 'ko') + '" transform="translate(' + d.x + ' ' + (d.y - 34) + ')"><circle r="13"/><path d="' + (ok ? 'm-6 0 4 4 8-8' : 'm-5-5 10 10m0-10-10 10') + '"/></g>';
      const items = $$('li', ev);
      const step = (ts) => {
        if (!anim) return;
        if (k >= legs.length) {
          const last = t.ok ? pts[0] : pts[pts.length - 1];
          animL.innerHTML = last ? mark(last, t.ok) : '';
          items.forEach((li) => li.classList.remove('cur'));
          if (items.length) items[items.length - 1].classList.add('cur');
          anim = null;
          return;
        }
        if (t0 == null) t0 = ts;
        const dur = 700 / speed, p = Math.min(1, (ts - t0) / dur), L = legs[k];
        items.forEach((li, i) => li.classList.toggle('cur', i === k));
        animL.innerHTML = env(L.a.x + (L.b.x - L.a.x) * p, L.a.y + (L.b.y - L.a.y) * p, L.reply);
        if (p >= 1) { k++; t0 = null; }
        anim.raf = requestAnimationFrame(step);
      };
      if (!legs.length) { animL.innerHTML = pts[0] ? mark(pts[0], false) : ''; return; }
      anim = { raf: requestAnimationFrame(step) };
    }

    draw();
    renderPdus();
    return {
      redraw: draw,
      openDevice: (id, tab) => A.openDevice(ctx(), id, tab),
      destroy: () => { stopAnim(); document.removeEventListener('keydown', onKey); window.removeEventListener('scroll', onScroll, true); A.closeDevice(); }
    };
  };
})(window);

</script>
<script>
/* RéviCIEL — Labo réseau : liste des labs, page d'un lab (espace de travail + objectifs) et mode libre. */
(function () {
  'use strict';
  const { E, icon, $, $$, bar } = App;
  const NS = window.NetSim, CLI = window.NetCLI, A = window.Atelier;
  const KEY = (id) => 'reviciel.labo.' + id;
  const helpers = (sim) => window.labHelpers(sim);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: (k) => { try { localStorage.removeItem(k); } catch (e) { /* rien */ } }
  };

  function createSim(lab, fresh) {
    const sim = new NS.Sim(lab);
    Object.keys(lab.setup || {}).forEach((id) => CLI.runSetup(sim, id, lab.setup[id]));
    if (!fresh) { const j = store.get(KEY(lab.id)); if (j) sim.restore(j); }
    return sim;
  }
  const labState = (id) => Store.state.labs[id] || { goals: [], done: false };
  const levelOf = (n) => window.LAB_LEVELS.find((x) => x.n === n);

  /* ---------- Liste des labs ---------- */
  function labRow(l) {
    const st = labState(l.id), L = levelOf(l.level);
    const nd = (st.goals || []).filter(Boolean).length;
    const badge = st.done ? '<span class="badge ok">' + icon('check') + ' Réussi</span>' : nd ? '<span class="badge warn">' + Math.round((nd / l.goals.length) * 100) + ' %</span>' : '<span class="badge">Nouveau</span>';
    return '<a class="fiche-row" style="--c:' + L.color + '" href="#/labo/' + l.id + '"><span class="num' + (st.done ? ' done' : '') + '">' + (st.done ? icon('check') : icon('network')) + '</span>' +
      '<div class="body"><h3>' + E(l.title) + '</h3><p>' + E(l.desc) + '</p><div class="badges">' + badge + '<span class="badge">' + icon('clock') + ' ' + l.time + '</span>' + (l.cabling ? '<span class="badge violet">Câblage</span>' : '') + '</div></div>' + icon('right', 'chev') + '</a>';
  }
  App.route(/^\/labo$/, (v) => {
    App.setTitle('Labo réseau');
    const total = window.LABS.length, done = window.LABS.filter((l) => labState(l.id).done).length;
    let html = '<div class="page-head"><h1>Labo réseau</h1><p>Un simulateur qui fonctionne comme Packet Tracer : pose des routeurs, des switchs et des PC, câble-les, configure-les en ligne de commande Cisco IOS, envoie des messages et regarde les paquets voyager en mode Simulation. Il marche aussi sans connexion.</p></div>' +
      '<a class="card tool-card lab-promo" style="--c:#7c3aed" href="#/labo/libre"><span class="s-icon">' + icon('pen') + '</span><div style="flex:1"><h3>Mode libre : construis ton réseau</h3><p>Espace de travail vide : équipements, câbles droits/croisés/console, serveur web, DNS et DHCP, mode Simulation. Tes réseaux sont enregistrés et exportables.</p></div>' + icon('right', 'chev') + '</a>' +
      '<div class="card section">' + bar(done / total, '#0284c7') + '<div class="row between small" style="margin-top:8px"><span>' + done + ' / ' + total + ' labs réussis</span><a href="#/labo/' + (window.LABS.find((l) => !labState(l.id).done) || window.LABS[0]).id + '">Continuer →</a></div></div>';
    window.LAB_LEVELS.forEach((L) => {
      const labs = window.LABS.filter((l) => l.level === L.n);
      const n = labs.filter((l) => labState(l.id).done).length;
      html += '<section class="section"><div class="section-head"><h2><span class="lvl" style="--c:' + L.color + '">' + L.name + '</span></h2><span class="small muted">' + n + '/' + labs.length + ' réussis</span></div><p class="muted small" style="margin-top:-6px">' + E(L.desc) + '</p><div class="fiche-list">' + labs.map(labRow).join('') + '</div></section>';
    });
    html += '<p class="small muted section">Ce simulateur reprend le fonctionnement de Cisco Packet Tracer avec ses propres dessins ; il ne lit pas les fichiers .pkt. Pour les réseaux de tes profs en .pkt, utilise Packet Tracer.</p>';
    v.innerHTML = html;
  });

  /* ---------- Page d'un lab ---------- */
  App.route(/^\/labo\/(?!libre)([\w-]+)$/, (v, [labId], params) => {
    const lab = window.LABS.find((l) => l.id === labId);
    if (!lab) return App.notFound(v, 'Lab introuvable');
    const L = levelOf(lab.level);
    let sim = createSim(lab);
    let st = JSON.parse(JSON.stringify(labState(lab.id)));
    if (!Array.isArray(st.goals)) st.goals = [];
    let tab = st.goals.some(Boolean) || params.get('pratique') ? 'pratique' : 'cours';
    const next = window.LABS[window.LABS.indexOf(lab) + 1];
    App.setTitle(lab.title);

    v.innerHTML = '<div class="crumbs"><a href="#/">Accueil</a><span>›</span><a href="#/labo">Labo réseau</a><span>›</span><span>' + L.name + '</span></div>' +
      '<div class="lab-head"><span class="lvl" style="--c:' + L.color + '">' + L.name + ' · ' + lab.time + '</span><h1>' + E(lab.title) + '</h1><p class="muted">' + E(lab.desc) + '</p></div>' +
      '<div class="row lab-tabs-row"><div class="seg lab-tabs" id="lab-tabs"><button data-tab="cours">' + icon('book') + ' Cours</button><button data-tab="pratique">' + icon('network') + ' Pratique</button></div><span class="badge" id="lab-pct"></span></div>' +
      '<div id="pane-cours" class="card"><div class="md">' + RCMD.render(lab.cours).html + '</div><div class="row" style="margin-top:16px"><button class="btn lg" data-tab="pratique">Passer à la pratique ' + icon('right') + '</button></div></div>' +
      '<div id="pane-pratique" class="lab-grid"><div class="lab-main"><div id="ws"></div></div>' +
      '<aside class="lab-side"><div class="card" id="goals-card"></div>' +
      '<div class="card"><div class="row"><button class="btn secondary sm" id="show-sol">' + icon('info') + ' Voir la solution</button><button class="btn ghost sm" id="reset">' + icon('refresh') + ' Recommencer</button></div><div id="solution"></div></div></aside></div>';

    const setTab = (t) => {
      tab = t;
      $('#pane-cours', v).hidden = t !== 'cours';
      $('#pane-pratique', v).hidden = t !== 'pratique';
      $$('#lab-tabs button', v).forEach((b) => b.classList.toggle('active', b.dataset.tab === t));
    };
    let saveT = null;
    const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => store.set(KEY(lab.id), sim.dump()), 300); };

    function renderGoals() {
      const n = lab.goals.filter((g, k) => st.goals[k]).length, all = n === lab.goals.length, pct = Math.round((n / lab.goals.length) * 100);
      $('#lab-pct', v).textContent = 'Progression : ' + pct + ' %';
      $('#lab-pct', v).className = 'badge ' + (all ? 'ok' : pct ? 'warn' : '');
      $('#goals-card', v).innerHTML = (all ? '<div class="callout exemple" style="margin-bottom:14px"><div class="callout-title">' + icon('check') + ' Lab réussi, bravo !</div><p>' + (next ? 'Prêt pour la suite ? <a href="#/labo/' + next.id + '">' + E(next.title) + ' →</a>' : 'Tu as terminé tous les labs. Essaie le <a href="#/labo/libre">mode libre</a> !') + '</p></div>' : '') +
        '<div class="row between" style="margin-bottom:8px"><h3 style="margin:0">Consignes</h3><span class="badge ' + (all ? 'ok' : '') + '">' + n + ' / ' + lab.goals.length + '</span></div>' + bar(n / lab.goals.length, L.color) +
        '<ol class="goals">' + lab.goals.map((g, k) => '<li class="' + (st.goals[k] ? 'done' : '') + '"><span class="gk">' + (st.goals[k] ? icon('check') : k + 1) + '</span><div><div>' + E(g.t) + '</div>' +
          (st.goals[k] ? '' : '<button class="hint-btn" data-hint="' + k + '">Indice</button><div class="hint" id="hint-' + k + '" hidden>' + E(g.hint) + '</div>') + '</div></li>').join('') + '</ol>';
    }
    function checkGoals() {
      const h = helpers(sim);
      let newly = false;
      lab.goals.forEach((g, k) => {
        if (st.goals[k]) return;
        let ok = false;
        try { ok = !!g.c(h); } catch (e) { ok = false; }
        if (ok) { st.goals[k] = true; newly = true; }
      });
      if (newly) {
        const all = lab.goals.every((g, k) => st.goals[k]);
        if (all && !st.done) { st.done = true; App.toast('Lab réussi : « ' + lab.title + ' » !', { duration: 6000 }); }
        else App.toast('Consigne réussie ✓', { duration: 1800 });
        Store.setLab(lab.id, st);
      }
      renderGoals();
    }
    let ws = null;
    const mountWs = () => {
      if (ws) ws.destroy();
      ws = A.Workspace($('#ws', v), { sim: () => sim, world: { w: 640, h: 320 }, canPlace: false, canCable: !!lab.cabling, changed: () => { checkGoals(); persist(); } });
    };

    v.addEventListener('click', (e) => {
      const t = e.target.closest('[data-tab]');
      if (t && t.closest('#lab-tabs, #pane-cours')) { setTab(t.dataset.tab); if (t.dataset.tab === 'pratique') window.scrollTo(0, 0); return; }
      const hb = e.target.closest('[data-hint]');
      if (hb) { const h = $('#hint-' + hb.dataset.hint, v); h.hidden = !h.hidden; }
    });
    $('#show-sol', v).addEventListener('click', () => {
      const box = $('#solution', v);
      if (box.innerHTML) { box.innerHTML = ''; return; }
      if (!confirm('Afficher la solution ? Essaie d\'abord avec les indices : c\'est comme ça qu\'on apprend !')) return;
      box.innerHTML = lab.solution.map(([id, steps]) => '<h4 style="margin:14px 0 6px">' + E(sim.devices[id] ? sim.devices[id].label : id) + '</h4><pre class="sol">' + E(steps.join('\n')) + '</pre>').join('');
    });
    $('#reset', v).addEventListener('click', () => {
      if (!confirm('Recommencer ce lab depuis le début ? Ta configuration actuelle sera effacée.')) return;
      store.del(KEY(lab.id));
      sim = createSim(lab, true);
      st = { goals: [], done: st.done };
      Store.setLab(lab.id, st);
      mountWs(); renderGoals();
      $('#solution', v).innerHTML = '';
    });

    mountWs();
    checkGoals();
    setTab(tab);
    return () => { clearTimeout(saveT); store.set(KEY(lab.id), sim.dump()); if (ws) ws.destroy(); };
  });

  /* ---------- Mode libre (bac à sable) ---------- */
  const IDX = 'reviciel.atelier.index', CUR = 'reviciel.atelier.courant', PK = (id) => 'reviciel.atelier.p.' + id;
  const loadIndex = () => { try { const x = JSON.parse(store.get(IDX) || '[]'); return Array.isArray(x) ? x : []; } catch (e) { return []; } };
  const saveIndex = (list) => store.set(IDX, JSON.stringify(list));
  function exampleSim() {
    const sim = new NS.Sim({ devices: [], links: [] });
    const r = sim.addDevice('router', 480, 90), s = sim.addDevice('switch', 480, 230);
    const p0 = sim.addDevice('pc', 300, 380), p1 = sim.addDevice('laptop', 480, 400), sv = sim.addDevice('server', 660, 380);
    sim.addLink(r, 'GigabitEthernet0/0', s, 'GigabitEthernet0/1', 'droit');
    sim.addLink(s, 'FastEthernet0/1', p0, 'FastEthernet0', 'droit');
    sim.addLink(s, 'FastEthernet0/2', p1, 'FastEthernet0', 'droit');
    sim.addLink(s, 'FastEthernet0/3', sv, 'FastEthernet0', 'droit');
    return sim;
  }
  App.route(/^\/labo\/libre$/, (v) => {
    App.setTitle('Mode libre — Labo réseau');
    let list = loadIndex();
    let cur = store.get(CUR);
    let sim = null, ws = null, saveT = null;
    const newProject = (name, s) => {
      const id = 'p' + Date.now().toString(36);
      list.unshift({ id, name, updated: Date.now() });
      saveIndex(list);
      store.set(PK(id), (s || new NS.Sim({ devices: [], links: [] })).dump({ name }));
      return id;
    };
    if (!list.length) cur = newProject('Mon premier réseau', exampleSim());
    if (!cur || !list.find((p) => p.id === cur)) cur = list[0].id;

    const defiDone = (d) => !!(Store.state.labs['defi:' + d.id] || {}).done;
    v.innerHTML = '<div class="crumbs"><a href="#/">Accueil</a><span>›</span><a href="#/labo">Labo réseau</a><span>›</span><span>Mode libre</span></div>' +
      '<div class="page-head"><h1>Mode libre</h1><p>Construis ton réseau comme dans Packet Tracer. Tout est enregistré automatiquement sur cet appareil.</p></div>' +
      '<details class="card section defis"' + (window.DEFIS.every(defiDone) ? '' : ' open') + '><summary><b>' + icon('trophy') + ' Défis</b> <span class="small muted">' + window.DEFIS.filter(defiDone).length + ' / ' + window.DEFIS.length + ' réussis · pars d\'un espace vide, la vérification est automatique</span></summary>' +
      '<div class="defi-list">' + window.DEFIS.map((d) => { const L = levelOf(d.level); return '<div class="defi" style="--c:' + L.color + '"><span class="lvl" style="--c:' + L.color + '">' + L.name + '</span><h3>' + E(d.title) + '</h3><p class="small">' + E(d.desc) + '</p>' +
        '<div class="row between"><span class="badge' + (defiDone(d) ? ' ok">' + icon('check') + ' Réussi' : '">' + d.goals.length + ' étapes') + '</span><button class="btn sm" data-defi="' + d.id + '">Relever le défi</button></div></div>'; }).join('') + '</div></details>' +
      '<div id="defi-card" class="card section" hidden></div>' +
      '<div class="card proj-bar"><label class="field" style="flex:1;min-width:180px"><span>Projet</span><select class="input" id="proj"></select></label>' +
      '<div class="row"><button class="btn sm" data-p="new">' + icon('plus') + ' Nouveau</button><button class="btn secondary sm" data-p="rename">Renommer</button><button class="btn secondary sm" data-p="export">' + icon('download') + ' Exporter</button>' +
      '<button class="btn secondary sm" data-p="import">' + icon('upload') + ' Importer</button><button class="btn ghost sm" data-p="delete">' + icon('trash') + ' Supprimer</button></div></div>' +
      '<details class="card section astuces"><summary><b>Mode d\'emploi rapide</b></summary><ol class="small">' +
      '<li><b>Poser un équipement</b> : en bas, choisis Routeur, Switch, PC… puis touche l\'espace de travail.</li>' +
      '<li><b>Câbler</b> : choisis un câble (Auto, Droit, Croisé, Console), touche le 1er équipement, choisis le port, puis le 2e. Un voyant rouge = mauvais câble ou port éteint.</li>' +
      '<li><b>Configurer</b> : touche un équipement. Routeur et switch : onglets Config et CLI. PC : Bureau (Configuration IP, Invite de commandes, Navigateur web, Terminal). Serveur : Services (HTTP, DNS, DHCP).</li>' +
      '<li><b>Tester</b> : outil « Message simple » (l\'enveloppe) : touche la source puis la destination. Passe en mode <b>Simulation</b> pour voir le paquet voyager.</li></ol></details>' +
      '<div id="ws" class="section"></div>';
    const sel = $('#proj', v);
    const fillSel = () => { sel.innerHTML = list.map((p) => '<option value="' + p.id + '"' + (p.id === cur ? ' selected' : '') + '>' + E(p.name) + '</option>').join(''); };
    const flush = () => {
      clearTimeout(saveT);
      const p = list.find((x) => x.id === cur);
      if (!p || !sim) return;
      p.updated = Date.now();
      if (!store.set(PK(cur), sim.dump({ name: p.name }))) App.toast('Enregistrement impossible : stockage plein.');
      saveIndex(list);
      window.dispatchEvent(new Event('reviciel-change'));
    };
    const persist = () => { clearTimeout(saveT); saveT = setTimeout(flush, 400); };
    /* défi en cours : consignes vérifiées à chaque changement */
    let prevRes = null;
    function renderDefi() {
      const box = $('#defi-card', v), p = list.find((x) => x.id === cur);
      const d = p && p.defi && window.DEFIS.find((x) => x.id === p.defi);
      if (!d) { box.hidden = true; box.innerHTML = ''; prevRes = null; return; }
      const res = window.checkDefi(d, sim), n = res.filter(Boolean).length, all = n === res.length, L = levelOf(d.level);
      if (prevRes && res.some((ok, k) => ok && !prevRes[k])) {
        if (all) { App.toast('Défi réussi : « ' + d.title + ' » !', { duration: 6000 }); Store.setLab('defi:' + d.id, { goals: res, done: true }); }
        else App.toast('Étape réussie ✓', { duration: 1800 });
      }
      prevRes = res;
      box.hidden = false;
      box.innerHTML = '<div class="row between" style="margin-bottom:8px"><h3 style="margin:0">' + icon('trophy') + ' Défi : ' + E(d.title) + '</h3><span class="badge ' + (all ? 'ok' : '') + '">' + n + ' / ' + res.length + '</span></div>' + bar(n / res.length, L.color) +
        (all ? '<p class="status-ok" style="margin:10px 0 0">Bravo, défi réussi ! Essaie le suivant dans la liste des défis.</p>' : '') +
        '<ol class="goals">' + d.goals.map((g, k) => '<li class="' + (res[k] ? 'done' : '') + '"><span class="gk">' + (res[k] ? icon('check') : k + 1) + '</span><div><div>' + E(g.t) + '</div>' +
          (res[k] ? '' : '<button class="hint-btn" data-hint="' + k + '">Indice</button><div class="hint" id="dhint-' + k + '" hidden>' + E(g.hint) + '</div>') + '</div></li>').join('') + '</ol>';
    }
    function open(id) {
      if (ws) { ws.destroy(); ws = null; }
      cur = id;
      store.set(CUR, id);
      try { sim = NS.fromDump(store.get(PK(id)) || '{"devices":[],"links":[]}'); } catch (e) { sim = new NS.Sim({ devices: [], links: [] }); App.toast('Projet illisible : on repart d\'un espace vide.'); }
      fillSel();
      prevRes = null;
      ws = A.Workspace($('#ws', v), { sim: () => sim, world: { w: 960, h: 520 }, canPlace: true, canCable: true, changed: () => { persist(); renderDefi(); } });
      renderDefi();
    }
    sel.addEventListener('change', () => { flush(); open(sel.value); });
    v.addEventListener('click', async (e) => {
      const hb = e.target.closest('#defi-card [data-hint]');
      if (hb) { const h = $('#dhint-' + hb.dataset.hint, v); h.hidden = !h.hidden; return; }
      const db = e.target.closest('[data-defi]');
      if (db) {
        const d = window.DEFIS.find((x) => x.id === db.dataset.defi);
        flush();
        const id = newProject('Défi : ' + d.title);
        list.find((x) => x.id === id).defi = d.id;
        saveIndex(list);
        open(id);
        $('.defis', v).open = false;
        $('#defi-card', v).scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      const b = e.target.closest('[data-p]');
      if (!b) return;
      const p = list.find((x) => x.id === cur);
      if (b.dataset.p === 'new') {
        const name = prompt('Nom du nouveau projet :', 'Réseau ' + (list.length + 1));
        if (name == null) return;
        flush(); open(newProject(name.trim() || 'Réseau ' + (list.length + 1)));
      } else if (b.dataset.p === 'rename' && p) {
        const name = prompt('Nouveau nom :', p.name);
        if (name && name.trim()) { p.name = name.trim(); saveIndex(list); fillSel(); persist(); }
      } else if (b.dataset.p === 'export' && p) {
        App.download(App.fileSlug(p.name) + '.reseau.json', sim.dump({ name: p.name }), 'application/json');
      } else if (b.dataset.p === 'import') {
        const [file] = await App.pickFiles('.json,application/json', false);
        if (!file) return;
        try {
          const data = JSON.parse(await App.readFile(file));
          const s = NS.fromDump(data);
          open(newProject(data.name || file.name.replace(/\.(reseau\.)?json$/i, ''), s));
          App.toast('Réseau importé.');
        } catch (err) { App.toast('Import impossible : ' + err.message); }
      } else if (b.dataset.p === 'delete' && p) {
        if (!confirm('Supprimer définitivement le projet « ' + p.name + ' » ?')) return;
        store.del(PK(cur));
        try { const t = JSON.parse(store.get('reviciel.atelier.supprimes') || '{}'); t[cur] = Date.now(); store.set('reviciel.atelier.supprimes', JSON.stringify(t)); } catch (err) { /* rien */ }
        list = list.filter((x) => x.id !== cur);
        saveIndex(list);
        if (!list.length) newProject('Réseau 1');
        open(list[0].id);
      }
    });
    open(cur);
    return () => { flush(); if (ws) ws.destroy(); };
  });
})();

</script>
<script>
/* RéviCIEL — exercices des fiches : texte à trous, remise en ordre, association, classement, calcul. */
(function () {
  'use strict';
  const { E, icon, $, $$, plural, bar } = App;
  const TYPES = {
    trous: { name: 'Texte à trous', icon: 'pen' },
    ordre: { name: 'Remettre dans l\'ordre', icon: 'layers' },
    paires: { name: 'Associer', icon: 'shuffle' },
    classer: { name: 'Classer', icon: 'cards' },
    calcul: { name: 'Calcul', icon: 'sigma' }
  };
  const norm = (s) => RCMD.deaccent(String(s)).toLowerCase().replace(/[’`]/g, '\'').replace(/\s+/g, ' ').replace(/[.!;]+$/, '').trim();
  const normNum = (s) => (/^[\d\s]+$/.test(String(s).trim()) ? String(s).replace(/\s+/g, '') : norm(s));
  const parseNum = (s) => { const v = parseFloat(String(s).replace(/[−–]/g, '-').replace(/\s+/g, '').replace(',', '.').replace(/[^\d.eE+-]/g, '')); return isFinite(v) ? v : NaN; };
  const fmt = (v) => String(Math.round(v * 1000) / 1000).replace('.', ',');
  function shuffled(arr) {
    if (arr.length < 2) return arr.slice();
    let s;
    do { s = RC.shuffle(arr); } while (s.every((x, i) => x === arr[i]));
    return s;
  }
  const opts = (list, ph) => '<option value="">' + E(ph) + '</option>' + list.map((x) => '<option value="' + E(x) + '">' + E(x) + '</option>').join('');

  /* Crée la carte d'un exercice. onCheck(points, total) est appelé à chaque vérification. */
  function exerciseCard(ex, n, onCheck) {
    const card = document.createElement('section');
    card.className = 'card exo';
    const T = TYPES[ex.type];
    let total = 0, body = '', state = {};
    if (ex.type === 'trous') {
      let k = 0;
      const html = RCMD.render(ex.text.replace(/\[\[[^\]]+\]\]/g, () => '⟦' + k++ + '⟧')).html;
      body = '<div class="md exo-text">' + html.replace(/⟦(\d+)⟧/g, (m, i) => '<input class="blank input" data-b="' + i + '" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Trou ' + (+i + 1) + '" style="width:' + Math.min(16, Math.max(4, ex.blanks[i][0].length + 2)) + 'ch">') + '</div>';
      total = ex.blanks.length;
    } else if (ex.type === 'ordre') {
      state.order = shuffled(ex.items);
      total = ex.items.length;
    } else if (ex.type === 'paires') {
      state.rights = shuffled(ex.pairs.map((p) => p[1]));
      body = '<div class="pairs">' + ex.pairs.map((p, i) => '<div class="pair" data-i="' + i + '"><span class="pl">' + RCMD.inline(p[0]) + '</span><select class="input" aria-label="Associer à">' + opts(state.rights, '— choisir —') + '</select></div>').join('') + '</div>';
      total = ex.pairs.length;
    } else if (ex.type === 'classer') {
      const items = [];
      ex.cats.forEach((c) => c.items.forEach((it) => items.push({ it, cat: c.name })));
      state.items = shuffled(items);
      body = '<div class="pairs">' + state.items.map((x, i) => '<div class="pair" data-i="' + i + '"><span class="pl">' + RCMD.inline(x.it) + '</span><select class="input" aria-label="Catégorie">' + opts(ex.cats.map((c) => c.name), '— catégorie —') + '</select></div>').join('') + '</div>';
      total = items.length;
    } else if (ex.type === 'calcul') {
      body = '<div class="calc">' + ex.questions.map((q, i) => '<div class="calc-q" data-i="' + i + '"><div class="md">' + RCMD.render(q.q).html + '</div><div class="row"><input class="input calc-in" inputmode="decimal" autocomplete="off" aria-label="Résultat"><span class="unit">' + E(q.unit) + '</span></div><div class="calc-fb"></div></div>').join('') + '</div>';
      total = ex.questions.length;
    }
    card.innerHTML = '<div class="exo-head"><span class="s-icon">' + icon(T.icon) + '</span><div><div class="kicker">Exercice ' + n + ' · ' + T.name + '</div><h3>' + E(ex.title || T.name) + '</h3></div></div>' +
      '<div class="exo-body">' + body + '</div><div class="exo-fb" hidden></div>' +
      '<div class="row exo-actions"><button class="btn" data-a="check">' + icon('check') + ' Vérifier</button><button class="btn ghost sm" data-a="show">Voir la correction</button><button class="btn ghost sm" data-a="reset">' + icon('refresh') + ' Recommencer</button></div>';
    const bodyEl = $('.exo-body', card), fb = $('.exo-fb', card);

    function drawOrder(marks) {
      bodyEl.innerHTML = '<ol class="order">' + state.order.map((it, i) => '<li class="' + (marks ? (marks[i] ? 'ok' : 'ko') : '') + '"><span class="ord-n">' + (i + 1) + '</span><span class="ord-t">' + RCMD.inline(it) + '</span>' +
        '<span class="ord-b"><button class="icon-btn" data-mv="' + i + '" data-d="-1" aria-label="Monter"' + (i === 0 ? ' disabled' : '') + '>▲</button><button class="icon-btn" data-mv="' + i + '" data-d="1" aria-label="Descendre"' + (i === state.order.length - 1 ? ' disabled' : '') + '>▼</button></span></li>').join('') + '</ol>';
    }
    if (ex.type === 'ordre') drawOrder();

    function result(pts, details) {
      const okAll = pts === total;
      fb.hidden = false;
      fb.className = 'exo-fb ' + (okAll ? 'good' : 'bad');
      fb.innerHTML = '<b>' + (okAll ? 'Parfait ! ' : '') + pts + ' / ' + total + ' ' + (total > 1 ? 'bonnes réponses' : 'bonne réponse') + '</b>' + (details || '') + (ex.explain ? '<div class="md small" style="margin-top:6px">' + RCMD.render(ex.explain).html + '</div>' : '');
      onCheck(pts, total);
    }
    function check() {
      let pts = 0;
      if (ex.type === 'trous') {
        $$('.blank', card).forEach((inp) => {
          const ok = ex.blanks[+inp.dataset.b].some((a) => normNum(a) === normNum(inp.value));
          inp.classList.toggle('ok', ok); inp.classList.toggle('ko', !ok);
          if (ok) pts++;
        });
      } else if (ex.type === 'ordre') {
        const marks = state.order.map((it, i) => it === ex.items[i]);
        pts = marks.filter(Boolean).length;
        drawOrder(marks);
      } else if (ex.type === 'paires' || ex.type === 'classer') {
        $$('.pair', card).forEach((row) => {
          const i = +row.dataset.i, val = $('select', row).value;
          const ok = ex.type === 'paires' ? val === ex.pairs[i][1] : val === state.items[i].cat;
          row.classList.toggle('ok', ok); row.classList.toggle('ko', !ok);
          if (ok) pts++;
        });
      } else if (ex.type === 'calcul') {
        $$('.calc-q', card).forEach((row) => {
          const q = ex.questions[+row.dataset.i], v = parseNum($('.calc-in', row).value);
          const ok = isFinite(v) && Math.abs(v - q.value) <= q.tol + 1e-9;
          row.classList.toggle('ok', ok); row.classList.toggle('ko', !ok);
          $('.calc-fb', row).innerHTML = ok ? '<span class="status-ok">Juste !</span>' + (q.explain ? ' <span class="small">' + RCMD.inline(q.explain) + '</span>' : '') :
            '<span class="status-warn">Réponse attendue : ' + fmt(q.value) + ' ' + E(q.unit) + '</span>' + (q.explain ? '<div class="small">' + RCMD.inline(q.explain) + '</div>' : '');
          if (ok) pts++;
        });
      }
      result(pts);
    }
    function show() {
      if (ex.type === 'trous') $$('.blank', card).forEach((inp) => { inp.value = ex.blanks[+inp.dataset.b][0]; inp.classList.remove('ko'); inp.classList.add('ok'); });
      else if (ex.type === 'ordre') { state.order = ex.items.slice(); drawOrder(state.order.map(() => true)); }
      else if (ex.type === 'paires') $$('.pair', card).forEach((row) => { $('select', row).value = ex.pairs[+row.dataset.i][1]; row.classList.remove('ko'); row.classList.add('ok'); });
      else if (ex.type === 'classer') $$('.pair', card).forEach((row) => { $('select', row).value = state.items[+row.dataset.i].cat; row.classList.remove('ko'); row.classList.add('ok'); });
      else if (ex.type === 'calcul') $$('.calc-q', card).forEach((row) => { const q = ex.questions[+row.dataset.i]; $('.calc-in', row).value = fmt(q.value); $('.calc-fb', row).innerHTML = q.explain ? '<span class="small">' + RCMD.inline(q.explain) + '</span>' : ''; });
      fb.hidden = false; fb.className = 'exo-fb';
      fb.innerHTML = '<b>Correction affichée.</b> Relis-la, puis clique sur « Recommencer » pour t\'entraîner sans aide.' + (ex.explain ? '<div class="md small" style="margin-top:6px">' + RCMD.render(ex.explain).html + '</div>' : '');
    }
    function reset() {
      const fresh = exerciseCard(ex, n, onCheck);
      card.replaceWith(fresh);
    }
    card.addEventListener('click', (e) => {
      const mv = e.target.closest('[data-mv]');
