        const s = RC.SUBJ[last.subject];
        html += '<a class="card resume-card section" style="--c:' + s.color + ';display:flex;color:inherit;text-decoration:none" href="#/fiche/' + encodeURIComponent(last.id) + '">' + sIcon(s) +
          '<div style="flex:1;min-width:0"><div class="small muted">Reprendre là où tu t\'es arrêté</div><b>' + E(last.title) + '</b><div class="small muted">' + E(s.name) + '</div></div>' + icon('right', 'chev') + '</a>';
      }
      RC.GROUPS.forEach((g) => {
        html += '<section class="section"><div class="section-head"><h2>' + E(g.name) + '</h2></div><div class="grid">';
        RC.SUBJECTS.filter((s) => s.group === g.id).forEach((s) => {
          const ss = RC.subjectStats(s.id);
          html += '<a class="subject-card" style="--c:' + s.color + '" href="#/matiere/' + s.id + '">' + sIcon(s) + '<h3>' + E(s.name) + '</h3>' +
            bar(ss.score, s.color) + '<div class="meta"><span>' + plural(ss.count, 'fiche') + '</span><span>' + pct(ss.score) + '</span></div></a>';
        });
        html += '</div></section>';
      });
      html += '<section class="section"><div class="section-head"><h2>Exercices interactifs</h2><a href="#/entrainement" class="small">Tout voir</a></div><div class="grid wide">' +
        window.TRAINERS.map((t) => '<a class="card tool-card" style="--c:' + t.color + '" href="#/entrainement/' + t.id + '"><span class="s-icon">' + icon(t.icon) + '</span><div><h3>' + E(t.title) + '</h3><p>' + E(t.desc) + '</p></div></a>').join('') +
        '</div></section>';
      html += '<section class="section"><div class="grid wide">' +
        '<a class="card tool-card" style="--c:#7c3aed" href="#/mes-fiches"><span class="s-icon">' + icon('pen') + '</span><div><h3>Mes fiches</h3><p>Crée tes propres fiches avec cartes et quiz.</p></div></a>' +
        '<a class="card tool-card" style="--c:#d97706" href="#/favoris"><span class="s-icon">' + icon('star') + '</span><div><h3>Favoris</h3><p>' + plural(Object.keys(st.fav).length, 'fiche mise', 'fiches mises') + ' de côté.</p></div></a>' +
        '<a class="card tool-card" style="--c:#0d9488" href="#/progression"><span class="s-icon">' + icon('chart') + '</span><div><h3>Progression</h3><p>Ton avancement par matière.</p></div></a>' +
        '</div></section>';
      v.innerHTML = html;
    };
    render();
    v.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'install') { await window.PWA.install(); render(); }
      if (a.dataset.act === 'hide-install') { Store.setSetting('installHidden', true); $('#install-slot', v).innerHTML = ''; }
    });
    const onPwa = () => { const slot = $('#install-slot', v); if (slot) slot.innerHTML = installSlot(); };
    window.addEventListener('pwa-change', onPwa);
    return () => window.removeEventListener('pwa-change', onPwa);
  });

  /* ---------- Page d'une matière ---------- */
  App.route(/^\/matiere\/([\w-]+)$/, (v, [sid]) => {
    const s = RC.SUBJ[sid];
    if (!s) return App.notFound(v, 'Matière introuvable');
    App.setTitle(s.name);
    const list = RC.subjectFiches(sid), st = RC.subjectStats(sid);
    const nCards = list.reduce((a, f) => a + f.cards.length, 0), nQ = list.reduce((a, f) => a + f.quiz.length, 0);
    const g = RC.GROUPS.find((x) => x.id === s.group);
    let html = '<div class="crumbs"><a href="#/">Accueil</a><span>›</span><span>' + E(g ? g.name : 'Perso') + '</span></div>' +
      '<div class="subject-head" style="--c:' + s.color + '">' + sIcon(s) + '<div><h1>' + E(s.name) + '</h1><p class="muted" style="margin:0">' + E(s.desc) + '</p></div></div>';
    if (list.length) {
      html += '<div class="card" style="--c:' + s.color + '">' + bar(st.score, s.color) +
        '<div class="row between small" style="margin:8px 0 14px"><span>' + st.read + '/' + st.count + ' fiches lues · ' + st.mastered + '/' + st.cards + ' cartes maîtrisées</span><b>' + pct(st.score) + ' maîtrisé</b></div><div class="row">' +
        (nCards ? '<a class="btn" href="#/matiere/' + sid + '/cartes">' + icon('cards') + ' Réviser les cartes</a>' : '') +
        (nQ ? '<a class="btn secondary" href="#/matiere/' + sid + '/quiz">' + icon('quiz') + ' Quiz de la matière</a>' : '') + '</div></div>';
      html += '<div class="fiche-list section">' + list.map((f, i) => ficheRow(f, i + 1)).join('') + '</div>';
    } else {
      html += '<div class="card empty">' + icon('pen') + '<p>Aucune fiche ici pour l\'instant.</p><a class="btn" href="#/editeur">' + icon('plus') + ' Créer une fiche</a></div>';
    }
    if (sid !== 'perso' && list.length) html += '<p class="small muted section">Il manque un chapitre ? <a href="#/editeur?matiere=' + sid + '">Crée ta propre fiche</a> : elle apparaîtra dans cette matière.</p>';
    v.innerHTML = html;
  });

  /* ---------- Lecture d'une fiche ---------- */
  function speak(f, btn) {
    const synth = window.speechSynthesis;
    if (synth.speaking) { synth.cancel(); btn.innerHTML = icon('volume') + ' Écouter'; return; }
    const text = [f.title, f.summary, f.plain].join('.\n');
    const parts = text.replace(/([.!?:])\s+/g, '$1\n').split(/\n+/).map((t) => t.trim()).filter(Boolean);
    const voice = synth.getVoices().find((x) => /^fr/i.test(x.lang));
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = 'fr-FR'; if (voice) u.voice = voice; u.rate = 1;
      if (i === parts.length - 1) u.onend = () => { btn.innerHTML = icon('volume') + ' Écouter'; };
      synth.speak(u);
    });
    btn.innerHTML = icon('stop') + ' Arrêter';
  }
  function duplicate(f) {
    const id = 'perso-' + Date.now().toString(36);
    const src = f.src.replace(/^---\n([\s\S]*?)\n---/, (m, head) => '---\n' + head.split('\n').map((l) => {
      if (/^\s*id\s*:/i.test(l)) return 'id: ' + id;
      if (/^\s*titre\s*:/i.test(l)) return 'titre: ' + f.title + ' (ma version)';
      return l;
    }).join('\n') + '\n---');
    Store.upsertUserFiche(id, src);
    RC.load(); App.renderNav();
    App.toast('Copie créée dans « Mes fiches ». Modifie-la comme tu veux !');
    App.go('#/editeur/' + id);
  }

  App.route(/^\/fiche\/([^/]+)$/, (v, [id]) => {
    const f = RC.fiche(id);
    if (!f) return App.notFound(v, 'Fiche introuvable');
    const s = RC.SUBJ[f.subject];
    App.setTitle(f.title);
    Store.setLast(f.id);
    const r = RCMD.render(f.body), st = RC.ficheStats(f), fav = !!Store.state.fav[f.id];
    const minutes = Math.max(1, Math.round(f.words / 170));
    const list = RC.subjectFiches(f.subject), idx = list.indexOf(f);
    const prev = list[idx - 1], next = list[idx + 1];
    const hasToc = r.headings.length >= 3;
    const tocLinks = r.headings.map((h) => '<a href="#/fiche/' + encodeURIComponent(f.id) + '" data-goto="' + E(h.id) + '">' + E(h.text) + '</a>').join('');
    const enc = encodeURIComponent(f.id);
    v.innerHTML = '<div class="crumbs"><a href="#/">Accueil</a><span>›</span><a href="#/matiere/' + s.id + '">' + E(s.name) + '</a></div>' +
      '<div class="fiche-layout' + (hasToc ? ' has-toc' : '') + '"><article id="fiche">' +
      '<header class="fiche-header" style="--c:' + s.color + '"><div class="kicker">' + E(f.chapter || s.name) + '</div><h1>' + E(f.title) + '</h1>' +
      (f.summary ? '<p>' + E(f.summary) + '</p>' : '') + '<div class="fiche-meta"><span class="badge">' + icon('clock') + ' ' + minutes + ' min de lecture</span>' +
      (f.cards.length ? '<span class="badge">' + icon('cards') + ' ' + plural(f.cards.length, 'carte') + '</span>' : '') +
      (f.quiz.length ? '<span class="badge">' + icon('quiz') + ' ' + plural(f.quiz.length, 'question') + '</span>' : '') +
      (f.origin === 'user' ? '<span class="badge violet">Fiche perso</span>' : '') + '</div></header>' +
      '<div class="fiche-actions">' +
      (f.cards.length ? '<a class="btn" href="#/fiche/' + enc + '/cartes">' + icon('cards') + ' Cartes mémoire</a>' : '') +
      (f.quiz.length ? '<a class="btn secondary" href="#/fiche/' + enc + '/quiz">' + icon('quiz') + ' Quiz</a>' : '') +
      '<button class="btn ghost' + (fav ? ' on' : '') + '" data-act="fav" aria-pressed="' + fav + '">' + icon('star') + ' <span>' + (fav ? 'Favori' : 'Favori ?') + '</span></button>' +
      '<button class="btn ghost" data-act="hide" aria-pressed="false" title="Cache les mots surlignés : touche-les pour vérifier">' + icon('eyeoff') + ' Mode caché</button>' +
      ('speechSynthesis' in window ? '<button class="btn ghost" data-act="speak">' + icon('volume') + ' Écouter</button>' : '') +
      '<button class="btn ghost" data-act="print">' + icon('printer') + ' Imprimer</button>' +
      (f.origin === 'user' ? '<a class="btn ghost" href="#/editeur/' + enc + '">' + icon('pen') + ' Modifier</a>' : '<button class="btn ghost" data-act="dup" title="Copier cette fiche dans « Mes fiches » pour la modifier">' + icon('copy') + ' Personnaliser</button>') +
      '</div>' +
      (hasToc ? '<details class="toc-mobile card"><summary>Sommaire</summary>' + tocLinks + '</details>' : '') +
      '<div class="md" id="fiche-body">' + (r.html || '<p class="muted">Cette fiche n\'a pas encore de contenu.</p>') + '</div>' +
      '<div class="fiche-end"><div class="row">' +
      '<button class="btn lg ' + (st.read ? 'success' : 'soft') + '" data-act="read">' + icon('check') + ' ' + (st.read ? 'Fiche lue' : 'J\'ai lu et compris cette fiche') + '</button>' +
      (f.cards.length ? '<a class="btn lg secondary" href="#/fiche/' + enc + '/cartes">' + icon('cards') + ' Tester avec les cartes</a>' : '') + '</div>' +
      '<div class="pager">' + (prev ? '<a class="prev" href="#/fiche/' + encodeURIComponent(prev.id) + '"><span>‹ Précédente</span>' + E(prev.title) + '</a>' : '') +
      (next ? '<a class="next" href="#/fiche/' + encodeURIComponent(next.id) + '"><span>Suivante ›</span>' + E(next.title) + '</a>' : '') + '</div></div>' +
      '</article>' + (hasToc ? '<aside class="toc"><h4>Sommaire</h4>' + tocLinks + '</aside>' : '') + '</div>';

    const art = $('#fiche', v);
    v.addEventListener('click', (e) => {
      const go = e.target.closest('[data-goto]');
      if (go) { e.preventDefault(); const t = document.getElementById(go.dataset.goto); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      const mk = e.target.closest('mark');
      if (mk && art.classList.contains('hide-marks')) { mk.classList.toggle('revealed'); return; }
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'fav') {
        const on = Store.toggleFav(f.id);
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.querySelector('span').textContent = on ? 'Favori' : 'Favori ?';
        App.toast(on ? 'Ajoutée aux favoris' : 'Retirée des favoris');
      } else if (act === 'hide') {
        const on = art.classList.toggle('hide-marks');
        b.setAttribute('aria-pressed', on); b.classList.toggle('on', on);
        if (on) { $$('mark', art).forEach((m) => m.classList.remove('revealed')); App.toast($$('mark', art).length ? 'Mots clés cachés : touche-les pour vérifier ta réponse.' : 'Cette fiche n\'a pas de mots surlignés.'); }
      } else if (act === 'speak') speak(f, b);
      else if (act === 'print') window.print();
      else if (act === 'dup') duplicate(f);
      else if (act === 'read') {
        const now = !Store.state.read[f.id];
        Store.setRead(f.id, now);
        b.className = 'btn lg ' + (now ? 'success' : 'soft');
        b.innerHTML = icon('check') + ' ' + (now ? 'Fiche lue' : 'J\'ai lu et compris cette fiche');
        if (now) App.toast(f.cards.length ? 'Bien joué ! Teste-toi maintenant avec les cartes.' : 'Fiche marquée comme lue.');
        App.renderNav();
      }
    });

    // Barre de progression de lecture
    const barEl = document.createElement('div');
    barEl.className = 'reading-bar';
    document.body.appendChild(barEl);
    const onScroll = () => {
      const rect = art.getBoundingClientRect();
      const total = rect.height - window.innerHeight * 0.6;
      barEl.style.width = Math.max(0, Math.min(100, (-rect.top / Math.max(1, total)) * 100)) + '%';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { window.removeEventListener('scroll', onScroll); barEl.remove(); };
  });

  /* ---------- Recherche ---------- */
  App.route(/^\/recherche$/, (v, _, params) => {
    App.setTitle('Recherche');
    const q0 = params.get('q') || '';
    v.innerHTML = '<div class="page-head"><h1>Recherche</h1><p>Cherche une notion dans toutes les fiches (titres, cours et cartes).</p></div>' +
      '<div class="search-big"><input class="input" id="sq" type="search" placeholder="Ex. : masque, Ohm, Verdun, présent perfect…" value="' + E(q0) + '" autocomplete="off"></div><div id="sr" class="fiche-list"></div>';
    const inp = $('#sq', v), out = $('#sr', v);
    const run = () => {
      const q = inp.value.trim();
      if (q.length < 2) { out.innerHTML = '<p class="muted">Tape au moins 2 lettres.</p>'; return; }
      const res = RC.search(q);
      out.innerHTML = res.length ? '<p class="muted small">' + plural(res.length, 'fiche trouvée', 'fiches trouvées') + '</p>' + res.slice(0, 40).map((r) => {
        const s = RC.SUBJ[r.f.subject];
        return '<a class="result-row" style="--c:' + s.color + '" href="#/fiche/' + encodeURIComponent(r.f.id) + '"><div class="kicker">' + E(s.name) + '</div><h3>' + E(r.f.title) + '</h3><p>' + r.snippet + '</p></a>';
      }).join('') : '<div class="empty">' + icon('search') + '<p>Aucun résultat pour « ' + E(q) + ' ».</p></div>';
      history.replaceState(null, '', '#/recherche?q=' + encodeURIComponent(q));
    };
    inp.addEventListener('input', App.debounce(run, 120));
    run();
    const top = document.getElementById('search-input');
    if (document.activeElement !== top) inp.focus();
  });

  /* ---------- Favoris ---------- */
  App.route(/^\/favoris$/, (v) => {
    App.setTitle('Favoris');
    const list = RC.fiches.filter((f) => Store.state.fav[f.id]);
    v.innerHTML = '<div class="page-head"><h1>Favoris</h1><p>Les fiches que tu as mises de côté (bouton « Favori » sur une fiche).</p></div>' +
      (list.length ? '<div class="fiche-list">' + list.map((f, i) => ficheRow(f, i + 1)).join('') + '</div>' :
        '<div class="card empty">' + icon('star') + '<p>Pas encore de favori. Ouvre une fiche et touche « Favori ? ».</p><a class="btn" href="#/">Parcourir les matières</a></div>');
  });
})();

</script>
<script>
/* RéviCIEL — sessions de révision : cartes mémoire, quiz, révision du jour, exercices */
(function () {
  'use strict';
  const { E, icon, $, $$, sIcon, bar, plural } = App;
  const md = (s) => RCMD.render(s).html;

  /* ---------- Choix des cartes : en retard > nouvelles > les moins sues ---------- */
  function prioritize(cards, n) {
    const t = Store.today();
    const rank = (c) => { const s = Store.cardInfo(c.id); if (!s) return 1; if (s.due <= t) return 0; return 2 + s.box; };
    return RC.shuffle(cards).map((c) => ({ c, r: rank(c) })).sort((a, b) => a.r - b.r).slice(0, n).map((x) => x.c);
  }

  /* ---------- Session de cartes mémoire ---------- */
  function flashSession(v, cards, opts) {
    const total = cards.length, results = [0, 0, 0], seen = new Set();
    let queue = cards.slice(), cur = null, flipped = false, done = 0;
    if (!total) {
      v.innerHTML = '<div class="card empty">' + icon('cards') + '<p>Aucune carte ici.</p><a class="btn" href="' + opts.back + '">Retour</a></div>';
      return;
    }
    function show() {
      if (!queue.length) return end();
      cur = queue.shift(); flipped = false;
      const s = RC.SUBJ[cur.fiche.subject];
      const again = seen.has(cur.id);
      v.innerHTML = '<div class="session" style="--c:' + s.color + '">' +
        '<div class="session-top"><a class="icon-btn" href="' + opts.back + '" aria-label="Quitter la session">' + icon('x') + '</a>' + bar(done / total, s.color) + '<span class="count">' + done + ' / ' + total + '</span></div>' +
        '<div class="fc-stage"><div class="fc" id="fc" tabindex="0" role="button" aria-label="Retourner la carte">' +
        '<div class="fc-face fc-front"><span class="label">' + (again ? 'À revoir · ' : '') + 'Question</span><div class="txt md">' + md(cur.q) + '</div><div class="from">' + E(s.name) + ' · ' + E(cur.fiche.title) + '</div></div>' +
        '<div class="fc-face fc-back"><span class="label">Réponse</span><div class="txt md">' + md(cur.a) + '</div><div class="from"><a href="#/fiche/' + encodeURIComponent(cur.fiche.id) + '">Voir la fiche</a></div></div>' +
        '</div></div><p class="fc-hint" id="hint">Réfléchis à la réponse, puis touche la carte (ou <span class="kbd">Espace</span>).</p>' +
        '<div class="grade" id="grade" hidden><button class="btn again" data-g="0">À revoir<small>je ne savais pas · 1</small></button>' +
        '<button class="btn hard" data-g="1">Hésitant<small>à moitié · 2</small></button>' +
        '<button class="btn good" data-g="2">Je savais<small>facile · 3</small></button></div></div>';
      const fc = $('#fc', v);
      fc.addEventListener('click', (e) => { if (!e.target.closest('a')) flip(); });
      $$('#grade button', v).forEach((b) => b.addEventListener('click', () => grade(+b.dataset.g)));
      fc.focus({ preventScroll: true });
    }
    function flip() {
      flipped = !flipped;
      $('#fc', v).classList.toggle('flipped', flipped);
      if (flipped) { $('#grade', v).hidden = false; $('#hint', v).textContent = 'Sois honnête : c\'est ce qui rend la révision efficace.'; }
    }
    function grade(g) {
      if (!flipped) return;
      Store.grade(cur.id, g);
      if (!seen.has(cur.id)) { seen.add(cur.id); results[g]++; done++; }
      if (g === 0) queue.push(cur);
      show();
    }
    function end() {
      App.renderNav();
      const ok = results[2], ratio = ok / total;
      v.innerHTML = '<div class="session"><div class="card result"><h2>Session terminée !</h2>' +
        '<div class="big">' + Math.round(ratio * 100) + ' %</div><p class="muted">de cartes sues du premier coup</p>' +
        '<div class="result-stats"><div><b style="color:var(--success)">' + results[2] + '</b><span>Je savais</span></div><div><b style="color:var(--warning)">' + results[1] + '</b><span>Hésitant</span></div><div><b style="color:var(--danger)">' + results[0] + '</b><span>À revoir</span></div></div>' +
        '<p class="small muted">Les cartes reviendront au bon moment : demain si tu as hésité, dans quelques jours si tu savais (méthode des boîtes de Leitner).</p>' +
        '<div class="row" style="justify-content:center"><a class="btn" href="' + opts.back + '">' + E(opts.backLabel || 'Terminer') + '</a>' +
        (opts.restart ? '<button class="btn secondary" id="restart">' + icon('refresh') + ' Recommencer</button>' : '') + '</div></div></div>';
      const r = $('#restart', v);
      if (r) r.onclick = opts.restart;
      App.setKeys(null);
    }
    App.setKeys((e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        const ae = document.activeElement;
        if (ae && /^(A|BUTTON)$/.test(ae.tagName)) return;
        e.preventDefault();
        if (cur) flip();
      }
      else if (flipped && /^[123]$/.test(e.key)) grade(+e.key - 1);
    });
    show();
  }

  /* ---------- Session de quiz ---------- */
  function quizSession(v, questions, opts) {
    const qs = questions.map((q) => ({ q, order: RC.shuffle(q.options.map((_, k) => k)) }));
    let i = 0, score = 0, answered = false;
    const answers = [];
    if (!qs.length) { v.innerHTML = '<div class="card empty">' + icon('quiz') + '<p>Aucune question ici.</p><a class="btn" href="' + opts.back + '">Retour</a></div>'; return; }
    function show() {
      if (i >= qs.length) return end();
      answered = false;
      const { q, order } = qs[i], s = RC.SUBJ[q.fiche.subject];
      v.innerHTML = '<div class="session" style="--c:' + s.color + '">' +
        '<div class="session-top"><a class="icon-btn" href="' + opts.back + '" aria-label="Quitter le quiz">' + icon('x') + '</a>' + bar(i / qs.length, s.color) + '<span class="count">' + (i + 1) + ' / ' + qs.length + '</span></div>' +
        '<div class="card"><div class="small muted" style="margin-bottom:6px">' + E(s.name) + (opts.mixed ? ' · ' + E(q.fiche.title) : '') + '</div>' +
        '<div class="q-text md">' + md(q.q) + '</div><div class="options">' +
        order.map((k, n) => '<button class="option" data-k="' + k + '"><span class="key">' + 'ABCDEF'.charAt(n) + '</span><span>' + RCMD.inline(q.options[k]) + '</span></button>').join('') +
        '</div><div id="after"></div></div></div>';
      $$('.option', v).forEach((b) => b.addEventListener('click', () => answer(+b.dataset.k)));
    }
    function answer(k) {
      if (answered) return;
      answered = true;
      const { q } = qs[i], ok = k === q.answer;
      if (ok) score++;
      answers.push({ q, chosen: k, ok });
      $$('.option', v).forEach((b) => {
        const kk = +b.dataset.k;
        b.disabled = true;
        b.classList.add(kk === q.answer ? 'correct' : kk === k ? 'wrong' : 'dim');
      });
      $('#after', v).innerHTML = '<div class="explain ' + (ok ? 'good' : 'bad') + '"><b>' + (ok ? 'Bonne réponse !' : 'Mauvaise réponse') + '</b>' +
        (!ok ? '<div>La bonne réponse : <b>' + RCMD.inline(q.options[q.answer]) + '</b></div>' : '') +
        (q.explain ? '<div class="md" style="margin-top:6px">' + md(q.explain) + '</div>' : '') + '</div>' +
        '<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="next">' + (i + 1 < qs.length ? 'Question suivante' : 'Voir mon score') + ' ' + icon('right') + '</button></div>';
      const nx = $('#next', v);
      nx.addEventListener('click', () => { i++; show(); window.scrollTo(0, 0); });
      nx.focus({ preventScroll: true });
    }
    function end() {
      App.setKeys(null);
      const pc = Math.round((score / qs.length) * 100);
      const res = Store.saveQuiz(opts.key || 'mix', score, qs.length);
      const msg = pc === 100 ? 'Parfait, rien à redire !' : pc >= 80 ? 'Très bien, c\'est presque acquis.' : pc >= 50 ? 'Pas mal ! Revois les points ratés.' : 'Il faut relire la fiche, puis retenter.';
      const wrong = answers.filter((a) => !a.ok);
      const toReview = Array.from(new Set(wrong.map((a) => a.q.fiche)));
      v.innerHTML = '<div class="session"><div class="card result"><h2>' + E(opts.title || 'Quiz terminé') + '</h2>' +
        '<div class="big" style="color:' + (pc >= 80 ? 'var(--success)' : pc >= 50 ? 'var(--warning)' : 'var(--danger)') + '">' + pc + ' %</div>' +
        '<p>' + score + ' bonne(s) réponse(s) sur ' + qs.length + ' — ' + msg + '</p>' +
        (opts.key && res.attempts > 1 ? '<p class="small muted">Meilleur score : ' + res.best + ' %</p>' : '') +
        '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="again">' + icon('refresh') + ' Recommencer</button>' +
        (wrong.length ? '<button class="btn secondary" id="errors">Refaire mes erreurs (' + wrong.length + ')</button>' : '') +
        '<a class="btn ghost" href="' + opts.back + '">' + E(opts.backLabel || 'Retour') + '</a></div></div>' +
        (wrong.length ? '<div class="card section"><h3>À revoir</h3>' + wrong.map((a) => '<div class="review-item"><div class="q">' + RCMD.inline(a.q.q.split('\n')[0]) + '</div>' +
          '<div class="small a-bad">' + RCMD.inline(a.q.options[a.chosen]) + '</div><div class="small a-ok">✓ ' + RCMD.inline(a.q.options[a.q.answer]) + '</div>' +
          (a.q.explain ? '<div class="small muted">' + RCMD.inline(a.q.explain.replace(/\n/g, ' ')) + '</div>' : '') + '</div>').join('') +
          (toReview.length ? '<p class="small" style="margin-top:12px">Fiches à relire : ' + toReview.map((f) => '<a href="#/fiche/' + encodeURIComponent(f.id) + '">' + E(f.title) + '</a>').join(' · ') + '</p>' : '') + '</div>' : '') + '</div>';
      $('#again', v).onclick = () => quizSession(v, RC.shuffle(questions), opts);
      const er = $('#errors', v);
      if (er) er.onclick = () => quizSession(v, wrong.map((a) => a.q), Object.assign({}, opts, { key: null }));
      App.renderNav();
    }
    App.setKeys((e) => {
      const k = e.key.toLowerCase();
      if (!answered) {
        const n = k.length === 1 ? '1234abcd'.indexOf(k) : -1;
        if (n !== -1) { const btn = $$('.option', v)[n % 4]; if (btn) btn.click(); }
      } else if (e.key === 'Enter' || e.key === ' ') { const nx = $('#next', v); if (nx && document.activeElement !== nx) { e.preventDefault(); nx.click(); } }
    });
    show();
  }

  /* ---------- Routes : cartes et quiz d'une fiche ou d'une matière ---------- */
  App.route(/^\/fiche\/([^/]+)\/cartes$/, (v, [id]) => {
    const f = RC.fiche(id);
    if (!f) return App.notFound(v, 'Fiche introuvable');
    App.setTitle('Cartes · ' + f.title);
    const back = '#/fiche/' + encodeURIComponent(f.id);
    const start = () => flashSession(v, RC.shuffle(f.cards), { back, backLabel: 'Retour à la fiche', restart: start });
    start();
  });
  App.route(/^\/fiche\/([^/]+)\/quiz$/, (v, [id]) => {
    const f = RC.fiche(id);
    if (!f) return App.notFound(v, 'Fiche introuvable');
    App.setTitle('Quiz · ' + f.title);
    quizSession(v, RC.shuffle(f.quiz), { back: '#/fiche/' + encodeURIComponent(f.id), backLabel: 'Retour à la fiche', key: 'f:' + f.id, title: 'Quiz : ' + f.title });
  });
  App.route(/^\/matiere\/([\w-]+)\/cartes$/, (v, [sid]) => {
    const s = RC.SUBJ[sid];
    if (!s) return App.notFound(v);
    App.setTitle('Cartes · ' + s.name);
    const all = RC.subjectFiches(sid).flatMap((f) => f.cards);
    const start = () => flashSession(v, prioritize(all, 20), { back: '#/matiere/' + sid, backLabel: 'Retour à la matière', restart: start });
    start();
  });
  App.route(/^\/matiere\/([\w-]+)\/quiz$/, (v, [sid]) => {
    const s = RC.SUBJ[sid];
    if (!s) return App.notFound(v);
    App.setTitle('Quiz · ' + s.name);
    const all = RC.subjectFiches(sid).flatMap((f) => f.quiz);
    quizSession(v, RC.shuffle(all).slice(0, 15), { back: '#/matiere/' + sid, backLabel: 'Retour à la matière', key: 's:' + sid, mixed: true, title: 'Quiz : ' + s.name });
  });

  /* ---------- Révision du jour ---------- */
  App.route(/^\/reviser$/, (v) => {
    App.setTitle('Révision du jour');
    const dq = RC.dailyQueue();
    const head = '<div class="page-head"><h1>Révision du jour</h1><p>Les cartes reviennent quand tu es sur le point de les oublier : quelques minutes par jour suffisent.</p></div>';
    if (!dq.queue.length) {
      v.innerHTML = head + '<div class="card empty">' + icon('check') + '<h2>Tout est à jour !</h2><p>Plus de carte prévue aujourd\'hui' + (RC.cards.length ? '' : ' (aucune carte disponible)') + '. Tu peux quand même t\'entraîner :</p>' +
        '<div class="row" style="justify-content:center"><button class="btn" id="extra">' + icon('shuffle') + ' 20 cartes au hasard</button><a class="btn secondary" href="#/quiz">Faire un quiz</a></div></div>';
      const x = $('#extra', v);
      if (x) x.onclick = () => flashSession(v, prioritize(RC.cards, 20), { back: '#/reviser', backLabel: 'Terminer' });
      return;
    }
    const bySubj = {};
    dq.queue.forEach((c) => { bySubj[c.fiche.subject] = (bySubj[c.fiche.subject] || 0) + 1; });
    v.innerHTML = head + '<div class="card"><div class="kpis" style="margin-bottom:16px">' +
      '<div class="kpi"><b>' + dq.due.length + '</b><span>cartes à revoir</span></div><div class="kpi"><b>' + dq.news.length + '</b><span>nouvelles cartes</span></div>' +
      '<div class="kpi"><b>~' + Math.max(1, Math.round(dq.queue.length * 0.25)) + ' min</b><span>temps estimé</span></div></div>' +
      '<div class="row" style="margin-bottom:16px">' + Object.keys(bySubj).map((sid) => '<span class="badge" style="background:color-mix(in srgb,' + RC.SUBJ[sid].color + ' 14%,var(--surface));color:' + RC.SUBJ[sid].color + '">' + E(RC.SUBJ[sid].name) + ' · ' + bySubj[sid] + '</span>').join('') + '</div>' +
      '<button class="btn lg" id="go">' + icon('cards') + ' Commencer</button></div>' +
      '<p class="small muted section">Nouvelles cartes par jour : ' + Store.state.settings.newPerDay + ' (modifiable dans les <a href="#/parametres">paramètres</a>). Les cartes des fiches que tu as marquées « lues » passent en premier.</p>';
    $('#go', v).onclick = () => flashSession(v, dq.queue, { back: '#/', backLabel: 'Retour à l\'accueil' });
  });

  /* ---------- Quiz mélangé ---------- */
  App.route(/^\/quiz$/, (v) => {
    App.setTitle('Quiz');
    const saved = Store.state.settings.quizSubjects;
    const subs = RC.SUBJECTS.filter((s) => RC.subjectFiches(s.id).some((f) => f.quiz.length));
    let count = Store.state.settings.quizCount || 10;
    const chip = (s) => '<label class="chip" style="--c:' + s.color + '"><input type="checkbox" value="' + s.id + '"' + (!saved || saved.indexOf(s.id) !== -1 ? ' checked' : '') + '> ' + E(s.name) + '</label>';
    v.innerHTML = '<div class="page-head"><h1>Quiz mélangé</h1><p>Des questions tirées au hasard dans les matières de ton choix.</p></div>' +
      '<div class="card stack">' + RC.GROUPS.concat([{ id: 'perso', name: 'Perso' }]).map((g) => {
        const list = subs.filter((s) => s.group === g.id);
        return list.length ? '<div><div class="row between" style="margin-bottom:8px"><b>' + E(g.name) + '</b><button class="btn ghost sm" data-all="' + g.id + '">Tout / rien</button></div><div class="row">' + list.map(chip).join('') + '</div></div>' : '';
      }).join('') +
      '<div><b>Nombre de questions</b><div class="seg" id="count" style="margin-top:8px">' + [10, 20, 30, 50].map((n) => '<button data-n="' + n + '" class="' + (n === count ? 'active' : '') + '">' + n + '</button>').join('') + '</div></div>' +
      '<div><button class="btn lg" id="go">' + icon('quiz') + ' Lancer le quiz</button> <span class="small muted" id="avail"></span></div></div>';
    const selected = () => $$('input[type=checkbox]', v).filter((c) => c.checked).map((c) => c.value);
    const pool = () => { const sel = selected(); return RC.questions.filter((q) => sel.indexOf(q.fiche.subject) !== -1); };
    const upd = () => { $('#avail', v).textContent = plural(pool().length, 'question disponible', 'questions disponibles'); };
    v.addEventListener('change', upd);
    v.addEventListener('click', (e) => {
      const all = e.target.closest('[data-all]');
      if (all) { const boxes = $$('input[type=checkbox]', v).filter((c) => RC.SUBJ[c.value].group === all.dataset.all); const on = !boxes.every((c) => c.checked); boxes.forEach((c) => { c.checked = on; }); upd(); }
      const n = e.target.closest('[data-n]');
      if (n) { count = +n.dataset.n; $$('#count button', v).forEach((b) => b.classList.toggle('active', b === n)); }
    });
    $('#go', v).onclick = () => {
      const p = pool();
      if (!p.length) { App.toast('Choisis au moins une matière.'); return; }
      Store.state.settings.quizSubjects = selected(); Store.setSetting('quizCount', count);
      App.setTitle('Quiz en cours');
      quizSession(v, RC.shuffle(p).slice(0, count), { back: '#/quiz', backLabel: 'Nouveau quiz', mixed: true, title: 'Quiz mélangé' });
    };
    upd();
  });

  /* ---------- Exercices interactifs ---------- */
  App.route(/^\/entrainement$/, (v) => {
    App.setTitle('Exercices');
    v.innerHTML = '<div class="page-head"><h1>Exercices interactifs</h1><p>Des exercices générés à l\'infini, corrigés pas à pas. Parfait avant un contrôle ou une épreuve pratique.</p></div><div class="grid wide">' +
      window.TRAINERS.map((t) => {
        const st = Store.state.trainers[t.id];
        return '<a class="card tool-card" style="--c:' + t.color + '" href="#/entrainement/' + t.id + '"><span class="s-icon">' + icon(t.icon) + '</span><div><h3>' + E(t.title) + '</h3><p>' + E(t.desc) + '</p>' +
          (st ? '<div class="row" style="margin-top:8px"><span class="badge ok">' + Math.round((st.ok / st.total) * 100) + ' % réussis</span><span class="badge violet">Record : ' + st.best + ' d\'affilée</span></div>' : '') + '</div></a>';
      }).join('') + '</div>';
  });

  const INPUTMODE = { ipv4: 'text', conversions: 'text', ohm: 'decimal', resistances: 'text', pourcentages: 'decimal' };
  App.route(/^\/entrainement\/([\w-]+)$/, (v, [tid]) => {
    const t = window.TRAINERS.find((x) => x.id === tid);
    if (!t) return App.notFound(v, 'Exercice introuvable');
    App.setTitle(t.title);
    const sess = { ok: 0, total: 0 };
    let ex = null, answered = false;
    v.innerHTML = '<div class="crumbs"><a href="#/">Accueil</a><span>›</span><a href="#/entrainement">Exercices</a></div><div class="session" style="--c:' + t.color + ';max-width:760px;margin:0">' +
      '<div class="subject-head">' + sIcon(t) + '<div><h1>' + E(t.title) + '</h1><p class="muted" style="margin:0">' + E(t.desc) + '</p></div></div>' +
      '<div class="score-line" id="score"></div><div class="card" id="ex"></div>' +
      (RC.SUBJ[t.subject] ? '<p class="small muted section">Le cours correspondant est dans <a href="#/matiere/' + t.subject + '">' + E(RC.SUBJ[t.subject].name) + '</a>.</p>' : '') + '</div>';
    const scoreLine = () => {
      const st = Store.state.trainers[t.id] || { streak: 0, best: 0 };
      $('#score', v).innerHTML = '<span class="badge ok">Session : ' + sess.ok + ' / ' + sess.total + '</span><span class="badge info">Série en cours : ' + st.streak + '</span><span class="badge violet">Record : ' + st.best + '</span>';
    };
    function next() {
      ex = t.generate(); answered = false;
      $('#ex', v).innerHTML = '<div class="trainer-q">' + ex.question + (ex.value ? '<div class="big-val">' + E(ex.value) + '</div>' : '') + '</div>' + (ex.extra || '') +
        '<form class="answer-row" id="af" autocomplete="off"><input class="input" id="ai" inputmode="' + (INPUTMODE[t.id] || 'text') + '" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + E(ex.placeholder || 'Ta réponse') + '" aria-label="Ta réponse">' +
        '<button class="btn" id="ab">Valider</button></form><div class="row" style="margin-top:10px"><button class="btn ghost sm" id="skip">Je ne sais pas, montre-moi</button></div><div id="fb"></div>';
      $('#af', v).addEventListener('submit', (e) => { e.preventDefault(); if (answered) next(); else check(false); });
      $('#skip', v).onclick = () => { if (!answered) check(true); };
      scoreLine();
      $('#ai', v).focus({ preventScroll: true });
    }
    function check(skip) {
      const val = $('#ai', v).value;
      if (!skip && !val.trim()) { $('#ai', v).focus(); return; }
      const ok = !skip && ex.check(val);
      answered = true;
      sess.total++; if (ok) sess.ok++;
      Store.trainerResult(t.id, ok);
      $('#fb', v).innerHTML = '<div class="feedback ' + (ok ? 'good' : 'bad') + '"><h3>' + (ok ? 'Bravo, c\'est juste !' : skip ? 'Voici la correction' : 'Pas tout à fait…') + '</h3>' +
        '<div>Réponse attendue : <b><code>' + E(ex.answer) + '</code></b></div><ol class="steps">' + ex.steps.map((s) => '<li>' + s + '</li>').join('') + '</ol></div>';
      $('#ab', v).textContent = 'Exercice suivant';
      $('#skip', v).hidden = true;
      $('#ab', v).focus();
      scoreLine();
    }
    next();
  });

  App.flashSession = flashSession;
  App.quizSession = quizSession;
})();

</script>
<script>
/* RéviCIEL — pages : progression et paramètres */
(function () {
  'use strict';
  const { E, icon, $, $$, bar, pct, plural } = App;

  /* ---------- Progression ---------- */
  App.route(/^\/progression$/, (v) => {
    App.setTitle('Progression');
    const st = Store.state;
    const readCount = RC.fiches.filter((f) => st.read[f.id]).length;
    const seen = RC.cards.filter((c) => !Store.isNew(c.id)).length;
    const mastered = RC.cards.filter((c) => Store.isMastered(c.id)).length;
    const log = st.quizLog || [];
    const avg = log.length ? Math.round(log.slice(-30).reduce((a, x) => a + x.p, 0) / Math.min(30, log.length)) : null;

    // Calendrier d'activité (16 dernières semaines)
    const days = 16 * 7, t = Store.today();
    const start = new Date(); start.setDate(start.getDate() - days + 1);
    start.setDate(start.getDate() - ((start.getDay() + 6) % 7)); // commence un lundi
    let heat = '';
    for (let d = new Date(start); Store.today(d) <= t; d.setDate(d.getDate() + 1)) {
      const k = Store.today(d), n = st.activity[k] || 0;
      const lvl = n === 0 ? '' : n < 5 ? 'l1' : n < 15 ? 'l2' : n < 30 ? 'l3' : 'l4';
      heat += '<i class="' + lvl + '" title="' + k.split('-').reverse().join('/') + ' : ' + n + ' activité(s)"></i>';
    }

    let html = '<div class="page-head"><h1>Ma progression</h1><p>Tout est enregistré sur cet appareil. Pense à faire une sauvegarde dans les <a href="#/parametres">paramètres</a>.</p></div>' +
      '<div class="kpis"><div class="kpi"><b>' + Store.streak() + '</b><span>jour(s) d\'affilée</span></div>' +
      '<div class="kpi"><b>' + readCount + '/' + RC.fiches.length + '</b><span>fiches lues</span></div>' +
      '<div class="kpi"><b>' + seen + '</b><span>cartes étudiées</span></div>' +
      '<div class="kpi"><b>' + mastered + '</b><span>cartes maîtrisées</span></div>' +
      '<div class="kpi"><b>' + (avg == null ? '—' : avg + ' %') + '</b><span>moyenne aux quiz</span></div></div>';

    html += '<div class="card section"><h2>Par matière</h2><p class="small muted">Maîtrise = fiches lues + cartes sues + meilleur score au quiz.</p><div class="subj-progress">' +
      RC.SUBJECTS.filter((s) => RC.subjectFiches(s.id).length).map((s) => {
        const ss = RC.subjectStats(s.id);
        return '<a class="line" href="#/matiere/' + s.id + '" style="--c:' + s.color + ';color:inherit;text-decoration:none"><span class="name"><i></i>' + E(s.name) + '</span>' + bar(ss.score, s.color) + '<span class="pct">' + pct(ss.score) + '</span></a>';
      }).join('') + '</div></div>';

    html += '<div class="card section"><h2>Activité</h2><p class="small muted">Chaque carte, quiz, exercice ou fiche lue compte.</p><div class="heat">' + heat + '</div></div>';

    // Cartes par boîte de Leitner
    const boxes = [0, 0, 0, 0, 0, 0];
    RC.cards.forEach((c) => { const i = Store.cardInfo(c.id); boxes[i ? i.box : 0]++; });
    const maxB = Math.max(1, ...boxes);
    html += '<div class="card section"><h2>Mes cartes par boîte</h2><p class="small muted">Boîte 1 : revue chaque jour… boîte 5 : revue tous les 30 jours. Une carte est « maîtrisée » à partir de la boîte 4.</p><div class="subj-progress">' +
      ['Jamais vues', 'Boîte 1', 'Boîte 2', 'Boîte 3', 'Boîte 4', 'Boîte 5'].map((lab, i) => '<div class="line" style="--c:' + ['#94a3b8', '#dc2626', '#f97316', '#eab308', '#22c55e', '#15803d'][i] + '"><span class="name"><i></i>' + lab + '</span>' + bar(boxes[i] / maxB) + '<span class="pct">' + boxes[i] + '</span></div>').join('') + '</div></div>';

    const recent = log.slice(-10).reverse();
    if (recent.length) {
      html += '<div class="card section"><h2>Derniers quiz</h2><ul class="list-plain">' + recent.map((x) => {
        let name = 'Quiz mélangé';
        if (x.k.indexOf('f:') === 0) { const f = RC.fiche(x.k.slice(2)); name = f ? f.title : 'Fiche supprimée'; }
        else if (x.k.indexOf('s:') === 0) { const s = RC.SUBJ[x.k.slice(2)]; name = 'Quiz ' + (s ? s.name : ''); }
        return '<li class="row between"><span>' + E(name) + ' <span class="small muted">· ' + x.d.split('-').reverse().join('/') + '</span></span><span class="badge ' + (x.p >= 80 ? 'ok' : x.p >= 50 ? 'warn' : 'bad') + '">' + x.p + ' %</span></li>';
      }).join('') + '</ul></div>';
    }
    const tr = window.TRAINERS.filter((x) => st.trainers[x.id]);
    if (tr.length) {
      html += '<div class="card section"><h2>Exercices</h2><ul class="list-plain">' + tr.map((x) => {
        const s = st.trainers[x.id];
        return '<li class="row between"><a href="#/entrainement/' + x.id + '">' + E(x.title) + '</a><span class="small">' + s.ok + '/' + s.total + ' réussis · record ' + s.best + '</span></li>';
      }).join('') + '</ul></div>';
    }
    v.innerHTML = html;
  });

  /* ---------- Paramètres ---------- */
  App.route(/^\/parametres$/, (v) => {
    App.setTitle('Paramètres');
    const render = () => {
      const s = Store.state.settings, P = window.PWA;
      const seg = (key, opts) => '<div class="seg" data-key="' + key + '">' + opts.map((o) => '<button data-v="' + o[0] + '" class="' + (String(s[key]) === String(o[0]) ? 'active' : '') + '">' + o[1] + '</button>').join('') + '</div>';
      let appStatus;
      if (location.protocol === 'file:') appStatus = '<span class="status-warn">Ouvert depuis un fichier</span><br><span class="small">Tout fonctionne sans connexion, mais pour l\'installer comme une appli il faut l\'ouvrir depuis une adresse web (voir le mode d\'emploi).</span>';
      else if (P && P.isStandalone()) appStatus = '<span class="status-ok">✓ Appli installée</span>' + (P.offlineReady() ? ' · <span class="status-ok">disponible hors connexion</span>' : '');
      else if (P && P.offlineReady()) appStatus = '<span class="status-ok">✓ Disponible hors connexion</span><br><span class="small">Le site est enregistré sur cet appareil.</span>';
      else appStatus = '<span class="status-warn">Préparation du mode hors connexion…</span><br><span class="small">Recharge la page une fois connecté si ce message reste affiché.</span>';
      v.innerHTML = '<div class="page-head"><h1>Paramètres</h1></div>' +
        '<div class="card"><h2>Affichage</h2>' +
        '<div class="settings-row"><div class="lbl"><b>Thème</b><span>Auto suit le réglage de ton appareil.</span></div>' + seg('theme', [['auto', 'Auto'], ['light', 'Clair'], ['dark', 'Sombre']]) + '</div>' +
        '<div class="settings-row"><div class="lbl"><b>Taille du texte</b></div>' + seg('fontSize', [['m', 'Normale'], ['l', 'Grande']]) + '</div>' +
        '<div class="settings-row"><div class="lbl"><b>Nouvelles cartes par jour</b><span>Dans la révision du jour.</span></div>' + seg('newPerDay', [[10, '10'], [20, '20'], [30, '30'], [50, '50']]) + '</div></div>' +
        '<div class="card section"><h2>Application</h2>' +
        '<div class="settings-row"><div class="lbl"><b>Mode hors connexion</b><span>' + appStatus + '</span></div></div>' +
        (P && P.canInstall() ? '<div class="settings-row"><div class="lbl"><b>Installer l\'appli</b><span>Ajoute RéviCIEL à ton écran d\'accueil ou à ton PC.</span></div><button class="btn" data-act="install">' + icon('phone') + ' Installer</button></div>' : '') +
        (P && P.isIOS() && !P.isStandalone() ? '<div class="settings-row"><div class="lbl"><b>Installer sur iPhone / iPad</b><span>Dans Safari : bouton Partager → « Sur l\'écran d\'accueil ».</span></div></div>' : '') +
        (P && P.reg ? '<div class="settings-row"><div class="lbl"><b>Mises à jour</b><span>Version du contenu : ' + E((window.REVICIEL_CONTENT || {}).version || '?') + '</span></div><button class="btn secondary" data-act="update">' + icon('refresh') + ' Vérifier</button></div>' : '') +
        '</div>' +
        '<div class="card section"><h2>Mes données</h2><p class="small muted">Ta progression et tes fiches perso sont enregistrées uniquement dans ce navigateur. Exporte une sauvegarde pour les transférer sur un autre appareil.</p>' +
        '<div class="settings-row"><div class="lbl"><b>Sauvegarder</b><span>Fichier .json (progression + fiches perso).</span></div><button class="btn secondary" data-act="export">' + icon('download') + ' Exporter</button></div>' +
        '<div class="settings-row"><div class="lbl"><b>Restaurer</b><span>Remplace la progression de cet appareil.</span></div><button class="btn secondary" data-act="import">' + icon('upload') + ' Importer</button></div>' +
        '<div class="settings-row"><div class="lbl"><b>Remettre à zéro</b><span>Efface la progression (pas tes fiches perso).</span></div><button class="btn danger" data-act="reset">' + icon('trash') + ' Réinitialiser</button></div></div>' +
        '<div class="card section"><h2>À propos</h2><p>RéviCIEL — révisions de Première Bac Pro CIEL : ' + plural(RC.fiches.length, 'fiche') + ', ' + plural(RC.cards.length, 'carte') + ', ' + plural(RC.questions.length, 'question') + ' de quiz et ' + window.TRAINERS.length + ' exercices générés.</p>' +
        '<p class="small muted">Les fiches résument le programme : en cas de doute, ton cours et ton professeur font foi. Raccourcis : <span class="kbd">Espace</span> retourne une carte, <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> notent, <span class="kbd">A</span>–<span class="kbd">D</span> répondent au quiz.</p></div>';
    };
    render();
    v.addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      const segEl = b.closest('.seg');
      if (segEl && b.dataset.v != null) {
        const key = segEl.dataset.key;
        Store.setSetting(key, key === 'newPerDay' ? +b.dataset.v : b.dataset.v);
        App.applySettings(); App.renderNav(); render();
        return;
      }
      const act = b.dataset.act;
      if (act === 'install') { await window.PWA.install(); render(); }
      else if (act === 'update') { App.toast('Recherche de mise à jour…'); window.PWA.checkUpdate().then((found) => { if (!found) App.toast('Tu as déjà la dernière version.'); }); }
      else if (act === 'export') {
        App.download('reviciel-sauvegarde-' + Store.today() + '.json', JSON.stringify(Store.exportAll(), null, 1), 'application/json');
        App.toast('Sauvegarde téléchargée.');
      } else if (act === 'import') {
        const [file] = await App.pickFiles('.json,application/json', false);
        if (!file) return;
        try {
          const data = JSON.parse(await App.readFile(file));
          if (!confirm('Restaurer cette sauvegarde ? La progression actuelle de cet appareil sera remplacée.')) return;
          Store.importAll(data);
          RC.load(); App.applySettings(); App.renderNav(); render();
          App.toast('Sauvegarde restaurée !');
        } catch (err) { App.toast('Import impossible : ' + err.message); }
      } else if (act === 'reset') {
        if (confirm('Effacer toute ta progression (fiches lues, cartes, quiz, exercices) ? Tes fiches perso sont conservées. Action irréversible.')) {
          Store.resetProgress(); App.renderNav(); render(); App.toast('Progression remise à zéro.');
        }
      }
    });
    const onPwa = () => render();
    window.addEventListener('pwa-change', onPwa);
    return () => window.removeEventListener('pwa-change', onPwa);
  });
})();

<script>
/* RéviCIEL — « Mes fiches » : créer, modifier, importer et exporter ses propres fiches */
(function () {
  'use strict';
  const { E, icon, $, $$, plural } = App;

  const TEMPLATE = [
    '## Le cours',
    '',
    'Écris ici ton cours. Tu peux mettre **du gras**, ==des mots clés surlignés== (cachés en « mode caché ») et des listes :',
    '',
    '- un point important',
    '- un autre point',
    '',
    '> [!retenir]',
    '> La phrase à connaître par cœur.',
    '',
    '=== CARTES ===',
    'Q: Ma question ?',
    'R: Ma réponse.',
    '',
    '=== QUIZ ===',
    '? Ma question à choix multiple ?',
    '- une mauvaise réponse',
    '+ la bonne réponse',
    '- une autre mauvaise réponse',
    '! Une explication affichée après la réponse (facultatif).',
    ''
  ].join('\n');

  const HELP = '<details class="card section help"><summary><b>Aide : comment écrire une fiche ?</b></summary>' +
    '<p>Le texte s\'écrit en <b>Markdown</b> simplifié :</p><pre>## Titre de partie\n### Sous-titre\n**gras**   *italique*   ==surligné==   `code`\nH~2~O (indice)   x^2^ (exposant)\n- liste à puces\n1. liste numérotée\n| Colonne 1 | Colonne 2 |\n|---|---|\n| case | case |\n\n> [!retenir]      (aussi : definition, exemple,\n> Texte encadré     attention, astuce, formule)</pre>' +
    '<p>Ensuite, les <b>cartes mémoire</b> après la ligne <code>=== CARTES ===</code> :</p><pre>Q: La question\nR: La réponse (peut faire plusieurs lignes)</pre>' +
    '<p>Et le <b>quiz</b> après <code>=== QUIZ ===</code> : une ligne <code>?</code> pour la question, <code>-</code> pour chaque mauvaise réponse, <code>+</code> pour la bonne, <code>!</code> pour l\'explication.</p></details>';

  function newId() { return 'perso-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function bodyOf(src) { return String(src || '').replace(/\r\n?/g, '\n').replace(/^---\n[\s\S]*?\n---[ \t]*(\n|$)/, '').replace(/^\n+/, ''); }
  function withId(src, id) {
    src = String(src).replace(/\r\n?/g, '\n').replace(/^﻿/, '');
    if (/^---\n[\s\S]*?\n---/.test(src)) {
      return src.replace(/^---\n([\s\S]*?)\n---/, (m, head) => {
        const lines = head.split('\n').filter((l) => !/^\s*id\s*:/i.test(l));
        return '---\nid: ' + id + '\n' + lines.join('\n') + '\n---';
      });
    }
    return '---\nid: ' + id + '\ntitre: Fiche importée\n---\n\n' + src;
  }
  function reload() { RC.load(); App.renderNav(); }

  /* ---------- Import ---------- */
  async function importFiles() {
    const files = await App.pickFiles('.md,.txt,.json,text/markdown,text/plain,application/json', true);
    if (!files.length) return 0;
    let n = 0;
    for (const file of files) {
      try {
        const text = await App.readFile(file);
        if (/\.json$/i.test(file.name)) {
          const data = JSON.parse(text);
          const list = Array.isArray(data.userFiches) ? data.userFiches : Array.isArray(data) ? data : [];
          list.forEach((u) => {
            if (!u || typeof u.src !== 'string') return;
            const id = typeof u.id === 'string' && /^perso-/.test(u.id) ? u.id : newId();
            Store.upsertUserFiche(id, withId(u.src, id)); n++;
          });
        } else {
          const parsed = RCMD.parseFiche(text);
          const id = /^perso-/.test(parsed.id) ? parsed.id : newId();
          Store.upsertUserFiche(id, withId(text, id)); n++;
        }
      } catch (err) { App.toast('« ' + file.name + ' » : ' + err.message); }
    }
    reload();
    App.toast(n ? plural(n, 'fiche importée', 'fiches importées') + ' !' : 'Aucune fiche trouvée dans ce fichier.');
    return n;
  }

  /* ---------- Liste « Mes fiches » ---------- */
  App.route(/^\/mes-fiches$/, (v) => {
    App.setTitle('Mes fiches');
    const render = () => {
      const list = Store.userFiches.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0)).map((u) => RC.fiche(u.id)).filter(Boolean);
      v.innerHTML = '<div class="page-head"><h1>Mes fiches</h1><p>Crée tes propres fiches (avec cartes et quiz) : elles s\'ajoutent à la matière choisie et à la révision du jour.</p></div>' +
        '<div class="row" style="margin-bottom:18px"><a class="btn" href="#/editeur">' + icon('plus') + ' Nouvelle fiche</a>' +
        '<button class="btn secondary" data-act="import">' + icon('upload') + ' Importer (.md / .json)</button>' +
        (list.length ? '<button class="btn ghost" data-act="export-all">' + icon('download') + ' Tout exporter</button>' : '') + '</div>' +
        (list.length ? '<div class="fiche-list">' + list.map((f) => {
          const s = RC.SUBJ[f.subject], u = Store.userFiches.find((x) => x.id === f.id);
          const date = u && u.updated ? new Date(u.updated).toLocaleDateString('fr-FR') : '';
          return '<div class="fiche-row" style="--c:' + s.color + '"><span class="num">' + icon('pen') + '</span><div class="body"><h3><a href="#/fiche/' + encodeURIComponent(f.id) + '">' + E(f.title) + '</a></h3>' +
            '<p>' + E(s.name) + (date ? ' · modifiée le ' + date : '') + ' · ' + plural(f.cards.length, 'carte') + ' · ' + plural(f.quiz.length, 'question') + '</p>' +
            (f.errors.length ? '<div class="badges"><span class="badge bad">' + plural(f.errors.length, 'erreur') + ' de format</span></div>' : '') + '</div>' +
            '<div class="row" style="flex:none"><a class="btn ghost sm" href="#/editeur/' + encodeURIComponent(f.id) + '">' + icon('pen') + ' Modifier</a>' +
            '<button class="btn ghost sm" data-act="export" data-id="' + E(f.id) + '" aria-label="Exporter">' + icon('download') + '</button>' +
            '<button class="btn ghost sm" data-act="delete" data-id="' + E(f.id) + '" aria-label="Supprimer">' + icon('trash') + '</button></div></div>';
        }).join('') + '</div>' :
          '<div class="card empty">' + icon('pen') + '<h2>Aucune fiche perso pour l\'instant</h2><p>Crée ta première fiche, importe un fichier .md, ou ouvre une fiche officielle et touche « Personnaliser » pour la copier.</p></div>') +
        HELP;
    };
    render();
    v.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act, id = b.dataset.id;
      if (act === 'import') { await importFiles(); render(); }
      else if (act === 'export-all') {
        App.download('mes-fiches-reviciel.json', JSON.stringify({ app: 'RéviCIEL', format: 1, type: 'fiches', userFiches: Store.userFiches }, null, 1), 'application/json');
      } else if (act === 'export') {
        const u = Store.userFiches.find((x) => x.id === id), f = RC.fiche(id);
        if (u) App.download(App.fileSlug(f ? f.title : id) + '.md', u.src, 'text/markdown');
      } else if (act === 'delete') {
        const f = RC.fiche(id);
        if (confirm('Supprimer définitivement la fiche « ' + (f ? f.title : id) + ' » ? (Pense à l\'exporter avant si tu veux la garder.)')) {
          Store.deleteUserFiche(id); reload(); render(); App.toast('Fiche supprimée.');
        }
      }
    });
  });

  /* ---------- Éditeur ---------- */
  App.route(/^\/editeur(?:\/([^/]+))?$/, (v, [id], params) => {
    const existing = id ? Store.userFiches.find((u) => u.id === id) : null;
    if (id && !existing) return App.notFound(v, 'Fiche perso introuvable');
    const fid = id || newId();
    const p = existing ? RCMD.parseFiche(existing.src) : null;
    let data = {
      titre: p ? p.title : '',
      matiere: p ? p.subject : (RC.SUBJ[params.get('matiere')] ? params.get('matiere') : 'perso'),
      chapitre: p ? p.chapter : '',
      resume: p ? p.summary : '',
      motscles: p ? p.tags.join(', ') : '',
      body: existing ? bodyOf(existing.src) : TEMPLATE
    };
    const draftKey = id || 'nouvelle';
    const draft = Store.getDraft();
    let restored = false;
    if (draft && draft.key === draftKey && draft.data && JSON.stringify(draft.data) !== JSON.stringify(data)) { data = Object.assign(data, draft.data); restored = true; }
    App.setTitle(existing ? 'Modifier · ' + data.titre : 'Nouvelle fiche');

    const opts = RC.SUBJECTS.map((s) => '<option value="' + s.id + '"' + (s.id === data.matiere ? ' selected' : '') + '>' + E(s.name) + '</option>').join('');
    v.innerHTML = '<div class="crumbs"><a href="#/mes-fiches">Mes fiches</a><span>›</span><span>' + (existing ? 'Modifier' : 'Nouvelle fiche') + '</span></div>' +
      '<div class="page-head row between"><h1 style="margin:0">' + (existing ? 'Modifier ma fiche' : 'Nouvelle fiche') + '</h1><div class="row">' +
      (existing ? '<button class="btn danger" id="del">' + icon('trash') + ' Supprimer</button>' : '') +
      '<a class="btn ghost" href="' + (existing ? '#/fiche/' + encodeURIComponent(fid) : '#/mes-fiches') + '" id="cancel">Annuler</a><button class="btn" id="save">' + icon('check') + ' Enregistrer</button></div></div>' +
      (restored ? '<div class="callout info" id="restored"><div class="callout-title">Brouillon restauré</div><p>Tes modifications non enregistrées ont été récupérées. <button class="btn ghost sm" id="discard">Les abandonner</button></p></div>' : '') +
      '<div class="editor-meta">' +
      '<div class="field"><label for="ed-titre">Titre *</label><input class="input" id="ed-titre" value="' + E(data.titre) + '" placeholder="Ex. : Le modèle OSI" maxlength="120"></div>' +
      '<div class="field"><label for="ed-matiere">Matière</label><select class="input" id="ed-matiere">' + opts + '</select></div>' +
      '<div class="field"><label for="ed-chapitre">Chapitre (facultatif)</label><input class="input" id="ed-chapitre" value="' + E(data.chapitre) + '" placeholder="Ex. : Réseaux — bases"></div>' +
      '<div class="field"><label for="ed-resume">Résumé (facultatif)</label><input class="input" id="ed-resume" value="' + E(data.resume) + '" placeholder="Une phrase qui résume la fiche"></div>' +
      '</div>' +
      '<div class="seg editor-tabs" id="tabs"><button class="active" data-pane="write">Écrire</button><button data-pane="preview">Aperçu</button></div>' +
      '<div class="editor-grid"><div class="pane" data-pane="write"><div class="toolbar" id="tb">' +
      [['h', 'Titre'], ['b', 'Gras'], ['m', 'Surligné'], ['ul', 'Liste'], ['tbl', 'Tableau'], ['call', 'Encadré'], ['card', '+ Carte'], ['q', '+ Question']].map((x) => '<button type="button" data-ins="' + x[0] + '">' + x[1] + '</button>').join('') +
      '</div><textarea class="editor-area" id="ed-body" spellcheck="true" aria-label="Contenu de la fiche">' + E(data.body) + '</textarea><div class="parse-info" id="info"></div></div>' +
      '<div class="pane" data-pane="preview" hidden><div class="preview-pane"><div class="md" id="preview"></div></div></div></div>' + HELP;

    const els = { titre: $('#ed-titre', v), matiere: $('#ed-matiere', v), chapitre: $('#ed-chapitre', v), resume: $('#ed-resume', v), body: $('#ed-body', v) };
    let dirty = restored;
    const collect = () => ({ titre: els.titre.value.trim(), matiere: els.matiere.value, chapitre: els.chapitre.value.trim(), resume: els.resume.value.trim(), motscles: data.motscles, body: els.body.value });
    const build = (d) => RCMD.buildSource({ id: fid, matiere: d.matiere, titre: d.titre || 'Sans titre', chapitre: d.chapitre, resume: d.resume, 'mots-cles': d.motscles }, d.body);
    function refresh() {
      const d = collect(), f = RCMD.parseFiche(build(d));
      $('#preview', v).innerHTML = '<h1 style="font-size:1.5rem">' + E(d.titre || 'Sans titre') + '</h1>' + RCMD.render(f.body).html +
        (f.cards.length ? '<h2>Cartes (' + f.cards.length + ')</h2><ol>' + f.cards.map((c) => '<li><b>' + RCMD.inline(c.q.split('\n')[0]) + '</b><br>' + RCMD.inline(c.a.split('\n')[0]) + '</li>').join('') + '</ol>' : '') +
        (f.quiz.length ? '<h2>Quiz (' + f.quiz.length + ')</h2><ol>' + f.quiz.map((q) => '<li>' + RCMD.inline(q.q.split('\n')[0]) + ' <span class="muted">→ ' + RCMD.inline(q.options[q.answer]) + '</span></li>').join('') + '</ol>' : '');
      $('#info', v).innerHTML = '<span>' + plural(f.cards.length, 'carte') + ' · ' + plural(f.quiz.length, 'question') + ' détectée(s)</span>' +
        f.errors.map((er) => '<div class="err">⚠ ' + E(er) + '</div>').join('');
    }
    const saveDraft = App.debounce(() => { if (dirty) Store.setDraft({ key: draftKey, data: collect() }); }, 400);
    const onInput = App.debounce(refresh, 250);
    v.addEventListener('input', (e) => { if (e.target.closest('.editor-meta, #ed-body')) { dirty = true; onInput(); saveDraft(); } });
    v.addEventListener('change', (e) => { if (e.target === els.matiere) { dirty = true; saveDraft(); } });

    // Barre d'outils : insertion de modèles
    const SNIP = {
      h: ['\n## ', 'Titre de partie', '\n'], b: ['**', 'texte en gras', '**'], m: ['==', 'mot clé', '=='],
      ul: ['\n- ', 'premier point', '\n- deuxième point\n'], tbl: ['\n| Colonne 1 | Colonne 2 |\n|---|---|\n| ', 'case', ' | case |\n'],
      call: ['\n> [!retenir]\n> ', 'Ce qu\'il faut retenir.', '\n'], card: ['\nQ: ', 'Ma question ?', '\nR: Ma réponse.\n'],
      q: ['\n? ', 'Ma question ?', '\n- mauvaise réponse\n+ bonne réponse\n- mauvaise réponse\n! Explication.\n']
    };
    $('#tb', v).addEventListener('click', (e) => {
      const b = e.target.closest('[data-ins]');
      if (!b) return;
      const ta = els.body, [pre, def, post] = SNIP[b.dataset.ins];
      let s = ta.selectionStart, en = ta.selectionEnd;
      const sel = ta.value.slice(s, en) || def;
      let before = pre;
      if (b.dataset.ins === 'card' && !/=== *CARTES *===/i.test(ta.value)) before = '\n=== CARTES ===' + pre;
      if (b.dataset.ins === 'q' && !/=== *(QUIZ|QCM) *===/i.test(ta.value)) { s = en = ta.value.length; before = '\n\n=== QUIZ ===' + pre; }
      ta.setRangeText(before + sel + post, s, en, 'end');
      ta.focus();
      const start = s + before.length;
      ta.setSelectionRange(start, start + sel.length);
      dirty = true; refresh(); saveDraft();
    });
    els.body.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); els.body.setRangeText('  ', els.body.selectionStart, els.body.selectionEnd, 'end'); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    });
    $('#tabs', v).addEventListener('click', (e) => {
      const b = e.target.closest('[data-pane]');
      if (!b) return;
      $$('#tabs button', v).forEach((x) => x.classList.toggle('active', x === b));
      $$('.editor-grid .pane', v).forEach((p) => { p.hidden = p.dataset.pane !== b.dataset.pane; });
      if (b.dataset.pane === 'preview') refresh();
    });

    function save() {
      const d = collect();
      if (!d.titre) { App.toast('Donne un titre à ta fiche.'); els.titre.focus(); return; }
      const ok = Store.upsertUserFiche(fid, build(d));
      if (!ok) { App.toast('Enregistrement impossible : le stockage du navigateur est plein ou bloqué.'); return; }
      Store.clearDraft(); dirty = false;
      reload();
      App.toast('Fiche enregistrée !');
      App.go('#/fiche/' + encodeURIComponent(fid));
    }
    $('#save', v).onclick = save;
    $('#cancel', v).addEventListener('click', () => { Store.clearDraft(); dirty = false; });
    const disc = $('#discard', v);
    if (disc) disc.onclick = () => { Store.clearDraft(); dirty = false; App.navigate(); };
    const del = $('#del', v);
    if (del) del.onclick = () => {
      if (!confirm('Supprimer définitivement cette fiche ?')) return;
      Store.deleteUserFiche(fid); Store.clearDraft(); dirty = false; reload(); App.toast('Fiche supprimée.'); App.go('#/mes-fiches');
    };
    refresh();
    if (!existing) els.titre.focus();
    const beforeUnload = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', beforeUnload);
    return () => window.removeEventListener('beforeunload', beforeUnload);
  });
})();

</script>
<script>
/* RéviCIEL — application installable (PWA) : hors connexion, installation, mises à jour */
(function () {
  'use strict';
  const emit = () => window.dispatchEvent(new Event('pwa-change'));
  const PWA = {
    deferred: null, reg: null, updating: false,
    isStandalone: () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true,
    isIOS: () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
    canInstall: () => !!PWA.deferred,
    offlineReady: () => !!(navigator.serviceWorker && navigator.serviceWorker.controller),
    async install() {
      if (!PWA.deferred) return false;
      PWA.deferred.prompt();
      const choice = await PWA.deferred.userChoice;
      PWA.deferred = null;
      emit();
      return choice.outcome === 'accepted';
    },
    async checkUpdate() {
      if (!PWA.reg) return false;
      await PWA.reg.update();
      return !!(PWA.reg.installing || PWA.reg.waiting);
    }
  };
  window.PWA = PWA;

  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); PWA.deferred = e; emit(); });
  window.addEventListener('appinstalled', () => {
    PWA.deferred = null;
    App.toast('Appli installée ! Lance-la depuis ton écran d\'accueil.');
    emit();
  });

  // Indicateur « Hors ligne »
  const badge = document.getElementById('net-badge');
  const net = () => { badge.hidden = navigator.onLine; };
  window.addEventListener('online', net);
  window.addEventListener('offline', net);
  net();

  // Service worker : met tout le site en cache pour réviser sans connexion
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    const promptUpdate = (worker) => {
      App.toast('Une nouvelle version de RéviCIEL est disponible.', {
        action: 'Mettre à jour', duration: 20000,
        onAction: () => { PWA.updating = true; worker.postMessage({ type: 'SKIP_WAITING' }); }
      });
    };
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        PWA.reg = reg;
        if (reg.waiting && navigator.serviceWorker.controller) promptUpdate(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state !== 'installed') return;
            if (navigator.serviceWorker.controller) promptUpdate(nw);
            else App.toast('RéviCIEL est prêt : il fonctionne maintenant sans connexion ✓');
          });
        });
        emit();
      }).catch((err) => console.warn('Service worker non enregistré :', err));
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (PWA.updating) { PWA.updating = false; location.reload(); } else emit();
    });
  }
})();

</script>
<script>
/* RéviCIEL — démarrage de l'application */
(function () {
  'use strict';
  Store.onError = () => App.toast('Attention : ta progression ne peut pas être enregistrée (navigation privée ou stockage plein).', { duration: 8000 });
  RC.load();
  App.applySettings();
  App.renderNav();
  App.bindTopSearch();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', App.applySettings);
  window.addEventListener('hashchange', App.navigate);
  // Met à jour le compteur « Réviser » quand on revient sur l'appli le lendemain
  document.addEventListener('visibilitychange', () => { if (!document.hidden) App.renderNav(); });
  App.navigate();
})();

</script>
