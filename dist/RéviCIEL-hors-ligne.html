e ?\nR: **for** : nombre de répétitions connu ; **while** : répète **tant qu'une condition** est vraie.\n\nQ: Différence entre = et == ?\nR: **=** affecte une valeur à une variable ; **==** compare deux valeurs.\n\nQ: Que fait return dans une fonction ?\nR: Il **renvoie le résultat** de la fonction (et la termine).\n\nQ: Indice du premier élément d'une liste ?\nR: **0**\n\nQ: Comment ajouter un élément à la fin d'une liste ?\nR: Avec **append()** : ports.append(8080)\n\nQ: Que vaut 17 % 5 ?\nR: **2** (le reste de la division euclidienne).\n\nQ: Que vaut 2 ** 10 ?\nR: **1024**\n\nQ: Comment convertir \"1010\" (binaire) en entier ?\nR: **int(\"1010\", 2)** → 10\n\n=== QUIZ ===\n? Que affiche `print(7 // 2)` ?\n- 3.5\n+ 3\n- 1\n! // est la division entière.\n\n? Combien de fois s'exécute `for i in range(2, 8):` ?\n- 8\n+ 6\n- 7\n! i prend les valeurs 2, 3, 4, 5, 6, 7 : 6 tours.\n\n? `age = input(\"Âge ? \")` puis `age + 1` provoque…\n+ une TypeError, car age est une chaîne\n- l'âge plus un\n- une IndentationError\n! input renvoie du texte : il faut écrire int(input(...)).\n\n? Que contient la liste après `l = [1, 2]` puis `l.append(5)` ?\n- [5, 1, 2]\n+ [1, 2, 5]\n- [1, 2]\n! append ajoute à la fin.\n\n? Quel mot-clé définit une fonction ?\n- function\n+ def\n- func\n! def nom_de_fonction(paramètres):\n\n? Que renvoie `hex(255)` ?\n+ '0xff'\n- '11111111'\n- '255'\n! hex() donne l'écriture hexadécimale ; bin(255) donnerait '0b11111111'.\n","---\nid: maint-diagnostic\nmatiere: maintenance\ntitre: La maintenance et la démarche de diagnostic\nchapitre: Maintenance\nresume: Maintenance corrective ou préventive, la méthode de diagnostic étape par étape, les précautions avant d'intervenir et les indicateurs MTBF/MTTR.\nmots-cles: maintenance, corrective, palliative, curative, préventive, systématique, conditionnelle, prévisionnelle, diagnostic, hypothèses, panne, intervention, sauvegarde, MTBF, MTTR, disponibilité\nordre: 1\n---\n\n## Les types de maintenance\n\n> [!definition] Maintenance\n> Ensemble des actions qui permettent de **maintenir** ou de **rétablir** un équipement dans un état où il remplit sa fonction.\n\n| Type | Quand ? | Exemples |\n|---|---|---|\n| ==Corrective palliative== | **après** la panne, dépannage **provisoire** | basculer sur un switch de secours, redémarrer un service |\n| ==Corrective curative== | **après** la panne, réparation **définitive** | remplacer l'alimentation défectueuse |\n| ==Préventive systématique== | **avant** la panne, selon un **échéancier** | dépoussiérer les serveurs tous les 6 mois, changer les batteries d'onduleur tous les 3 ans |\n| ==Préventive conditionnelle== | **avant** la panne, selon l'**état mesuré** | remplacer un disque quand ses indicateurs SMART se dégradent |\n| Préventive prévisionnelle | selon l'**analyse des tendances** | anticiper la saturation d'un disque d'après son remplissage |\n\nOn parle aussi de maintenance **améliorative** quand on modifie l'équipement pour le rendre plus fiable ou plus performant.\n\n## La démarche de diagnostic\n\n1. ==Recueillir les informations== : que se passe-t-il ? depuis quand ? qu'est-ce qui a changé ? quel message d'erreur ? Si possible, **reproduire** la panne.\n2. **Vérifier les évidences** : alimentation, câbles, voyants, interrupteurs (une grande partie des pannes est simple !).\n3. ==Émettre des hypothèses==, de la plus **probable** et la plus **simple à vérifier** à la moins probable.\n4. ==Tester== chaque hypothèse : mesure (multimètre), remplacement par un **élément sain**, lecture des journaux, ping, logiciel de diagnostic.\n5. **Identifier la cause** et **remédier** : réparer, remplacer, reconfigurer.\n6. ==Vérifier== le bon fonctionnement, **avec l'utilisateur**.\n7. ==Documenter== : compte rendu d'intervention, ticket, base de connaissances.\n\n> [!exemple] « Internet ne marche plus sur mon poste »\n> Questions : les autres postes fonctionnent-ils ? Depuis quand ? → Évidences : câble branché, voyant du port allumé ? → `ipconfig` : adresse 169.254.x.x → hypothèse : pas de DHCP → test : autre port du switch → ça marche → cause : port du switch défectueux → remédier, tester, documenter.\n\n## Avant d'intervenir\n\n- Avoir l'**autorisation** et prévenir les utilisateurs concernés (coupure de service).\n- ==Sauvegarder les données== avant toute manipulation risquée.\n- Appliquer les règles de **sécurité** : mise hors tension, consignation si nécessaire, **bracelet antistatique** pour les cartes électroniques.\n- Préparer les outils et les pièces : multimètre, testeur de câble, tournevis, clé USB de diagnostic, documentation constructeur.\n\n## Mesurer la fiabilité\n\n> [!formule]\n> **MTBF** = temps moyen de bon fonctionnement entre deux pannes\n> **MTTR** = temps moyen de réparation\n> **Disponibilité** = MTBF / (MTBF + MTTR)\n\nExemple : MTBF = 990 h et MTTR = 10 h → disponibilité = 990 / 1 000 = **99 %**. Pour améliorer la disponibilité, on rend le matériel plus fiable (MTBF ↑) et on répare plus vite (MTTR ↓ : pièces de rechange, procédures).\n\n> [!retenir]\n> Corrective = après la panne (palliative = provisoire, curative = définitive). Préventive = avant (systématique = calendrier, conditionnelle = état). Diagnostic : informations → évidences → hypothèses → tests → remède → vérification → documentation.\n\n=== EXERCICES ===\n# classer : Quel type de maintenance ?\nCorrective palliative : basculer sur un switch de secours en attendant la réparation, redémarrer un service planté\nCorrective curative : remplacer l'alimentation défectueuse\nPréventive systématique : dépoussiérer les serveurs tous les 6 mois, changer les batteries d'onduleur tous les 3 ans\nPréventive conditionnelle : remplacer un disque quand ses indicateurs SMART se dégradent\n\n# ordre : Remets la démarche de diagnostic dans l'ordre\n- Recueillir les informations\n- Vérifier les évidences\n- Émettre des hypothèses\n- Tester les hypothèses\n- Remédier\n- Vérifier avec l'utilisateur\n- Documenter\n\n# calcul : Disponibilité\n? MTBF = 990 h et MTTR = 10 h. Disponibilité (en %) ?\n= 99 %\n! 990 / (990 + 10) = 0,99.\n\n=== CARTES ===\nQ: Différence entre maintenance palliative et curative ?\nR: **Palliative** = dépannage **provisoire** ; **curative** = réparation **définitive**.\n\nQ: Qu'est-ce que la maintenance préventive systématique ?\nR: Une maintenance faite **selon un calendrier** (tous les 6 mois…), même sans signe de panne.\n\nQ: Qu'est-ce que la maintenance préventive conditionnelle ?\nR: Une maintenance déclenchée par l'**état mesuré** de l'équipement (seuil, alarme, indicateurs SMART).\n\nQ: Première étape d'un diagnostic ?\nR: **Recueillir les informations** (questionner l'utilisateur, reproduire la panne).\n\nQ: Dans quel ordre tester les hypothèses ?\nR: De la plus **probable** et **simple à vérifier** à la moins probable.\n\nQ: Que faire avant une intervention risquée sur un poste ?\nR: **Sauvegarder les données** (et prévenir l'utilisateur).\n\nQ: Que signifie MTBF ?\nR: **Temps moyen entre deux pannes** (Mean Time Between Failures).\n\nQ: Que signifie MTTR ?\nR: **Temps moyen de réparation** (Mean Time To Repair).\n\nQ: Dernière étape d'une intervention ?\nR: **Documenter** (compte rendu, ticket, base de connaissances).\n\n=== QUIZ ===\n? Le disque d'un serveur tombe en panne. On le remplace par un neuf. C'est une maintenance…\n- préventive systématique\n+ corrective curative\n- palliative\n! On répare définitivement après la panne.\n\n? Remplacer les batteries de l'onduleur tous les 3 ans, c'est une maintenance…\n+ préventive systématique\n- préventive conditionnelle\n- corrective\n! Elle suit un échéancier fixe.\n\n? Un utilisateur dit : « mon PC ne s'allume plus ». Que vérifier en premier ?\n- La version du BIOS\n+ L'alimentation électrique (prise, câble, interrupteur)\n- Les pilotes de la carte graphique\n! On commence toujours par les évidences.\n\n? MTBF = 495 h, MTTR = 5 h. Disponibilité ?\n- 95 %\n+ 99 %\n- 99,9 %\n! 495 / 500 = 0,99 = 99 %.\n\n? Pourquoi documenter une intervention ?\n+ Pour garder une trace et résoudre plus vite les pannes similaires\n- Parce que c'est plus long\n- Pour remplacer la sauvegarde\n! Le compte rendu alimente l'historique et la base de connaissances.\n","---\nid: maint-relation-client\nmatiere: maintenance\ntitre: Ticket, niveaux de support et relation client\nchapitre: Relation client\nresume: Gérer une demande avec un ticket (GLPI), incident ou demande de service, niveaux N1/N2/N3, priorité, et les bonnes pratiques face au client.\nmots-cles: ticket, GLPI, helpdesk, ITIL, incident, demande de service, problème, niveau de support, N1, N2, N3, escalade, priorité, impact, urgence, SLA, relation client, reformulation, compte rendu d'intervention\nordre: 2\n---\n\n## Le ticket\n\nChaque demande d'un utilisateur est enregistrée dans un ==ticket==, souvent avec un outil comme ==GLPI== (logiciel libre). Un ticket contient :\n\n- le **demandeur**, la **date**, le matériel concerné ;\n- la **description** du problème et sa **catégorie** ;\n- la **priorité** ;\n- le **statut** : nouveau → en cours → en attente → résolu → clos ;\n- les **actions réalisées**, le **temps passé** et la **solution**.\n\n## Incident, demande, problème (vocabulaire ITIL)\n\n| Terme | Définition | Exemple |\n|---|---|---|\n| ==Incident== | interruption ou dégradation **non prévue** d'un service | « l'imprimante n'imprime plus » |\n| ==Demande de service== | demande **standard**, prévue au catalogue | « créer un compte pour le nouveau stagiaire » |\n| ==Problème== | **cause inconnue** d'un ou plusieurs incidents, à rechercher | « le Wi-Fi coupe tous les jours vers 10 h » |\n\n## Les niveaux de support\n\n| Niveau | Qui ? | Rôle |\n|---|---|---|\n| ==N1== | helpdesk, hotline | accueille, enregistre, qualifie, résout les cas simples (mot de passe, procédure) |\n| ==N2== | technicien de proximité ou spécialiste | interventions plus techniques, sur place ou à distance |\n| ==N3== | expert, éditeur, constructeur | cas complexes, correctifs, remplacement sous garantie |\n\nQuand un niveau ne peut pas résoudre, il fait une ==escalade== vers le niveau supérieur.\n\n## La priorité\n\n> [!formule]\n> Priorité = **impact** (combien d'utilisateurs ou de services touchés) × **urgence** (délai acceptable)\n\nUn serveur de messagerie en panne pour toute l'entreprise passe avant la souris d'un seul poste. Les délais à respecter peuvent être fixés dans un ==SLA== (contrat de niveau de service) : délai de prise en charge, délai de résolution.\n\n## La relation client\n\n> [!retenir] Les bons réflexes\n> - **Accueillir** : se présenter, être poli et souriant, même au téléphone.\n> - **Écouter** sans couper, puis **questionner** : d'abord des questions **ouvertes** (« que se passe-t-il ? »), puis **fermées** (« le voyant est-il vert ? »).\n> - ==Reformuler== pour vérifier qu'on a compris : « Si je comprends bien, depuis ce matin… ».\n> - **Expliquer simplement**, sans jargon, ce qu'on va faire et combien de temps cela prendra.\n> - **Rester calme** face à un client mécontent : ne pas le prendre personnellement, montrer qu'on cherche une solution.\n> - Ne **jamais promettre** ce qu'on ne peut pas tenir.\n> - Respecter la **confidentialité** des données et des lieux.\n\n## Le compte rendu d'intervention\n\nIl précise : date et heure, client et lieu, matériel, **symptômes**, **diagnostic**, **actions réalisées**, pièces remplacées, **temps passé**, **résultat** (résolu ou non), recommandations, et la **signature du client** (validation : c'est la ==recette==).\n\n> [!astuce] Le mail professionnel\n> Objet précis (« Intervention du 12/03 – imprimante accueil »), formule d'appel, phrases courtes, une idée par paragraphe, formule de politesse, signature avec ses coordonnées. Relire avant d'envoyer !\n\n=== EXERCICES ===\n# classer : Incident, demande de service ou problème ?\nIncident : l'imprimante n'imprime plus, le serveur de fichiers est inaccessible\nDemande de service : créer un compte pour un stagiaire, installer un logiciel\nProblème : le Wi-Fi coupe tous les jours vers 10 h sans qu'on sache pourquoi\n\n# ordre : Remets les statuts d'un ticket dans l'ordre\n- Nouveau\n- En cours\n- En attente\n- Résolu\n- Clos\n\n# paires : Associe chaque niveau de support à son rôle\n- N1 = Helpdesk : accueille, qualifie et règle les cas simples\n- N2 = Technicien de proximité ou spécialiste\n- N3 = Expert, éditeur ou constructeur\n\n=== CARTES ===\nQ: À quoi sert un ticket ?\nR: À **enregistrer et suivre** une demande, de sa création à sa clôture.\n\nQ: Un outil libre de gestion de tickets et de parc ?\nR: **GLPI**.\n\nQ: Différence entre un incident et une demande de service ?\nR: L'**incident** est une panne ou dégradation **non prévue** ; la **demande de service** est une demande **standard** (nouveau compte, logiciel…).\n\nQ: Qu'est-ce qu'un problème au sens ITIL ?\nR: La **cause inconnue** d'un ou plusieurs incidents.\n\nQ: Rôle du support N1 ?\nR: **Accueillir**, enregistrer, qualifier et résoudre les demandes simples.\n\nQ: Qu'est-ce qu'une escalade ?\nR: Transmettre le ticket au **niveau de support supérieur**.\n\nQ: Comment détermine-t-on la priorité d'un ticket ?\nR: Selon l'**impact** et l'**urgence**.\n\nQ: Qu'est-ce qu'un SLA ?\nR: Un **contrat de niveau de service** qui fixe les délais de prise en charge et de résolution.\n\nQ: Pourquoi reformuler la demande du client ?\nR: Pour **vérifier qu'on a bien compris** et montrer qu'on l'écoute.\n\n=== QUIZ ===\n? « Installer le logiciel de CAO sur le poste d'un nouvel employé » est…\n- un incident\n+ une demande de service\n- un problème\n! C'est une demande standard, pas une panne.\n\n? Quel ticket traiter en premier ?\n+ Le serveur de fichiers inaccessible pour tout le service comptable\n- Une souris qui accroche sur un poste\n- Une demande de nouveau fond d'écran\n! Impact élevé (tout un service) et urgence forte.\n\n? Le client est énervé au téléphone. Quelle attitude adopter ?\n- Lui répondre sur le même ton\n+ Rester calme, écouter, reformuler et proposer une solution\n- Raccrocher\n! Le calme et l'écoute font baisser la tension.\n\n? Après avoir résolu une panne chez un client, on…\n- part sans rien dire\n+ vérifie avec lui le bon fonctionnement et fait signer le compte rendu\n- ferme le ticket sans commentaire\n! La validation par le client (recette) et la documentation terminent l'intervention.\n\n? « Que se passe-t-il exactement ? » est une question…\n+ ouverte\n- fermée\n- fermée à choix multiple\n! Une question ouverte laisse le client décrire librement.\n","---\nid: maths-automatismes\nmatiere: maths\ntitre: Automatismes : pourcentages, proportions, puissances\nchapitre: Automatismes\nresume: Les calculs qui reviennent partout : proportionnalité, pourcentages et évolutions, puissances de 10, préfixes et conversions.\nmots-cles: proportionnalité, produit en croix, pourcentage, coefficient multiplicateur, taux d'évolution, puissances de 10, notation scientifique, préfixes, conversions, priorités\nordre: 1\n---\n\n## Proportionnalité\n\nDeux grandeurs sont ==proportionnelles== si on passe de l'une à l'autre en multipliant toujours par le même nombre (le coefficient de proportionnalité). Graphiquement : des points alignés sur une **droite passant par l'origine**.\n\n> [!formule] Produit en croix\n> Si a/b = c/d alors d = (b × c) / a\n\n> [!exemple]\n> 3 câbles RJ45 coûtent 7,50 €. Prix de 8 câbles : 8 × 7,50 / 3 = **20 €**.\n\n## Pourcentages et évolutions\n\n| Je veux… | Je calcule |\n|---|---|\n| Prendre t % d'une valeur V | V × t / 100 |\n| Augmenter V de t % | V × (1 + t/100) |\n| Diminuer V de t % | V × (1 − t/100) |\n| Taux d'évolution de V~D~ à V~A~ | (V~A~ − V~D~) / V~D~ × 100 |\n\n- Le nombre (1 + t/100) ou (1 − t/100) est le ==coefficient multiplicateur== (CM). Hausse de 20 % → CM = 1,2 ; baisse de 15 % → CM = 0,85.\n- Évolutions successives : on ==multiplie les coefficients==. Une hausse de 10 % puis une baisse de 10 % : 1,1 × 0,9 = 0,99 → **baisse de 1 %** (et non 0 %) !\n\n> [!exemple]\n> Un switch passe de 80 € à 92 €. Taux d'évolution : (92 − 80) / 80 × 100 = **+15 %**.\n\n## Puissances de 10 et notation scientifique\n\n- 10^3^ = 1 000 ; 10^6^ = 1 000 000 ; 10^-3^ = 0,001 ; 10^0^ = 1.\n- 10^a^ × 10^b^ = 10^a+b^ ; 10^a^ / 10^b^ = 10^a−b^.\n- ==Notation scientifique== : a × 10^n^ avec **1 ≤ a < 10**. Exemple : 0,00056 = 5,6 × 10^-4^ ; 230 000 = 2,3 × 10^5^.\n\n## Préfixes et conversions\n\n| Préfixe | Symbole | Valeur |\n|---|---|---|\n| giga | G | 10^9^ |\n| méga | M | 10^6^ |\n| kilo | k | 10^3^ |\n| milli | m | 10^-3^ |\n| micro | µ | 10^-6^ |\n| nano | n | 10^-9^ |\n| pico | p | 10^-12^ |\n\n- 1 h = 60 min = 3 600 s.\n- ==km/h → m/s : diviser par 3,6== (et m/s → km/h : multiplier par 3,6).\n- 25 mA = 0,025 A ; 4,7 kΩ = 4 700 Ω ; 100 nF = 0,1 µF.\n\n## Priorités opératoires\n\n1. Parenthèses  2. Puissances  3. Multiplications et divisions  4. Additions et soustractions (de gauche à droite).\n\n> [!retenir]\n> Augmenter de t % = multiplier par **1 + t/100**. Diminuer de t % = multiplier par **1 − t/100**. Les évolutions successives se **multiplient**, elles ne s'additionnent pas.\n\nEntraîne-toi avec l'[exercice Pourcentages](#/entrainement/pourcentages).\n\n=== EXERCICES ===\n# calcul : Pourcentages et conversions\n? Un prix de 80 € augmente de 15 %. Nouveau prix (en €) ?\n= 92 €\n! 80 × 1,15 = 92 €.\n? Coefficient multiplicateur d'une baisse de 30 % ?\n= 0,7\n! 1 − 30/100 = 0,7.\n? Un abonnement passe de 25 € à 30 €. Taux d'évolution (en %) ?\n= 20 %\n! (30 − 25) / 25 × 100 = 20 %.\n? 90 km/h en m/s ?\n= 25 m/s\n! 90 / 3,6 = 25 m/s.\n? 4,7 kΩ en ohms ?\n= 4700 Ω\n! kilo = × 1 000.\n\n# paires : Associe chaque préfixe à sa valeur\n- kilo (k) = × 1 000\n- méga (M) = × 1 000 000\n- giga (G) = × 1 000 000 000\n- milli (m) = ÷ 1 000\n- micro (µ) = ÷ 1 000 000\n\n=== CARTES ===\nQ: Coefficient multiplicateur d'une hausse de 20 % ?\nR: **1,2** (= 1 + 20/100).\n\nQ: Coefficient multiplicateur d'une baisse de 30 % ?\nR: **0,7** (= 1 − 30/100).\n\nQ: Formule du taux d'évolution ?\nR: (V~A~ − V~D~) / V~D~ × 100 (valeur d'arrivée moins valeur de départ, divisé par la valeur de départ).\n\nQ: +10 % puis −10 % : quelle évolution globale ?\nR: 1,1 × 0,9 = 0,99 → une **baisse de 1 %**.\n\nQ: Comment convertir des km/h en m/s ?\nR: On **divise par 3,6** (ex. 90 km/h = 25 m/s).\n\nQ: Que vaut le préfixe micro (µ) ?\nR: 10^-6^ (un millionième).\n\nQ: Que vaut le préfixe méga (M) ?\nR: 10^6^ (un million).\n\nQ: 0,00056 en notation scientifique ?\nR: 5,6 × 10^-4^\n\nQ: À quoi reconnaît-on graphiquement une situation de proportionnalité ?\nR: Les points sont alignés sur une **droite qui passe par l'origine**.\n\n=== QUIZ ===\n? Un prix de 50 € augmente de 12 %. Nouveau prix ?\n- 50,12 €\n- 62 €\n+ 56 €\n- 60 €\n! 50 × 1,12 = 56 €.\n\n? Une baisse de 25 % correspond à un coefficient multiplicateur de…\n- 0,25\n+ 0,75\n- 1,25\n! 1 − 25/100 = 0,75.\n\n? 72 km/h correspondent à…\n- 259,2 m/s\n+ 20 m/s\n- 7,2 m/s\n! 72 / 3,6 = 20 m/s.\n\n? 4,7 kΩ = …\n- 47 Ω\n- 470 Ω\n+ 4 700 Ω\n! kilo = × 1 000.\n\n? Quel est le résultat de 2 + 3 × 4 ?\n- 20\n+ 14\n- 24\n! La multiplication est prioritaire : 3 × 4 = 12, puis 2 + 12 = 14.\n\n? Un forfait passe de 20 € à 15 €. Taux d'évolution ?\n+ −25 %\n- −5 %\n- −33 %\n! (15 − 20) / 20 × 100 = −25 %.\n","---\nid: maths-stats-2var\nmatiere: maths\ntitre: Statistiques à deux variables\nchapitre: Statistiques et probabilités\nresume: Nuage de points, point moyen, ajustement affine et prévisions (interpolation, extrapolation).\nmots-cles: série statistique, deux variables, nuage de points, point moyen, ajustement affine, droite d'ajustement, moindres carrés, interpolation, extrapolation, tableur\nordre: 2\n---\n\n## Série statistique à deux variables\n\nOn étudie **deux caractères** sur une même population, par exemple l'année et le nombre d'abonnés à la fibre. Chaque individu donne un couple (x~i~ ; y~i~).\n\nOn représente la série par un ==nuage de points== dans un repère : le point M~i~ a pour coordonnées (x~i~ ; y~i~).\n\n## Le point moyen\n\n> [!formule] Point moyen G\n> G (x̄ ; ȳ) où x̄ est la moyenne des x~i~ et ȳ la moyenne des y~i~\n\n## L'ajustement affine\n\nQuand les points du nuage sont ==à peu près alignés==, on peut les remplacer par une ==droite d'ajustement== d'équation **y = ax + b**.\n\n- La droite donnée par la calculatrice ou le tableur est la ==droite des moindres carrés== (régression linéaire) : c'est celle qui passe « au plus près » de tous les points. Elle passe par le **point moyen G**.\n- Au tableur : insérer un graphique en nuage de points, puis « ajouter une courbe de tendance linéaire » et « afficher l'équation ».\n- Si le nuage n'a pas une forme allongée (points dispersés, courbe), un ajustement affine n'est **pas pertinent**.\n\n## Faire une prévision\n\n- ==Interpolation== : estimer une valeur **à l'intérieur** de la plage des données (assez fiable).\n- ==Extrapolation== : prévoir une valeur **en dehors** de la plage (par exemple dans le futur) : on suppose que la tendance continue → **prudence**.\n\n> [!exemple] Exemple complet\n> | Rang de l'année x~i~ | 1 | 2 | 3 | 4 | 5 |\n> |---|---|---|---|---|---|\n> | Ventes y~i~ (milliers) | 12 | 15 | 19 | 21 | 23 |\n>\n> - Point moyen : x̄ = 15 / 5 = 3 ; ȳ = 90 / 5 = 18 → **G (3 ; 18)**.\n> - La calculatrice donne la droite **y = 2,8x + 9,6** (on vérifie : 2,8 × 3 + 9,6 = 18, elle passe bien par G).\n> - Prévision pour l'année 7 : y = 2,8 × 7 + 9,6 = **29,2 milliers** (extrapolation).\n\n## Méthode à la calculatrice\n\n1. Entrer les x~i~ dans la liste 1 et les y~i~ dans la liste 2.\n2. Choisir le calcul statistique à 2 variables : lire x̄, ȳ.\n3. Choisir la régression linéaire (« ax + b ») : lire a et b, arrondir comme demandé.\n\n> [!retenir]\n> Nuage de points → point moyen G (x̄ ; ȳ) → droite d'ajustement y = ax + b (qui passe par G) → prévisions par interpolation ou extrapolation.\n\n=== EXERCICES ===\n# calcul : Point moyen et prévision\n? Les x valent 1, 2, 3, 4, 5. Calcule x̄.\n= 3\n? Les y valent 10, 14, 15, 19, 22. Calcule ȳ.\n= 16\n! (10 + 14 + 15 + 19 + 22) / 5 = 80 / 5 = 16.\n? La droite d'ajustement est y = 2,9x + 7,3. Estime y pour x = 8.\n= 30,5\n! 2,9 × 8 + 7,3 = 23,2 + 7,3 = 30,5.\n\n# paires : Associe chaque mot à sa définition\n- Nuage de points = Les couples (x ; y) placés dans un repère\n- Point moyen = Le point de coordonnées (x̄ ; ȳ)\n- Interpolation = Estimation à l'intérieur de la plage des données\n- Extrapolation = Prévision en dehors de la plage des données\n\n=== CARTES ===\nQ: Qu'est-ce qu'un nuage de points ?\nR: La représentation d'une série à deux variables : chaque couple (x~i~ ; y~i~) donne un point dans un repère.\n\nQ: Coordonnées du point moyen G ?\nR: G (x̄ ; ȳ) : la **moyenne des x** et la **moyenne des y**.\n\nQ: Quand un ajustement affine est-il pertinent ?\nR: Quand les points du nuage sont **à peu près alignés** (forme allongée).\n\nQ: Par quel point passe la droite des moindres carrés ?\nR: Par le **point moyen G**.\n\nQ: Différence entre interpolation et extrapolation ?\nR: **Interpolation** = estimation à l'intérieur de la plage des données ; **extrapolation** = prévision en dehors (moins fiable).\n\nQ: Comment obtenir l'équation de la droite au tableur ?\nR: Graphique en nuage de points → **courbe de tendance linéaire** → afficher l'équation.\n\n=== QUIZ ===\n? Les x~i~ valent 2, 4, 6 et les y~i~ valent 10, 20, 30. Point moyen ?\n- G (12 ; 60)\n+ G (4 ; 20)\n- G (6 ; 30)\n! x̄ = 12/3 = 4 et ȳ = 60/3 = 20.\n\n? Une droite d'ajustement a pour équation y = 3x + 5. Valeur estimée pour x = 10 ?\n- 30\n+ 35\n- 53\n! y = 3 × 10 + 5 = 35.\n\n? Prévoir les ventes dans 3 ans à partir des 5 dernières années, c'est…\n- une interpolation\n+ une extrapolation\n- un calcul de moyenne\n! On sort de la plage des données connues : c'est une extrapolation.\n\n? La droite des moindres carrés passe toujours par…\n- l'origine du repère\n+ le point moyen G\n- le premier point du nuage\n! C'est une propriété de la droite de régression : elle passe par G (x̄ ; ȳ).\n\n? Les points d'un nuage forment une courbe en U. Que dire d'un ajustement affine ?\n- Il est parfait\n+ Il n'est pas adapté\n- Il passe forcément par l'origine\n! Un ajustement affine suppose des points à peu près alignés.\n","---\nid: maths-probabilites\nmatiere: maths\ntitre: Probabilités\nchapitre: Statistiques et probabilités\nresume: Expérience aléatoire, événements, calcul de probabilités, événement contraire, « et » / « ou », fréquences.\nmots-cles: probabilité, expérience aléatoire, issue, univers, événement, équiprobabilité, événement contraire, intersection, réunion, fréquence, loi des grands nombres, arbre\nordre: 3\n---\n\n## Le vocabulaire\n\n- ==Expérience aléatoire== : expérience dont on connaît les résultats possibles, mais pas celui qui va sortir (lancer un dé).\n- ==Issue== : un résultat possible (obtenir 4). L'ensemble des issues s'appelle l'==univers== Ω.\n- ==Événement== : un ensemble d'issues (« obtenir un nombre pair » = {2 ; 4 ; 6}).\n\n## Calculer une probabilité\n\n- Une probabilité est toujours comprise entre **0** (événement impossible) et **1** (événement certain).\n- La somme des probabilités de toutes les issues vaut **1**.\n\n> [!formule] Situation d'équiprobabilité (toutes les issues ont la même chance)\n> P(A) = nombre d'issues favorables à A / nombre d'issues possibles\n\n> [!exemple]\n> Dé équilibré à 6 faces. A = « obtenir un nombre pair » : P(A) = 3/6 = **1/2**. B = « obtenir plus de 4 » = {5 ; 6} : P(B) = 2/6 = **1/3**.\n\n## Événement contraire\n\nL'événement contraire de A, noté ==Ā==, se réalise quand A ne se réalise pas.\n\n> [!formule]\n> P(Ā) = 1 − P(A)\n\n## « A et B », « A ou B »\n\n- ==A ∩ B== (« A et B ») : les issues communes à A et B.\n- ==A ∪ B== (« A ou B ») : les issues de A, de B, ou des deux.\n- Si A et B n'ont aucune issue commune, ils sont ==incompatibles== : P(A ∩ B) = 0.\n\n> [!formule]\n> P(A ∪ B) = P(A) + P(B) − P(A ∩ B)\n\n> [!exemple] Suite de l'exemple du dé\n> A ∩ B = {6} donc P(A ∩ B) = 1/6. P(A ∪ B) = 1/2 + 1/3 − 1/6 = 4/6 = **2/3** (on vérifie : A ∪ B = {2 ; 4 ; 5 ; 6}).\n\n## Fréquence et probabilité\n\nSi on répète une expérience un **grand nombre de fois**, la ==fréquence== d'apparition d'un événement se rapproche de sa probabilité : c'est la ==loi des grands nombres==. C'est ce qu'on observe en simulant l'expérience avec un tableur ou un programme Python.\n\n## Outils : tableau et arbre\n\n- Un ==tableau à double entrée== aide à compter les issues quand il y a deux critères (ex. élèves selon la classe et l'option).\n- Un ==arbre== représente les expériences en plusieurs étapes : on multiplie les probabilités le long d'une branche.\n\n> [!retenir]\n> 0 ≤ P(A) ≤ 1 · P(Ā) = 1 − P(A) · P(A ∪ B) = P(A) + P(B) − P(A ∩ B) · fréquence → probabilité quand le nombre d'essais augmente.\n\n=== EXERCICES ===\n# calcul : Calcule les probabilités (réponds avec un nombre décimal)\n? Dé équilibré à 6 faces : probabilité d'obtenir un nombre pair ?\n= 0,5\n! 3 issues favorables sur 6.\n? Si P(A) = 0,35, que vaut P(Ā) ?\n= 0,65\n! P(Ā) = 1 − 0,35.\n? P(A) = 0,5 ; P(B) = 0,4 ; P(A ∩ B) = 0,2. Que vaut P(A ∪ B) ?\n= 0,7\n! 0,5 + 0,4 − 0,2 = 0,7.\n? On tire une carte dans un jeu de 32. Probabilité de tirer un cœur ?\n= 0,25\n! 8 cœurs sur 32 cartes.\n\n# paires : Associe chaque notation ou mot à son sens\n- A ∩ B = A et B\n- A ∪ B = A ou B\n- Ā = Le contraire de A\n- Probabilité égale à 1 = Événement certain\n- Probabilité égale à 0 = Événement impossible\n\n=== CARTES ===\nQ: Entre quelles valeurs est comprise une probabilité ?\nR: Entre **0** (impossible) et **1** (certain).\n\nQ: Formule en situation d'équiprobabilité ?\nR: P(A) = nombre d'issues **favorables** / nombre d'issues **possibles**.\n\nQ: Probabilité de l'événement contraire Ā ?\nR: P(Ā) = **1 − P(A)**.\n\nQ: Que signifie A ∩ B ?\nR: « A **et** B » : les issues qui réalisent les deux événements à la fois.\n\nQ: Formule de P(A ∪ B) ?\nR: P(A ∪ B) = P(A) + P(B) − P(A ∩ B).\n\nQ: Que sont deux événements incompatibles ?\nR: Deux événements **sans issue commune** : P(A ∩ B) = 0.\n\nQ: Que dit la loi des grands nombres ?\nR: Quand on répète l'expérience un grand nombre de fois, la **fréquence** se rapproche de la **probabilité**.\n\n=== QUIZ ===\n? On tire une carte au hasard dans un jeu de 32 cartes. Probabilité de tirer un as ?\n- 1/32\n+ 1/8\n- 1/4\n! Il y a 4 as sur 32 cartes : 4/32 = 1/8.\n\n? Si P(A) = 0,35, alors P(Ā) = …\n- 0,35\n+ 0,65\n- 1,35\n! P(Ā) = 1 − 0,35 = 0,65.\n\n? Dé à 6 faces : probabilité d'obtenir un nombre strictement supérieur à 4 ?\n- 1/2\n+ 1/3\n- 2/3\n! Issues favorables : 5 et 6, soit 2/6 = 1/3.\n\n? P(A) = 0,5 ; P(B) = 0,4 ; P(A ∩ B) = 0,2. P(A ∪ B) = ?\n- 0,9\n+ 0,7\n- 0,2\n! 0,5 + 0,4 − 0,2 = 0,7.\n\n? On lance 10 000 fois une pièce équilibrée. La fréquence de « pile » sera…\n- exactement 0,5\n+ proche de 0,5\n- proche de 1\n! Loi des grands nombres : la fréquence se rapproche de la probabilité 0,5, sans être forcément exactement égale.\n","---\nid: maths-suites\nmatiere: maths\ntitre: Suites arithmétiques et géométriques\nchapitre: Algèbre — Analyse\nresume: Reconnaître une suite arithmétique ou géométrique, calculer un terme, l'appliquer aux évolutions et aux intérêts.\nmots-cles: suite, terme, rang, arithmétique, raison, géométrique, intérêts simples, intérêts composés, évolution, Python\nordre: 4\n---\n\n## Qu'est-ce qu'une suite ?\n\nUne ==suite== est une liste ordonnée de nombres : u~0~, u~1~, u~2~… Le nombre u~n~ est le ==terme de rang n==.\n\n## Suite arithmétique : on ajoute toujours le même nombre\n\n> [!formule]\n> u~n+1~ = u~n~ + r   (r = la raison)\n> u~n~ = u~0~ + n × r   ou   u~n~ = u~1~ + (n − 1) × r\n\n- Si **r > 0** la suite est croissante, si **r < 0** elle est décroissante.\n- Les points (n ; u~n~) sont ==alignés== sur une droite.\n- Situations : une quantité qui augmente d'un **même nombre** à chaque étape (abonnement +2 € par mois, ==intérêts simples==).\n\n> [!exemple]\n> Un technicien a 1 500 € sur un compte et ajoute 120 € chaque mois : u~n~ = 1 500 + 120n. Après 10 mois : u~10~ = 1 500 + 1 200 = **2 700 €**.\n\n## Suite géométrique : on multiplie toujours par le même nombre\n\n> [!formule]\n> u~n+1~ = u~n~ × q   (q = la raison)\n> u~n~ = u~0~ × q^n^   ou   u~n~ = u~1~ × q^n−1^\n\n- Avec u~0~ > 0 : si **q > 1** la suite est croissante ; si **0 < q < 1** elle est décroissante.\n- Situations : une quantité qui évolue d'un **même pourcentage** à chaque étape. Une hausse de t % donne **q = 1 + t/100**, une baisse de t % donne **q = 1 − t/100**. C'est le cas des ==intérêts composés==.\n\n> [!exemple]\n> 1 000 € placés à 3 % par an : u~n~ = 1 000 × 1,03^n^. Après 5 ans : 1 000 × 1,03^5^ ≈ **1 159,27 €**.\n\n## Reconnaître le type de suite\n\n| Test | Conclusion |\n|---|---|\n| u~n+1~ − u~n~ est toujours le même nombre | arithmétique de raison r = cette différence |\n| u~n+1~ / u~n~ est toujours le même nombre | géométrique de raison q = ce quotient |\n\nExemple : 3 ; 6 ; 12 ; 24 → les quotients valent 2 → géométrique de raison 2. Et 3 ; 6 ; 9 ; 12 → les différences valent 3 → arithmétique de raison 3.\n\n## Calculer les termes avec Python\n\n```python\nu = 1000          # u0\nfor n in range(5):\n    u = u * 1.03  # suite géométrique de raison 1,03\nprint(round(u, 2))  # 1159.27\n```\n\n> [!retenir]\n> Arithmétique : **+ r** à chaque étape, u~n~ = u~0~ + nr. Géométrique : **× q** à chaque étape, u~n~ = u~0~ × q^n^. Une évolution de t % par étape donne une suite géométrique de raison 1 ± t/100.\n\n=== EXERCICES ===\n# calcul : Suites arithmétiques et géométriques\n? Suite arithmétique : u~0~ = 4 et r = 3. Calcule u~5~.\n= 19\n! u~5~ = 4 + 5 × 3 = 19.\n? Suite géométrique : u~0~ = 2 et q = 3. Calcule u~4~.\n= 162\n! 2 × 3^4^ = 2 × 81 = 162.\n? 1 000 € placés à 2 % par an (intérêts composés). Capital après 3 ans (en €) ?\n= 1061,21 € ± 0,02\n! 1 000 × 1,02^3^ ≈ 1 061,21 €.\n? Raison de la suite géométrique pour une baisse de 5 % par an ?\n= 0,95\n\n# classer : Arithmétique ou géométrique ?\nArithmétique : 5 / 8 / 11 / 14, 100 / 90 / 80 / 70, un salaire qui augmente de 50 € par an\nGéométrique : 3 / 6 / 12 / 24, 1000 / 500 / 250 / 125, un prix qui augmente de 2 % par an\n\n=== CARTES ===\nQ: Relation de récurrence d'une suite arithmétique ?\nR: u~n+1~ = u~n~ + r (on ajoute toujours la raison r).\n\nQ: Terme général d'une suite arithmétique ?\nR: u~n~ = u~0~ + n × r\n\nQ: Relation de récurrence d'une suite géométrique ?\nR: u~n+1~ = u~n~ × q (on multiplie toujours par la raison q).\n\nQ: Terme général d'une suite géométrique ?\nR: u~n~ = u~0~ × q^n^\n\nQ: Une hausse de 5 % par an donne une suite géométrique de raison… ?\nR: q = **1,05**\n\nQ: Intérêts simples ou composés : lequel donne une suite géométrique ?\nR: Les intérêts **composés** (les intérêts simples donnent une suite arithmétique).\n\nQ: Comment reconnaît-on une suite arithmétique ?\nR: La **différence** entre deux termes consécutifs est constante.\n\nQ: Allure graphique d'une suite arithmétique ?\nR: Des points **alignés** sur une droite.\n\n=== QUIZ ===\n? Suite arithmétique avec u~0~ = 5 et r = 3. Que vaut u~4~ ?\n- 15\n+ 17\n- 20\n! u~4~ = 5 + 4 × 3 = 17.\n\n? La suite 2 ; 6 ; 18 ; 54 est…\n- arithmétique de raison 4\n+ géométrique de raison 3\n- ni l'une ni l'autre\n! Chaque terme est multiplié par 3.\n\n? Suite géométrique avec u~0~ = 100 et q = 0,5. Que vaut u~3~ ?\n- 50\n- 150\n+ 12,5\n! 100 × 0,5^3^ = 100 × 0,125 = 12,5.\n\n? Une population de bactéries double chaque heure. Quel modèle ?\n- Suite arithmétique de raison 2\n+ Suite géométrique de raison 2\n- Suite arithmétique de raison 100\n! « Doubler » = multiplier par 2 à chaque étape.\n\n? Un loyer de 600 € baisse de 2 % par an. Raison de la suite géométrique ?\n- 0,2\n- 1,02\n+ 0,98\n! Baisse de 2 % : q = 1 − 0,02 = 0,98.\n","---\nid: maths-second-degre\nmatiere: maths\ntitre: Fonctions polynômes du second degré\nchapitre: Algèbre — Analyse\nresume: La parabole, son sommet, le discriminant Δ et la résolution de ax² + bx + c = 0.\nmots-cles: second degré, polynôme, parabole, sommet, axe de symétrie, discriminant, delta, racines, équation, factorisation\nordre: 5\n---\n\n## La fonction f(x) = ax² + bx + c\n\nUne fonction polynôme du second degré s'écrit **f(x) = ax² + bx + c** avec **a ≠ 0**. Sa courbe est une ==parabole==.\n\n| Signe de a | Allure | Le sommet est… |\n|---|---|---|\n| a > 0 | parabole tournée vers le haut (∪) | un ==minimum== |\n| a < 0 | parabole tournée vers le bas (∩) | un ==maximum== |\n\n> [!formule] Sommet S de la parabole\n> x~S~ = −b / (2a)   et   y~S~ = f(x~S~)\n> La droite d'équation x = x~S~ est l'==axe de symétrie==.\n\n## Résoudre ax² + bx + c = 0\n\nOn calcule le ==discriminant== :\n\n> [!formule]\n> Δ = b² − 4ac\n\n| Valeur de Δ | Solutions | Factorisation |\n|---|---|---|\n| Δ > 0 | **deux** solutions : x~1~ = (−b − √Δ) / (2a) et x~2~ = (−b + √Δ) / (2a) | a(x − x~1~)(x − x~2~) |\n| Δ = 0 | **une** solution : x~0~ = −b / (2a) | a(x − x~0~)² |\n| Δ < 0 | **aucune** solution réelle | impossible |\n\nGraphiquement, les solutions de f(x) = 0 sont les ==abscisses des points où la parabole coupe l'axe des abscisses==.\n\n> [!exemple] f(x) = x² − 2x − 3\n> - a = 1, b = −2, c = −3.\n> - Δ = (−2)² − 4 × 1 × (−3) = 4 + 12 = **16** > 0 → deux solutions.\n> - x~1~ = (2 − 4) / 2 = **−1** et x~2~ = (2 + 4) / 2 = **3**.\n> - Sommet : x~S~ = 2 / 2 = 1 ; f(1) = 1 − 2 − 3 = −4 → **S (1 ; −4)**, c'est un minimum car a > 0.\n> - Factorisation : f(x) = (x + 1)(x − 3).\n\n## Applications\n\n- Trouver un ==maximum== : bénéfice maximal d'une entreprise, hauteur maximale d'un objet lancé.\n- Trouver un ==minimum== : coût minimal, distance minimale.\n- Résoudre un problème d'aire (un côté inconnu x donne souvent une équation du second degré).\n\n> [!attention] Pièges classiques\n> - Avec b négatif : −b devient positif (b = −2 → −b = 2).\n> - (−2)² = 4, mais −2² = −4 : mets des parenthèses à la calculatrice !\n> - Vérifie toujours tes solutions en les remplaçant dans f(x).\n\n> [!retenir]\n> Δ = b² − 4ac → Δ > 0 : 2 solutions ; Δ = 0 : 1 solution ; Δ < 0 : aucune. Sommet en x = −b/(2a).\n\n=== EXERCICES ===\n# calcul : Discriminant et solutions\n? f(x) = x² − 5x + 6. Calcule Δ.\n= 1\n! Δ = (−5)² − 4 × 1 × 6 = 25 − 24 = 1.\n? Plus petite solution de x² − 5x + 6 = 0 ?\n= 2\n? Plus grande solution ?\n= 3\n! x = (5 ± 1) / 2 : 2 et 3.\n? Abscisse du sommet de f(x) = 2x² − 8x + 1 ?\n= 2\n! x~S~ = −b/(2a) = 8/4 = 2.\n? Δ de x² + 2x + 5 ?\n= -16\n! 4 − 20 = −16 : aucune solution réelle.\n\n# classer : Combien de solutions à ax² + bx + c = 0 ?\nDeux solutions : Δ = 16, Δ = 1\nUne seule solution : Δ = 0\nAucune solution réelle : Δ = −4, Δ = −25\n\n=== CARTES ===\nQ: Forme d'une fonction polynôme du second degré ?\nR: f(x) = ax² + bx + c avec **a ≠ 0**.\n\nQ: Quelle est la courbe d'une fonction du second degré ?\nR: Une **parabole**.\n\nQ: Si a > 0, le sommet est un maximum ou un minimum ?\nR: Un **minimum** (parabole tournée vers le haut).\n\nQ: Abscisse du sommet de la parabole ?\nR: x~S~ = **−b / (2a)**\n\nQ: Formule du discriminant ?\nR: Δ = **b² − 4ac**\n\nQ: Solutions quand Δ > 0 ?\nR: x~1~ = (−b − √Δ) / (2a) et x~2~ = (−b + √Δ) / (2a).\n\nQ: Combien de solutions si Δ < 0 ?\nR: **Aucune** solution réelle (la parabole ne coupe pas l'axe des abscisses).\n\nQ: Lecture graphique des solutions de f(x) = 0 ?\nR: Ce sont les **abscisses des points d'intersection** de la parabole avec l'axe des abscisses.\n\n=== QUIZ ===\n? Pour f(x) = 2x² − 4x + 1, que vaut Δ ?\n- 24\n+ 8\n- −8\n! Δ = (−4)² − 4 × 2 × 1 = 16 − 8 = 8.\n\n? f(x) = x² − 6x + 9. Combien de solutions à f(x) = 0 ?\n- Deux\n+ Une seule\n- Aucune\n! Δ = 36 − 36 = 0 → une solution : x = 3.\n\n? Abscisse du sommet de f(x) = −x² + 4x + 5 ?\n- −2\n+ 2\n- 4\n! x~S~ = −b/(2a) = −4 / (−2) = 2.\n\n? f(x) = −3x² + x − 2. La parabole est…\n- tournée vers le haut\n+ tournée vers le bas, avec un maximum\n- une droite\n! a = −3 < 0 : la parabole est tournée vers le bas, son sommet est un maximum.\n\n? Les solutions de x² − 5x + 6 = 0 sont…\n+ 2 et 3\n- −2 et −3\n- 1 et 6\n! Δ = 25 − 24 = 1 ; x = (5 ± 1) / 2, soit 2 et 3.\n","---\nid: maths-trigo\nmatiere: maths\ntitre: Trigonométrie et cercle trigonométrique\nchapitre: Géométrie\nresume: Cosinus, sinus et tangente, le radian, le cercle trigonométrique et les valeurs remarquables (utiles en électricité).\nmots-cles: trigonométrie, cosinus, sinus, tangente, radian, cercle trigonométrique, valeurs remarquables, pi, angle\nordre: 6\n---\n\n## Dans le triangle rectangle\n\nPour un angle aigu x d'un triangle rectangle :\n\n> [!formule] SOH CAH TOA\n> sin x = côté **o**pposé / **h**ypoténuse\n> cos x = côté **a**djacent / **h**ypoténuse\n> tan x = côté **o**pposé / côté **a**djacent\n\nL'==hypoténuse== est le côté le plus long, en face de l'angle droit.\n\n> [!exemple]\n> Une échelle de 5 m fait un angle de 60° avec le sol. Hauteur atteinte : h = 5 × sin 60° ≈ 5 × 0,866 ≈ **4,33 m**.\n\n## Le radian\n\nLe ==radian== (rad) est une autre unité d'angle, utilisée en sciences.\n\n> [!formule]\n> π rad = 180°   →   angle en rad = angle en degrés × π / 180\n\n| Degrés | 0° | 30° | 45° | 60° | 90° | 180° | 360° |\n|---|---|---|---|---|---|---|---|\n| Radians | 0 | π/6 | π/4 | π/3 | π/2 | π | 2π |\n\n## Le cercle trigonométrique\n\nC'est un cercle de **centre O** et de **rayon 1**, parcouru dans le ==sens direct== (inverse des aiguilles d'une montre). À chaque nombre réel x correspond un point M du cercle :\n\n- ==cos x== = abscisse de M ;\n- ==sin x== = ordonnée de M.\n\nConséquences :\n\n- −1 ≤ cos x ≤ 1 et −1 ≤ sin x ≤ 1 ;\n- ==cos² x + sin² x = 1== ;\n- cos(−x) = cos x et sin(−x) = −sin x.\n\n~~~schema\ncercle-trigo\nLe point M du cercle de rayon 1 a pour coordonnées (cos θ ; sin θ).\n~~~\n\n## Valeurs remarquables\n\n| x | 0 | π/6 | π/4 | π/3 | π/2 |\n|---|---|---|---|---|---|\n| cos x | 1 | √3/2 | √2/2 | 1/2 | 0 |\n| sin x | 0 | 1/2 | √2/2 | √3/2 | 1 |\n\n> [!astuce] Retenir le tableau\n> Pour sin, écris √0/2, √1/2, √2/2, √3/2, √4/2 → 0, 1/2, √2/2, √3/2, 1. Le cosinus, c'est le même tableau à l'envers.\n\n## Lien avec l'électricité\n\nUne tension alternative sinusoïdale s'écrit u(t) = U~max~ × sin(ωt), avec ==ω = 2πf== (pulsation en rad/s). Pour le secteur à 50 Hz : ω = 2π × 50 ≈ 314 rad/s.\n\n> [!attention] Mode de la calculatrice\n> Vérifie que ta calculatrice est en mode **degrés (D)** ou **radians (R)** selon l'unité de l'énoncé : c'est l'erreur la plus fréquente !\n\n> [!retenir]\n> SOH CAH TOA · π rad = 180° · sur le cercle trigonométrique, cos = abscisse et sin = ordonnée · cos² + sin² = 1.\n\n=== EXERCICES ===\n# calcul : Trigonométrie\n? 60° = π/n radians : quelle est la valeur de n ?\n= 3\n? Convertis π/4 radian en degrés.\n= 45 °\n? Triangle rectangle : hypoténuse 10 cm, côté opposé 5 cm. Que vaut sin x ?\n= 0,5\n? Tension de 50 Hz : pulsation ω = 2πf (en rad/s, arrondie à l'unité) ?\n= 314 ± 1\n! 2 × 3,14159 × 50 ≈ 314 rad/s.\n\n# paires : Associe chaque valeur remarquable\n- cos 0 = 1\n- sin(π/6) = 1/2\n- cos(π/4) = √2/2\n- sin(π/3) = √3/2\n- cos(π/2) = 0\n\n=== CARTES ===\nQ: Définition du cosinus dans un triangle rectangle ?\nR: cos x = côté **adjacent** / **hypoténuse**.\n\nQ: Définition du sinus dans un triangle rectangle ?\nR: sin x = côté **opposé** / **hypoténuse**.\n\nQ: Définition de la tangente ?\nR: tan x = côté **opposé** / côté **adjacent**.\n\nQ: Combien de degrés vaut π radians ?\nR: **180°**\n\nQ: 90° en radians ?\nR: **π/2**\n\nQ: Sur le cercle trigonométrique, que représente cos x ?\nR: L'**abscisse** du point M associé à x (sin x = l'ordonnée).\n\nQ: Relation fondamentale entre cos et sin ?\nR: cos² x + sin² x = **1**\n\nQ: cos(π/3) = ?\nR: **1/2**\n\nQ: sin(π/6) = ?\nR: **1/2**\n\n=== QUIZ ===\n? 60° en radians vaut…\n- π/6\n+ π/3\n- π/2\n! 60 × π / 180 = π/3.\n\n? Dans un triangle rectangle, hypoténuse 10 cm, côté opposé à l'angle x : 5 cm. sin x = ?\n+ 0,5\n- 2\n- 0,2\n! sin x = opposé / hypoténuse = 5/10 = 0,5 (donc x = 30°).\n\n? Que vaut cos(0) ?\n- 0\n+ 1\n- −1\n! Le point associé à 0 sur le cercle trigonométrique est (1 ; 0) : cos 0 = 1.\n\n? Pulsation ω d'une tension de fréquence 50 Hz ?\n- 50 rad/s\n+ environ 314 rad/s\n- environ 157 rad/s\n! ω = 2πf = 2 × π × 50 ≈ 314 rad/s.\n\n? Si sin x = 0,6 (avec x aigu), alors cos x = ?\n- 0,4\n+ 0,8\n- 0,36\n! cos² x = 1 − 0,36 = 0,64 donc cos x = 0,8.\n","---\nid: pc-signaux\nmatiere: physique-chimie\ntitre: Signaux périodiques et tension alternative\nchapitre: Électricité\nresume: Période, fréquence, valeur maximale et valeur efficace ; lire un oscillogramme ; le secteur 230 V – 50 Hz.\nmots-cles: signal périodique, période, fréquence, hertz, tension alternative, sinusoïdale, valeur maximale, valeur efficace, oscilloscope, base de temps, sensibilité, secteur\nordre: 1\n---\n\n## Signal périodique\n\nUn signal est ==périodique== s'il se répète identique à lui-même à intervalles de temps réguliers.\n\n> [!formule]\n> Période **T** (en secondes, s) = durée d'un motif\n> Fréquence **f** (en hertz, Hz) = nombre de motifs par seconde\n> **f = 1 / T**   et   **T = 1 / f**\n\nExemples : signal carré d'une horloge numérique, signal triangulaire, tension sinusoïdale du secteur.\n\n## Tension alternative sinusoïdale\n\n- Une tension ==continue== garde la même valeur (pile, batterie, alimentation de PC).\n- Une tension ==alternative== change de signe : elle est tantôt positive, tantôt négative.\n- Une tension ==sinusoïdale== a la forme d'une courbe sinus.\n\n| Grandeur | Notation | Définition |\n|---|---|---|\n| Valeur maximale (amplitude) | U~max~ | plus haute valeur atteinte |\n| Valeur crête à crête | U~cc~ | U~cc~ = 2 × U~max~ |\n| Valeur moyenne | U~moy~ | 0 V pour une sinusoïde |\n| ==Valeur efficace== | U~eff~ | U~eff~ = U~max~ / √2 ≈ 0,707 × U~max~ |\n\n> [!definition] Valeur efficace\n> La valeur efficace d'une tension alternative est la valeur de la tension continue qui produirait le **même effet thermique** dans une résistance. C'est elle qu'affiche le multimètre en position alternatif (AC, symbole ~).\n\n~~~schema\nsignal-periodique\nOn lit Umax sur l'axe vertical et la période T entre deux maximums successifs.\n~~~\n\n## Le secteur électrique\n\nEn France, le secteur fournit une tension sinusoïdale de ==230 V efficaces== à ==50 Hz== :\n\n- T = 1 / 50 = 0,02 s = **20 ms** ;\n- U~max~ = 230 × √2 ≈ **325 V**.\n\n## Lire un oscillogramme\n\nL'oscilloscope affiche la tension en fonction du temps sur un écran quadrillé en **divisions** (div).\n\n- ==Sensibilité verticale== (en V/div) → U~max~ = nombre de divisions × sensibilité.\n- ==Base de temps== (en ms/div ou µs/div) → T = nombre de divisions d'un motif × base de temps.\n\n> [!exemple]\n> Un motif occupe **4 div** avec une base de temps de **5 ms/div** → T = 4 × 5 = 20 ms → f = 1 / 0,020 = **50 Hz**.\n> Le sommet est à **3 div** du milieu avec **2 V/div** → U~max~ = 6 V → U~eff~ = 6 / √2 ≈ **4,24 V**.\n\n> [!attention] Unités\n> Convertis la période en **secondes** avant de calculer f : 20 ms = 0,020 s. Et 1 kHz = 1 000 Hz, 1 MHz = 10^6^ Hz.\n\n> [!retenir]\n> f = 1/T · U~eff~ = U~max~/√2 · secteur : 230 V, 50 Hz, T = 20 ms, U~max~ ≈ 325 V · le multimètre (AC) mesure la valeur efficace.\n\n=== EXERCICES ===\n# calcul : Signaux périodiques\n? Période de 20 ms : fréquence (en Hz) ?\n= 50 Hz\n! f = 1/T = 1/0,020 = 50 Hz.\n? Fréquence de 1 000 Hz : période (en ms) ?\n= 1 ms\n? U~max~ = 12 V. Valeur efficace (en V) ?\n= 8,49 V ± 0,02\n! 12 / √2 ≈ 8,49 V.\n? Oscilloscope : un motif fait 4 divisions avec une base de temps de 5 ms/div. Période (en ms) ?\n= 20 ms\n? Le sommet est à 3 divisions avec une sensibilité de 2 V/div. U~max~ (en V) ?\n= 6 V\n\n# paires : Associe chaque grandeur à son unité\n- Période = seconde (s)\n- Fréquence = hertz (Hz)\n- Tension = volt (V)\n- Base de temps = ms/div\n- Sensibilité verticale = V/div\n\n=== CARTES ===\nQ: Relation entre fréquence et période ?\nR: **f = 1 / T** (f en Hz, T en s).\n\nQ: Unité de la fréquence ?\nR: Le **hertz** (Hz) : nombre de motifs par seconde.\n\nQ: Formule de la valeur efficace d'une tension sinusoïdale ?\nR: U~eff~ = U~max~ / √2 (≈ 0,707 × U~max~).\n\nQ: Caractéristiques du secteur en France ?\nR: **230 V** efficaces, **50 Hz**.\n\nQ: Période du secteur à 50 Hz ?\nR: T = 1/50 = **20 ms**.\n\nQ: Valeur maximale de la tension du secteur ?\nR: U~max~ = 230 × √2 ≈ **325 V**.\n\nQ: Que mesure un multimètre en position AC (~) ?\nR: La **valeur efficace** de la tension (ou de l'intensité).\n\nQ: À quoi sert la base de temps d'un oscilloscope ?\nR: À mesurer les **durées** (période) : T = nombre de divisions × base de temps.\n\n=== QUIZ ===\n? Un signal a une période de 2 ms. Sa fréquence est…\n- 2 Hz\n+ 500 Hz\n- 2 000 Hz\n! f = 1 / 0,002 = 500 Hz.\n\n? U~max~ = 10 V. Quelle est la valeur efficace ?\n- 14,1 V\n+ 7,07 V\n- 5 V\n! U~eff~ = 10 / √2 ≈ 7,07 V.\n\n? Sur un oscillogramme, un motif fait 5 div avec une base de temps de 0,2 ms/div. Fréquence ?\n+ 1 000 Hz\n- 100 Hz\n- 5 000 Hz\n! T = 5 × 0,2 = 1 ms = 0,001 s, donc f = 1 000 Hz.\n\n? Quelle est la valeur moyenne d'une tension sinusoïdale ?\n+ 0 V\n- U~max~\n- U~eff~\n! Les alternances positive et négative se compensent : la moyenne est nulle.\n\n? La tension de 230 V du secteur est une valeur…\n- maximale\n+ efficace\n- crête à crête\n! 230 V est la valeur efficace ; la valeur maximale est d'environ 325 V.\n","---\nid: pc-puissance-energie\nmatiere: physique-chimie\ntitre: Puissance et énergie électriques\nchapitre: Électricité\nresume: P = U × I, E = P × t, le kilowattheure, l'effet Joule, le rendement et le calcul d'une consommation.\nmots-cles: puissance, watt, énergie, joule, kilowattheure, kWh, effet Joule, rendement, plaque signalétique, consommation, facture\nordre: 2\n---\n\n## La puissance électrique\n\nLa ==puissance== (en watts, **W**) indique la quantité d'énergie consommée ou fournie chaque seconde.\n\n> [!formule]\n> **P = U × I**   (P en W, U en V, I en A)\n> Pour une résistance (effet Joule) : **P = R × I²** = U² / R\n\nCette formule s'applique en continu, et en alternatif pour les appareils résistifs (radiateur, four) avec les valeurs **efficaces**.\n\n> [!exemple]\n> Un radiateur de 2 000 W branché sur 230 V : I = P / U = 2 000 / 230 ≈ **8,7 A**. Il faut une ligne protégée en conséquence (disjoncteur adapté).\n\n## L'énergie électrique\n\n> [!formule]\n> **E = P × t**\n> E en joules (J) si P en W et t en s · E en wattheures (Wh) si P en W et t en h\n> **1 kWh = 1 000 Wh = 3,6 × 10^6^ J**\n\nLe ==kilowattheure (kWh)== est l'unité de la facture d'électricité.\n\n> [!exemple] Combien coûte un PC de gamer ?\n> Un PC de 300 W fonctionne 4 h par jour pendant 30 jours : t = 120 h.\n> E = 0,3 kW × 120 h = **36 kWh**. Avec un prix de 0,25 € le kWh (prix d'exemple) : 36 × 0,25 = **9 €** par mois.\n\n## L'effet Joule\n\nTout conducteur parcouru par un courant ==s'échauffe== : c'est l'==effet Joule==.\n\n- **Utile** : radiateur, bouilloire, fer à souder, fusible (qui fond en cas de surintensité).\n- **Gênant** : pertes d'énergie dans les câbles, échauffement des composants (d'où les dissipateurs et ventilateurs).\n\n## Le rendement\n\nUn appareil transforme l'énergie, mais une partie est perdue (souvent en chaleur).\n\n> [!formule]\n> **η = P~utile~ / P~absorbée~**   (sans unité, toujours < 1, souvent en %)\n\nExemple : une alimentation absorbe 500 W et fournit 450 W aux composants : η = 450 / 500 = 0,9 = **90 %**. Les 50 W perdus chauffent le boîtier.\n\n## La plaque signalétique\n\nElle indique les valeurs ==nominales== de l'appareil : tension (230 V ~), fréquence (50 Hz), puissance (W), parfois l'intensité. Ces valeurs permettent de choisir la protection et de calculer la consommation.\n\n> [!astuce] Réduire la consommation\n> Éteindre plutôt que laisser en veille, choisir des appareils bien classés sur l'étiquette énergie, régler l'ordinateur en mode économie d'énergie.\n\n> [!retenir]\n> P = U × I · E = P × t · 1 kWh = 3,6 MJ · η = P~utile~ / P~absorbée~ < 1.\n\n=== EXERCICES ===\n# calcul : Puissance et énergie\n? Un radiateur absorbe 9 A sous 230 V. Puissance (en W) ?\n= 2070 W\n? Une box de 15 W reste allumée 24 h. Énergie consommée (en kWh) ?\n= 0,36 kWh\n! 15 × 24 = 360 Wh = 0,36 kWh.\n? Avec un kWh à 0,25 €, combien coûte cette énergie (en €) ?\n= 0,09 € ± 0,005\n? Une alimentation absorbe 500 W et fournit 425 W. Rendement (en %) ?\n= 85 %\n? 2 kWh en mégajoules (MJ) ?\n= 7,2 MJ\n! 1 kWh = 3,6 MJ.\n\n=== CARTES ===\nQ: Formule de la puissance électrique ?\nR: **P = U × I** (W = V × A).\n\nQ: Puissance dissipée par une résistance ?\nR: P = R × I² (ou U² / R) : c'est l'**effet Joule**.\n\nQ: Formule de l'énergie électrique ?\nR: **E = P × t**\n\nQ: 1 kWh = combien de joules ?\nR: **3,6 × 10^6^ J** (3,6 MJ).\n\nQ: Qu'est-ce que l'effet Joule ?\nR: L'**échauffement** d'un conducteur traversé par un courant.\n\nQ: Formule du rendement ?\nR: η = P~utile~ / P~absorbée~ (toujours inférieur à 1).\n\nQ: Intensité absorbée par un appareil de 1 150 W sur 230 V ?\nR: I = 1 150 / 230 = **5 A**.\n\n=== QUIZ ===\n? Un appareil de 60 W fonctionne pendant 10 h. Énergie consommée ?\n- 6 Wh\n+ 0,6 kWh\n- 6 kWh\n! E = 60 W × 10 h = 600 Wh = 0,6 kWh.\n\n? Une résistance de 100 Ω est traversée par 0,2 A. Puissance dissipée ?\n- 20 W\n+ 4 W\n- 0,4 W\n! P = R × I² = 100 × 0,04 = 4 W.\n\n? Un moteur absorbe 800 W et fournit 600 W. Son rendement est de…\n- 133 %\n+ 75 %\n- 25 %\n! η = 600 / 800 = 0,75 = 75 %.\n\n? Quelle unité trouve-t-on sur une facture d'électricité ?\n- Le watt\n+ Le kilowattheure\n- Le volt\n! La facture compte l'énergie consommée, en kWh.\n\n? Lequel de ces appareils utilise l'effet Joule de façon utile ?\n+ Un fer à souder\n- Un haut-parleur\n- Une LED\n! Le fer à souder chauffe grâce à l'effet Joule.\n","---\nid: pc-ondes\nmatiere: physique-chimie\ntitre: Ondes sonores et électromagnétiques\nchapitre: Signaux — Ondes\nresume: Son, ultrasons, décibels, spectre électromagnétique, Wi-Fi et fibre optique : les ondes qui transportent l'information.\nmots-cles: onde, son, ultrason, infrason, décibel, vitesse du son, onde électromagnétique, spectre, longueur d'onde, Wi-Fi, fibre optique, lumière visible\nordre: 3\n---\n\n## Qu'est-ce qu'une onde ?\n\nUne ==onde== est la propagation d'une perturbation qui ==transporte de l'énergie sans transporter de matière== (comme une « ola » dans un stade).\n\n## Les ondes sonores\n\n- Le son est une onde ==mécanique== : il a **besoin d'un milieu** matériel (air, eau, solide) et **ne se propage pas dans le vide**.\n- Vitesse du son : environ ==340 m/s dans l'air==, environ 1 500 m/s dans l'eau, plus de 5 000 m/s dans l'acier.\n\n| Domaine | Fréquence | Exemples |\n|---|---|---|\n| Infrasons | moins de 20 Hz | séismes, éléphants |\n| Sons audibles | de 20 Hz à 20 kHz | voix, musique |\n| Ultrasons | plus de 20 kHz | échographie, sonar, capteur de distance HC-SR04 (40 kHz) |\n\n- Le ==niveau sonore== se mesure en **décibels**, dB(A), avec un sonomètre. L'échelle n'est pas proportionnelle : **+3 dB = intensité sonore doublée**.\n- L'exposition prolongée à partir de **80 dB(A)** est dangereuse pour l'audition (voir la fiche PSE).\n\n> [!exemple] Mesurer une distance avec des ultrasons\n> Le capteur envoie une salve et mesure la durée t de l'aller-retour de l'écho : **d = v × t / 2**. Si t = 2 ms dans l'air : d = 340 × 0,002 / 2 = **0,34 m**.\n\n## Les ondes électromagnétiques\n\n- Elles se propagent **aussi dans le vide**, à la vitesse de la lumière : ==c = 3,00 × 10^8^ m/s==.\n\n> [!formule] Longueur d'onde\n> **λ = c / f**   (λ en m, c en m/s, f en Hz)\n\nLe ==spectre électromagnétique==, des grandes aux petites longueurs d'onde :\n\n| Ondes | Exemples d'utilisation |\n|---|---|\n| Ondes radio | radio FM (≈ 100 MHz), TNT |\n| Micro-ondes | ==Wi-Fi (2,4 GHz et 5 GHz)==, Bluetooth, téléphonie 4G/5G, four à micro-ondes |\n| Infrarouges | télécommande, caméra thermique, chaleur |\n| Lumière visible | de **400 nm (violet) à 800 nm (rouge)** |\n| Ultraviolets | soleil (bronzage, coups de soleil), stérilisation |\n| Rayons X et gamma | radiographie, radiothérapie (dangereux) |\n\n> [!exemple] Le Wi-Fi à 2,4 GHz\n> λ = 3 × 10^8^ / 2,4 × 10^9^ = **0,125 m**, soit 12,5 cm.\n\n## La fibre optique\n\nLa lumière est guidée dans le cœur en verre par ==réflexion totale== sur la gaine. Avantages : **très haut débit**, longues distances, ==insensible aux perturbations électromagnétiques==. C'est le support d'Internet très haut débit (FTTH) et des liaisons entre bâtiments.\n\n> [!retenir]\n> Son : onde mécanique, besoin d'un milieu, ≈ 340 m/s dans l'air, audible de 20 Hz à 20 kHz. Ondes électromagnétiques : se propagent dans le vide à 3 × 10^8^ m/s, λ = c/f, du radio aux rayons gamma.\n\n=== EXERCICES ===\n# calcul : Ondes\n? Longueur d'onde du Wi-Fi à 5 GHz (en cm), avec c = 3 × 10^8^ m/s ?\n= 6 cm\n! λ = 3 × 10^8^ / 5 × 10^9^ = 0,06 m = 6 cm.\n? Un écho revient après 0,02 s dans l'air (340 m/s). Distance de l'obstacle (en m) ?\n= 3,4 m\n! d = 340 × 0,02 / 2 = 3,4 m.\n? Longueur d'onde d'une radio FM à 100 MHz (en m) ?\n= 3 m\n\n# classer : Classe ces sons\nInfrasons (moins de 20 Hz) : 5 Hz, 15 Hz\nSons audibles : 440 Hz, 2 000 Hz, 15 000 Hz\nUltrasons (plus de 20 kHz) : 40 kHz, 50 000 Hz\n\n=== CARTES ===\nQ: Le son peut-il se propager dans le vide ?\nR: **Non** : c'est une onde mécanique, il lui faut un milieu matériel.\n\nQ: Vitesse du son dans l'air ?\nR: Environ **340 m/s**.\n\nQ: Domaine des sons audibles par l'être humain ?\nR: De **20 Hz à 20 kHz**.\n\nQ: Qu'est-ce qu'un ultrason ?\nR: Un son de fréquence **supérieure à 20 kHz** (inaudible pour nous).\n\nQ: Vitesse des ondes électromagnétiques dans le vide ?\nR: c = **3,00 × 10^8^ m/s**.\n\nQ: Formule de la longueur d'onde ?\nR: **λ = c / f**\n\nQ: Domaine de longueurs d'onde de la lumière visible ?\nR: De **400 nm** (violet) à **800 nm** (rouge).\n\nQ: Dans quelle famille d'ondes se trouve le Wi-Fi ?\nR: Les **micro-ondes** (2,4 GHz et 5 GHz).\n\nQ: Comment la lumière est-elle guidée dans une fibre optique ?\nR: Par **réflexion totale** à la limite entre le cœur et la gaine.\n\n=== QUIZ ===\n? Lequel de ces signaux peut traverser le vide spatial ?\n- Le son d'une explosion\n+ La lumière du Soleil\n- Un ultrason\n! Les ondes électromagnétiques (dont la lumière) se propagent dans le vide, pas les ondes sonores.\n\n? Longueur d'onde d'une onde de 100 MHz (radio FM) ?\n- 30 cm\n+ 3 m\n- 300 m\n! λ = 3 × 10^8^ / 10^8^ = 3 m.\n\n? Un capteur à ultrasons mesure un aller-retour de 10 ms dans l'air. Distance de l'obstacle ?\n- 3,4 m\n+ 1,7 m\n- 34 m\n! d = 340 × 0,010 / 2 = 1,7 m.\n\n? Quel est l'avantage principal de la fibre optique face au cuivre ?\n+ Elle est insensible aux perturbations électromagnétiques et offre un très haut débit\n- Elle est plus facile à souder\n- Elle transporte du courant électrique\n! La fibre transporte de la lumière : pas de perturbation électromagnétique, débit très élevé.\n\n? Quel rayonnement a la plus petite longueur d'onde ?\n- Les ondes radio\n- L'infrarouge\n+ Les rayons gamma\n! Du plus grand au plus petit : radio, micro-ondes, infrarouge, visible, UV, X, gamma.\n","---\nid: pc-chimie-securite\nmatiere: physique-chimie\ntitre: Chimie : pH, sécurité et pictogrammes\nchapitre: Chimie\nresume: Acide, neutre, basique ; les 9 pictogrammes de danger ; corrosion des métaux, combustion et batteries lithium.\nmots-cles: pH, acide, basique, neutre, dilution, pictogrammes, SGH, danger, EPI, corrosion, rouille, combustion, triangle du feu, batterie lithium\nordre: 4\n---\n\n## Le pH d'une solution\n\nLe ==pH== indique si une solution aqueuse est acide, neutre ou basique (à 25 °C). On le mesure avec du **papier pH** (approximatif) ou un **pH-mètre** (précis).\n\n| pH < 7 | pH = 7 | pH > 7 |\n|---|---|---|\n| ==Acide== (vinaigre, jus de citron, acide de batterie) | ==Neutre== (eau pure) | ==Basique== (eau de Javel, lessive, soude) |\n\n- Plus le pH est **proche de 0**, plus la solution est acide ; plus il est **proche de 14**, plus elle est basique.\n- ==Diluer== une solution acide fait **augmenter** son pH vers 7 ; diluer une solution basique le fait **diminuer** vers 7.\n\n> [!attention] Règle de sécurité\n> Pour diluer un acide concentré : on verse toujours ==l'acide dans l'eau==, jamais l'eau dans l'acide (risque de projections violentes).\n\n## Les pictogrammes de danger (SGH)\n\nLosange rouge sur fond blanc, ils figurent sur les étiquettes des produits.\n\n| Pictogramme | Signification |\n|---|---|\n| Bombe qui explose | **Explosif** |\n| Flamme | **Inflammable** |\n| Flamme au-dessus d'un cercle | **Comburant** (aggrave un incendie) |\n| Bouteille de gaz | **Gaz sous pression** |\n| Main et surface rongées | **Corrosif** (brûle la peau, les yeux, les métaux) |\n| Tête de mort | **Toxicité aiguë** (mortel même en petite quantité) |\n| Point d'exclamation | **Irritant, nocif**, dangereux pour la santé |\n| Silhouette avec une étoile sur la poitrine | **Danger grave pour la santé** (cancérogène, mutagène…) |\n| Arbre et poisson morts | **Dangereux pour l'environnement** |\n\n**EPI** au laboratoire : blouse en coton, lunettes de protection, gants adaptés. On lit l'étiquette **avant** d'utiliser un produit.\n\n## La corrosion des métaux\n\n- La ==corrosion== est la dégradation d'un métal par une réaction chimique avec son environnement. Le fer **rouille** en présence de ==dioxygène== et d'==eau== (et plus vite avec du sel).\n- Protections : peinture, vernis, graisse, ==galvanisation== (couche de zinc), acier inoxydable, contacts électriques dorés.\n\n## La combustion et le triangle du feu\n\nUne ==combustion== est une réaction entre un **combustible** et un **comburant** (le dioxygène de l'air). Pour qu'un feu démarre, il faut les 3 éléments du ==triangle du feu== : **combustible + comburant + énergie d'activation** (chaleur, étincelle). Supprimer un des trois éteint le feu.\n\n> [!attention] Batteries lithium-ion (téléphones, portables, trottinettes)\n> Une batterie percée, écrasée, gonflée ou surchauffée peut prendre feu violemment (emballement thermique). Ne pas la démonter, utiliser un chargeur adapté, la déposer dans un point de collecte pour recyclage.\n\n> [!retenir]\n> pH < 7 acide, = 7 neutre, > 7 basique · l'acide dans l'eau · 9 pictogrammes SGH · rouille = fer + dioxygène + eau · triangle du feu = combustible + comburant + énergie.\n\n=== EXERCICES ===\n# classer : Acide, neutre ou basique ?\nAcide : vinaigre (pH 3), jus de citron (pH 2), acide de batterie (pH 1)\nNeutre : eau pure (pH 7)\nBasique : eau de Javel (pH 12), lessive (pH 10)\n\n# paires : Associe chaque pictogramme à son danger\n- Flamme = Inflammable\n- Tête de mort = Toxicité aiguë\n- Main et surface rongées = Corrosif\n- Flamme au-dessus d'un cercle = Comburant\n- Arbre et poisson morts = Dangereux pour l'environnement\n\n=== CARTES ===\nQ: Une solution de pH 3 est…\nR: **Acide** (pH < 7).\n\nQ: Une solution de pH 12 est…\nR: **Basique** (pH > 7).\n\nQ: Que devient le pH d'un acide qu'on dilue ?\nR: Il **augmente** et se rapproche de 7.\n\nQ: Comment diluer un acide concentré en sécurité ?\nR: Verser **l'acide dans l'eau**, jamais l'inverse.\n\nQ: Que signifie le pictogramme « flamme au-dessus d'un cercle » ?\nR: **Comburant** : le produit peut provoquer ou aggraver un incendie.\n\nQ: Que signifie le pictogramme « main et surface rongées » ?\nR: **Corrosif** : brûle la peau, les yeux et attaque les métaux.\n\nQ: Quels éléments sont nécessaires à la formation de la rouille ?\nR: Le **fer**, le **dioxygène** et l'**eau**.\n\nQ: Quels sont les 3 éléments du triangle du feu ?\nR: **Combustible**, **comburant** (dioxygène) et **énergie d'activation** (chaleur, étincelle).\n\n=== QUIZ ===\n? Le vinaigre a un pH d'environ 3. Il est…\n+ acide\n- neutre\n- basique\n! pH inférieur à 7 : solution acide.\n\n? Quel pictogramme indique un produit mortel même en petite quantité ?\n- Le point d'exclamation\n+ La tête de mort\n- La flamme\n! La tête de mort signale une toxicité aiguë.\n\n? La galvanisation consiste à…\n- peindre le métal en rouge\n+ recouvrir l'acier d'une couche de zinc\n- chauffer le métal\n! Le zinc protège l'acier de la corrosion.\n\n? Pour éteindre un feu, on peut…\n+ supprimer un des éléments du triangle du feu\n- ajouter du dioxygène\n- augmenter la température\n! Sans combustible, sans comburant ou sans énergie, la combustion s'arrête.\n\n? Une batterie lithium-ion gonflée doit être…\n- rechargée rapidement\n+ mise hors service et déposée dans un point de collecte\n- percée pour la dégonfler\n! Une batterie gonflée est dangereuse : risque d'incendie. Ne jamais la percer.\n","---\nid: pse-prevention\nmatiere: pse\ntitre: La démarche de prévention des risques professionnels\nchapitre: Prévention des risques professionnels\nresume: Danger, situation dangereuse, dommage ; évaluer un risque ; les 9 principes généraux de prévention ; accident du travail et droit de retrait.\nmots-cles: danger, risque, situation dangereuse, dommage, prévention, protection collective, EPI, principes généraux de prévention, DUERP, accident du travail, maladie professionnelle, droit de retrait, arbre des causes\nordre: 1\n---\n\n## Le vocabulaire\n\n- ==Danger== : ce qui peut causer un dommage (électricité, bruit, produit chimique, charge lourde, écran…).\n- ==Situation dangereuse== : une personne est ==exposée== au danger.\n- ==Événement dangereux== : ce qui déclenche le dommage (contact avec un fil dénudé, chute d'un objet…).\n- ==Dommage== : l'atteinte à la santé (blessure, brûlure, surdité, maladie…).\n- ==Risque== : la possibilité qu'un dommage survienne. On l'évalue selon la **probabilité** et la **gravité**.\n\n> [!formule] Le processus d'apparition d'un dommage\n> Danger + personne → situation dangereuse → (événement dangereux) → **dommage**\n\n## Les démarches d'analyse\n\n- **Approche par le risque** : repérer les dangers, les évaluer, proposer des mesures (avant l'accident).\n- **Approche par le travail** : observer l'activité réelle (ce que fait vraiment le salarié) et la comparer au travail prescrit.\n- **Approche par l'accident** : après un accident, on recherche toutes ses causes avec l'==arbre des causes== pour éviter qu'il se reproduise.\n\n## Les mesures de prévention, par ordre de priorité\n\n1. ==Prévention intrinsèque== : supprimer ou réduire le danger **à la source** (remplacer un produit dangereux, travailler hors tension).\n2. ==Protection collective== : protège tous les salariés (garde-corps, capotage, aspiration, ventilation, disjoncteur différentiel).\n3. ==Protection individuelle== : les **EPI** (gants, lunettes, chaussures de sécurité, casque antibruit), en dernier recours.\n4. **Formation et information** : consignes, signalisation, habilitations.\n\n## Les 9 principes généraux de prévention (Code du travail)\n\n1. Éviter les risques.\n2. Évaluer les risques qui ne peuvent pas être évités.\n3. Combattre les risques à la source.\n4. Adapter le travail à l'homme.\n5. Tenir compte de l'évolution de la technique.\n6. Remplacer ce qui est dangereux par ce qui l'est moins.\n7. Planifier la prévention.\n8. Donner la priorité à la protection collective sur la protection individuelle.\n9. Donner les instructions appropriées aux travailleurs.\n\n## Accident du travail et maladie professionnelle\n\n- ==Accident du travail== : accident soudain survenu par le fait ou à l'occasion du travail. L'accident de **trajet** domicile-travail est aussi pris en charge.\n- ==Maladie professionnelle== : maladie due à une exposition prolongée à un risque au travail (bruit, TMS, produits…).\n- Le salarié prévient son employeur **dans les 24 heures** ; l'employeur déclare l'accident à la CPAM **dans les 48 heures**.\n\n## Les acteurs de la prévention\n\n- L'**employeur** a une ==obligation de sécurité== : il évalue les risques dans le ==DUERP== (document unique d'évaluation des risques professionnels) et met en place les mesures.\n- Le **salarié** respecte les consignes et dispose d'un ==droit d'alerte et de retrait== en cas de danger **grave et imminent**.\n- Le **CSE**, le **médecin du travail**, l'**inspection du travail**, la **CARSAT** et l'**INRS** conseillent et contrôlent.\n\n> [!retenir]\n> Supprimer le danger d'abord, puis protection **collective**, puis **EPI**. Risque = probabilité × gravité. Danger grave et imminent → droit de retrait.\n\n=== EXERCICES ===\n# classer : Classe chaque mesure de prévention\nPrévention intrinsèque (supprimer le danger) : remplacer un produit toxique par un produit sans danger, travailler hors tension\nProtection collective : garde-corps, aspiration des fumées, disjoncteur différentiel\nProtection individuelle (EPI) : gants, lunettes de protection, casque antibruit\n\n# ordre : Remets le processus d'apparition du dommage dans l'ordre\n- Danger\n- Situation dangereuse (une personne est exposée)\n- Événement dangereux\n- Dommage\n\n=== CARTES ===\nQ: Différence entre danger et risque ?\nR: Le **danger** est ce qui peut causer un dommage ; le **risque** est la possibilité que le dommage arrive (probabilité × gravité).\n\nQ: Qu'est-ce qu'une situation dangereuse ?\nR: Une situation où une personne est **exposée** à un danger.\n\nQ: Ordre de priorité des mesures de prévention ?\nR: 1. supprimer le danger (intrinsèque) 2. protection **collective** 3. protection **individuelle** (EPI) 4. formation, consignes.\n\nQ: Que signifie EPI ?\nR: **Équipement de protection individuelle** (gants, lunettes, casque…).\n\nQ: Qu'est-ce que le DUERP ?\nR: Le **document unique d'évaluation des risques professionnels**, obligatoire pour l'employeur.\n\nQ: À quoi sert l'arbre des causes ?\nR: À rechercher **toutes les causes** d'un accident pour éviter qu'il se reproduise.\n\nQ: Qu'est-ce que le droit de retrait ?\nR: Le droit de se retirer d'une situation présentant un **danger grave et imminent**, après avoir alerté l'employeur.\n\nQ: Délai pour prévenir l'employeur d'un accident du travail ?\nR: **24 heures** (l'employeur déclare ensuite à la CPAM sous 48 h).\n\n=== QUIZ ===\n? Installer un garde-corps sur une mezzanine est une mesure de…\n- prévention intrinsèque\n+ protection collective\n- protection individuelle\n! Le garde-corps protège toutes les personnes présentes : protection collective.\n\n? Un câble électrique dénudé dans un local est…\n+ un danger\n- un dommage\n- un événement dangereux\n! Le câble dénudé peut causer un dommage : c'est un danger.\n\n? Quelle mesure est prioritaire selon les principes généraux de prévention ?\n- Distribuer des EPI\n+ Supprimer le risque à la source\n- Afficher une consigne\n! Il faut d'abord éviter le risque ou le combattre à la source.\n\n? Le DUERP est rédigé par…\n- le salarié\n+ l'employeur\n- le médecin du travail\n! L'employeur est responsable de l'évaluation des risques.\n\n? Une chute dans l'escalier du métro en allant au travail est…\n- une maladie professionnelle\n+ un accident de trajet\n- non prise en charge\n! L'accident survenu entre le domicile et le lieu de travail est un accident de trajet.\n","---\nid: pse-risque-electrique\nmatiere: pse\ntitre: Le risque électrique\nchapitre: Prévention des risques professionnels\nresume: Effets du courant sur le corps, domaines de tension, protections, habilitation électrique, consignation et conduite à tenir.\nmots-cles: risque électrique, électrisation, électrocution, contact direct, contact indirect, domaines de tension, TBT, BT, DDR 30 mA, mise à la terre, habilitation électrique, B0, BS, BR, consignation, VAT\nordre: 2\n---\n\n## Électrisation ou électrocution ?\n\n- ==Électrisation== : passage du courant électrique dans le corps → brûlures, contractions, malaise, lésions.\n- ==Électrocution== : électrisation ==mortelle==.\n\n## Les effets du courant (alternatif 50 Hz, chez l'adulte)\n\n| Intensité | Effet sur le corps |\n|---|---|\n| 0,5 mA | seuil de **perception** (picotement) |\n| 10 mA | **contraction musculaire** : on ne peut plus lâcher la pièce (« non-lâcher ») |\n| 30 mA | **paralysie respiratoire** (asphyxie si le contact dure) |\n| 75 mA | **fibrillation cardiaque** (le cœur ne pompe plus) |\n| 1 A | **arrêt cardiaque** |\n\nLa gravité dépend de l'==intensité==, de la ==durée== du contact, du ==trajet== du courant (main-pied, main-main : à travers le cœur) et de la ==résistance du corps== (beaucoup plus faible avec une peau mouillée).\n\n> [!attention]\n> C'est pour cela que les prises sont protégées par un **disjoncteur différentiel 30 mA** : il coupe le courant avant la paralysie respiratoire.\n\n## Contact direct et indirect\n\n- ==Contact direct== : avec une partie **normalement sous tension** (fil dénudé, borne).\n- ==Contact indirect== : avec une ==masse== mise **accidentellement** sous tension à cause d'un défaut d'isolement (carcasse métallique d'un appareil).\n\n## Les domaines de tension\n\n| Domaine | Alternatif (AC) | Continu (DC) |\n|---|---|---|\n| TBT (très basse tension) | jusqu'à 50 V | jusqu'à 120 V |\n| BT (basse tension) | de 50 à 1 000 V | de 120 à 1 500 V |\n| HT (haute tension : HTA, HTB) | au-delà de 1 000 V | au-delà de 1 500 V |\n\nLe secteur domestique (230 V / 400 V) est en **BT**.\n\n## Se protéger\n\n- **Contre les contacts directs** : isolation des conducteurs, enveloppes et capots, éloignement, travail hors tension, ==TBTS== (très basse tension de sécurité).\n- **Contre les contacts indirects** : ==mise à la terre== des masses + ==disjoncteur différentiel (DDR) 30 mA== ; appareils à **double isolation** (symbole : deux carrés emboîtés).\n- Fusibles et disjoncteurs protègent surtout **l'installation** contre les surintensités (courts-circuits, surcharges).\n\n## L'habilitation électrique\n\nL'==habilitation== est délivrée **par l'employeur**, après une formation, pour autoriser une personne à réaliser certaines opérations. Elle s'écrit avec des symboles (norme NF C 18-510) :\n\n| Symbole | Sens |\n|---|---|\n| **B** / **H** | domaine basse tension (et TBT) / haute tension |\n| **0** | non-électricien : travaux non électriques dans un local électrique |\n| **1** / **2** | exécutant / chargé de travaux électriques |\n| **V** | travail au voisinage de pièces sous tension |\n| **S** | intervention élémentaire (remplacer un fusible, une prise…) |\n| **R** | intervention BT générale (dépannage, raccordement) |\n| **C** | consignation |\n| **E** | opérations spécifiques : essais, mesurage, vérification, manœuvre |\n\nExemples : **B0**, **H0V**, **BS**, **BR**, **BE Mesurage**.\n\n## La consignation (mise en sécurité avant travaux)\n\n1. ==Séparer== l'installation de sa source d'énergie (sectionneur).\n2. ==Condamner== l'organe de séparation (cadenas + étiquette).\n3. ==Identifier== l'installation sur laquelle on va travailler.\n4. ==Vérifier l'absence de tension== (VAT) avec un appareil adapté.\n5. **Mettre à la terre et en court-circuit** (quand c'est prévu).\n\n## Face à une victime\n\n1. **Protéger** : ne jamais toucher la victime tant qu'elle est en contact ; **couper le courant** (disjoncteur, prise) ou l'écarter avec un objet isolant et sec.\n2. **Alerter** : 15, 18 ou 112.\n3. **Secourir** : si elle ne respire pas, massage cardiaque et défibrillateur (DAE).\n\n> [!retenir]\n> 30 mA → paralysie respiratoire (d'où le DDR 30 mA). Contact direct = partie active ; indirect = masse en défaut. Habilitation délivrée par l'employeur. Consignation : séparer, condamner, identifier, VAT, MALT-CC.\n\n=== EXERCICES ===\n# ordre : Classe les effets du courant du plus faible au plus grave\n- Seuil de perception (0,5 mA)\n- Contraction musculaire, non-lâcher (10 mA)\n- Paralysie respiratoire (30 mA)\n- Fibrillation cardiaque (75 mA)\n- Arrêt cardiaque (1 A)\n\n# ordre : Remets les étapes de la consignation dans l'ordre\n- Séparer\n- Condamner\n- Identifier\n- Vérifier l'absence de tension (VAT)\n- Mettre à la terre et en court-circuit\n\n# classer : Contact direct ou indirect ?\nContact direct : toucher un fil dénudé, mettre les doigts sur une borne sous tension\nContact indirect : toucher la carcasse d'une machine en défaut, toucher le boîtier métallique d'un PC mal isolé\n\n=== CARTES ===\nQ: Différence entre électrisation et électrocution ?\nR: L'**électrisation** est le passage du courant dans le corps ; l'**électrocution** est une électrisation **mortelle**.\n\nQ: Quel effet à partir de 30 mA ?\nR: La **paralysie respiratoire**.\n\nQ: Quel effet à 10 mA ?\nR: Une **contraction musculaire** qui empêche de lâcher (« non-lâcher »).\n\nQ: Qu'est-ce qu'un contact indirect ?\nR: Un contact avec une **masse** mise accidentellement sous tension par un défaut d'isolement.\n\nQ: Limite de la TBT en alternatif ?\nR: **50 V** (120 V en continu).\n\nQ: Quel dispositif protège les personnes contre les contacts indirects ?\nR: La **mise à la terre** associée à un **disjoncteur différentiel 30 mA**.\n\nQ: Qui délivre l'habilitation électrique ?\nR: L'**employeur**, après une formation.\n\nQ: Que signifie l'habilitation BS ?\nR: **B** = basse tension, **S** = intervention élémentaire (remplacer un fusible, une prise…).\n\nQ: Les 5 étapes de la consignation ?\nR: Séparer, condamner, identifier, **vérifier l'absence de tension (VAT)**, mettre à la terre et en court-circuit.\n\nQ: Premier geste face à une personne électrisée ?\nR: **Couper le courant** sans toucher la victime.\n\n=== QUIZ ===\n? Quel courant suffit à provoquer une paralysie respiratoire ?\n- 0,5 mA\n+ 30 mA\n- 5 A\n! Dès 30 mA environ : c'est pourquoi les prises sont protégées par un différentiel 30 mA.\n\n? Toucher la carcasse métallique d'une machine à laver en défaut, c'est un contact…\n- direct\n+ indirect\n- sans danger\n! La carcasse est une masse, normalement hors tension : contact indirect.\n\n? La tension du secteur domestique (230 V) appartient au domaine…\n- TBT\n+ BT\n- HTA\n! La BT va de 50 à 1 000 V en alternatif.\n\n? Un collègue est collé à un câble sous tension. Que faire d'abord ?\n- Le tirer par le bras\n+ Couper le courant\n- Lui jeter de l'eau\n! Le toucher ferait de toi une deuxième victime : coupe d'abord l'alimentation.\n\n? L'habilitation « B0 » permet…\n+ d'effectuer des travaux non électriques dans un environnement électrique BT\n- de réaliser des raccordements électriques\n- de consigner une installation HT\n! Le « 0 » désigne un non-électricien (ex. peintre, nettoyage dans un local électrique).\n\n? Quelle étape de la consignation utilise un VAT ?\n- La séparation\n- La condamnation\n+ La vérification d'absence de tension\n! Le VAT (vérificateur d'absence de tension) confirme que l'installation est bien hors tension.\n","---\nid: pse-ecrans-tms-bruit\nmatiere: pse\ntitre: Travail sur écran, TMS et bruit\nchapitre: Santé au travail\nresume: Aménager son poste informatique, prévenir les troubles musculosquelettiques et protéger son audition.\nmots-cles: travail sur écran, ergonomie, fatigue visuelle, TMS, troubles musculosquelettiques, canal carpien, posture, pauses, bruit, décibel, surdité, EPI, casque antibruit, 20-20-20\nordre: 3\n---\n\n## Le travail sur écran\n\nEffets possibles : ==fatigue visuelle== (yeux secs, picotements, maux de tête), douleurs de dos, de nuque et de poignets, stress.\n\n> [!astuce] Le poste bien réglé\n> - Écran à ==50-70 cm== des yeux (environ un bras tendu), le **haut de l'écran à hauteur des yeux** ou légèrement en dessous.\n> - Écran **perpendiculaire aux fenêtres** pour éviter reflets et éblouissement.\n> - Dos calé contre le dossier, **pieds à plat** (repose-pieds si besoin), coudes à 90°, **poignets droits**.\n> - Clavier et souris proches, dans l'alignement.\n> - **Pauses régulières** et règle des ==20-20-20== : toutes les 20 minutes, regarder à 6 mètres (20 pieds) pendant 20 secondes.\n\n## Les TMS (troubles musculosquelettiques)\n\n> [!definition] TMS\n> Des affections des **muscles, tendons et nerfs** dues à des sollicitations répétées : syndrome du ==canal carpien== (poignet), ==tendinite== (épaule, coude), ==lombalgie== (bas du dos).\n\n- Ce sont les ==premières maladies professionnelles== reconnues en France (près de 9 sur 10).\n- **Facteurs de risque** : gestes répétitifs, postures contraignantes (bras en l'air, dos penché), efforts, vibrations, froid, stress, manque de pauses.\n- **Prévention** : aménager le poste (ergonomie), alterner les tâches, utiliser des aides à la manutention, faire des pauses et des étirements, ==porter une charge dos droit, jambes fléchies, charge près du corps==.\n\n> [!exemple] Technicien CIEL\n> Câbler une baie réseau à genoux ou bras levés pendant des heures expose aux TMS : on utilise un tabouret, on organise les câbles à hauteur de travail et on fait des pauses.\n\n## Le bruit\n\n- Le niveau sonore se mesure en ==décibels== (dB(A)) avec un **sonomètre**. **+3 dB = intensité doublée** : 88 dB, c'est deux fois plus que 85 dB.\n- **Effets** : fatigue auditive, ==acouphènes== (sifflements), stress, troubles du sommeil et, à force, ==surdité irréversible==.\n\n| Exposition quotidienne (8 h) | Obligation de l'employeur |\n|---|---|\n| 80 dB(A) | informer, former, **mettre à disposition** des protections auditives |\n| 85 dB(A) | **port obligatoire** des protections, signalisation des zones |\n| 87 dB(A) | valeur limite à ne jamais dépasser (en tenant compte des protections) |\n\n- **Prévention** : réduire le bruit à la source (machines moins bruyantes, capotage), isoler ou éloigner les sources, limiter la durée d'exposition, puis ==EPI== : bouchons d'oreilles, casque antibruit.\n\n> [!attention] Musique au casque\n> Écouter fort et longtemps abîme l'oreille de façon définitive. Limite le volume (environ 60 % du maximum) et fais des pauses.\n\n> [!retenir]\n> Écran à un bras de distance, haut de l'écran à hauteur des yeux, pauses. TMS = 1re maladie professionnelle. Bruit : 80 dB(A) → protections disponibles, 85 dB(A) → port obligatoire.\n\n=== EXERCICES ===\n# calcul : Bruit et écran\n? À partir de combien de dB(A) le port des protections auditives est-il obligatoire ?\n= 85 dB(A)\n? Règle 20-20-20
