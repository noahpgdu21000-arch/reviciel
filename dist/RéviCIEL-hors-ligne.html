      if (mv) {
        const i = +mv.dataset.mv, j = i + +mv.dataset.d;
        [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
        drawOrder();
        const again = $('[data-mv="' + j + '"][data-d="' + mv.dataset.d + '"]', card) || $('[data-mv="' + j + '"]', card);
        if (again) again.focus();
        return;
      }
      const b = e.target.closest('[data-a]');
      if (!b) return;
      if (b.dataset.a === 'check') check();
      else if (b.dataset.a === 'show') show();
      else reset();
    });
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('input.blank, input.calc-in')) { e.preventDefault(); check(); } });
    return card;
  }

  /* ---------- Page d'exercices d'une fiche ---------- */
  App.route(/^\/fiche\/([^/]+)\/exercices$/, (v, [id]) => {
    const f = RC.fiche(id);
    if (!f) return App.notFound(v, 'Fiche introuvable');
    const s = RC.SUBJ[f.subject];
    App.setTitle('Exercices · ' + f.title);
    if (!f.exercises.length) {
      v.innerHTML = '<div class="card empty">' + icon('pen') + '<p>Pas encore d\'exercice pour cette fiche.</p><a class="btn" href="#/fiche/' + encodeURIComponent(f.id) + '">Retour à la fiche</a></div>';
      return;
    }
    const scores = {};
    let saved = false;
    v.innerHTML = '<div class="crumbs"><a href="#/">Accueil</a><span>›</span><a href="#/matiere/' + s.id + '">' + E(s.name) + '</a><span>›</span><a href="#/fiche/' + encodeURIComponent(f.id) + '">' + E(f.title) + '</a></div>' +
      '<div class="page-head" style="--c:' + s.color + '"><h1>Exercices</h1><p>' + E(f.title) + ' · ' + plural(f.exercises.length, 'exercice') + '</p></div>' +
      '<div class="callout astuce"><div class="callout-title">Comment ça marche</div><p>Réponds, puis clique sur <b>Vérifier</b> : les erreurs s\'affichent en rouge. Pas d\'idée ? Relis la fiche, ou affiche la correction puis recommence sans aide.</p></div>' +
      '<div id="exos" class="exo-list"></div><div class="card section" id="exo-total"></div>';
    const list = $('#exos', v);
    const total = () => {
      const keys = Object.keys(scores), pts = keys.reduce((a, k) => a + scores[k][0], 0), max = keys.reduce((a, k) => a + scores[k][1], 0);
      $('#exo-total', v).innerHTML = '<div class="row between"><b>' + keys.length + ' / ' + f.exercises.length + ' exercices vérifiés</b><span>' + (max ? Math.round((pts / max) * 100) + ' % de réussite' : '') + '</span></div>' + bar(max ? pts / max : 0, s.color) +
        '<div class="row" style="margin-top:12px"><a class="btn secondary" href="#/fiche/' + encodeURIComponent(f.id) + '">Relire la fiche</a>' + (f.quiz.length ? '<a class="btn ghost" href="#/fiche/' + encodeURIComponent(f.id) + '/quiz">Faire le quiz</a>' : '') + '</div>';
      if (!saved && keys.length === f.exercises.length) {
        saved = true;
        const r = Store.saveQuiz('x:' + f.id, pts, max);
        App.toast('Exercices terminés : ' + Math.round((pts / max) * 100) + ' %' + (r.attempts > 1 ? ' (meilleur : ' + r.best + ' %)' : ''));
      }
    };
    f.exercises.forEach((ex, i) => list.appendChild(exerciseCard(ex, i + 1, (pts, max) => { scores[i] = [pts, max]; total(); })));
    total();
  });

  /* ---------- Exercices d'une matière ---------- */
  App.route(/^\/matiere\/([\w-]+)\/exercices$/, (v, [sid]) => {
    const s = RC.SUBJ[sid];
    if (!s) return App.notFound(v);
    App.setTitle('Exercices · ' + s.name);
    const list = RC.subjectFiches(sid).filter((f) => f.exercises.length);
    const trainers = (window.TRAINERS || []).filter((t) => t.subject === sid);
    v.innerHTML = '<div class="crumbs"><a href="#/">Accueil</a><span>›</span><a href="#/entrainement">Exercices</a></div>' +
      '<div class="subject-head" style="--c:' + s.color + '">' + App.sIcon(s) + '<div><h1>Exercices · ' + E(s.name) + '</h1><p class="muted" style="margin:0">Textes à trous, remises en ordre, associations, classements et calculs.</p></div></div>' +
      (trainers.length ? '<div class="grid wide" style="margin-bottom:16px">' + trainers.map((t) => '<a class="card tool-card" style="--c:' + t.color + '" href="#/entrainement/' + t.id + '"><span class="s-icon">' + icon(t.icon) + '</span><div><h3>' + E(t.title) + ' <span class="badge info">infini</span></h3><p>' + E(t.desc) + '</p></div></a>').join('') + '</div>' : '') +
      (list.length ? '<div class="fiche-list">' + list.map((f, i) => {
        const q = Store.state.quiz['x:' + f.id];
        return '<a class="fiche-row" style="--c:' + s.color + '" href="#/fiche/' + encodeURIComponent(f.id) + '/exercices"><span class="num' + (q && q.best >= 80 ? ' done' : '') + '">' + (i + 1) + '</span><div class="body"><h3>' + E(f.title) + '</h3><p>' + f.exercises.map((x) => TYPES[x.type].name).join(' · ') + '</p>' +
          '<div class="badges"><span class="badge">' + plural(f.exercises.length, 'exercice') + '</span>' + (q ? '<span class="badge ' + (q.best >= 80 ? 'ok' : q.best >= 50 ? 'warn' : 'bad') + '">Meilleur : ' + q.best + ' %</span>' : '') + '</div></div>' + icon('right', 'chev') + '</a>';
      }).join('') + '</div>' : '<div class="card empty"><p>Pas encore d\'exercice dans cette matière.</p></div>');
  });

  App.exerciseTypes = TYPES;
})();

</script>
<script>
/* RéviCIEL — mode Contrôle (noté sur 20, chronométré, corrigé à la fin) et planning de révision avant un contrôle */
(function () {
  'use strict';
  const { E, icon, $, $$, bar, plural } = App;
  const md = (s) => RCMD.render(s).html;
  const noteOf = (score, total) => (total ? Math.round((score / total) * 40) / 2 : 0);
  const fmt = (n) => String(n).replace('.', ',');
  const mention = (n) => (n >= 16 ? 'Très bien !' : n >= 14 ? 'Bien' : n >= 12 ? 'Assez bien' : n >= 10 ? 'Moyenne atteinte' : 'À retravailler');
  const noteColor = (n) => (n >= 14 ? 'var(--success)' : n >= 10 ? 'var(--warning)' : 'var(--danger)');
  const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const parse = (d) => { const p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  const dateFr = (d) => d.split('-').reverse().join('/');
  const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  const dayLabel = (d) => { const t = Store.today(); if (d === t) return 'Aujourd\'hui'; if (d === Store.addDays(t, 1)) return 'Demain'; const s = JOURS[parse(d).getDay()]; return s.charAt(0).toUpperCase() + s.slice(1) + ' ' + dateFr(d).slice(0, 5); };
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const quizFiches = (sid) => RC.subjectFiches(sid).filter((f) => f.quiz.length);

  /* nom lisible d'un résultat de contrôle (clé « c:… » du journal des quiz) */
  App.ctrlLabel = (k) => {
    if (k.indexOf('c:p:') === 0) { const p = Store.state.plans.find((x) => x.id === k.slice(4)); return 'Contrôle blanc' + (p ? ' : ' + p.title : ''); }
    if (k.indexOf('c:s:') === 0) { const s = RC.SUBJ[k.slice(4)]; return 'Contrôle' + (s ? ' de ' + s.name : ''); }
    return 'Contrôle toutes matières';
  };

  /* ================= MODE CONTRÔLE ================= */
  App.route(/^\/controle$/, (v, _, params) => {
    App.setTitle('Mode contrôle');
    const plan = params.get('plan') ? Store.state.plans.find((p) => p.id === params.get('plan')) : null;
    const subs = RC.SUBJECTS.filter((s) => quizFiches(s.id).length);
    let sid = plan ? plan.subject : params.get('s') || '';
    let picked = plan ? plan.fiches.slice() : null;
    let count = Store.state.settings.ctrlCount || 20;
    let timed = Store.state.settings.ctrlTimed !== false;
    let iv = null;

    function history() {
      const log = (Store.state.quizLog || []).filter((x) => x.k.indexOf('c:') === 0).slice(-8).reverse();
      if (!log.length) return '';
      return '<div class="card section"><h2>Mes derniers contrôles</h2><ul class="list-plain">' + log.map((x) => {
        const n = noteOf(x.p, 100);
        return '<li class="row between"><span>' + E(App.ctrlLabel(x.k)) + ' <span class="small muted">· ' + dateFr(x.d) + ' · ' + x.n + ' questions</span></span><span class="badge ' + (n >= 14 ? 'ok' : n >= 10 ? 'warn' : 'bad') + '">' + fmt(n) + ' / 20</span></li>';
      }).join('') + '</ul></div>';
    }
    function pool() {
      if (!sid) return RC.questions;
      const ids = picked || quizFiches(sid).map((f) => f.id);
      return quizFiches(sid).filter((f) => ids.indexOf(f.id) !== -1).flatMap((f) => f.quiz);
    }
    function setup() {
      clearInterval(iv); App.setKeys(null);
      const fiches = sid ? quizFiches(sid) : [];
      v.innerHTML = '<div class="page-head"><h1>Mode contrôle</h1><p>Comme un vrai contrôle : pas de correction pendant l\'épreuve, un chrono, puis une <b>note sur 20</b> et le corrigé détaillé.</p></div>' +
        (plan ? '<div class="callout retenir"><div class="callout-title">' + icon('clock') + ' Contrôle blanc</div><p>Pour ton contrôle « ' + E(plan.title) + ' » du ' + dateFr(plan.date) + '.</p></div>' : '') +
        '<div class="card stack"><label class="field"><span><b>Matière</b></span><select class="input" id="c-sid"><option value="">Toutes les matières (mélange)</option>' +
        subs.map((s) => '<option value="' + s.id + '"' + (s.id === sid ? ' selected' : '') + '>' + E(s.name) + '</option>').join('') + '</select></label>' +
        (fiches.length ? '<div><div class="row between" style="margin-bottom:8px"><b>Chapitres</b><button class="btn ghost sm" id="c-all">Tout / rien</button></div><div class="check-list">' +
          fiches.map((f) => '<label class="check"><input type="checkbox" value="' + E(f.id) + '"' + (!picked || picked.indexOf(f.id) !== -1 ? ' checked' : '') + '> ' + E(f.title) + ' <span class="small muted">(' + f.quiz.length + ' q.)</span></label>').join('') + '</div></div>' : '') +
        '<div class="row" style="gap:24px"><div><b>Questions</b><div class="seg" id="c-count" style="margin-top:8px">' + [10, 20, 30].map((n) => '<button data-n="' + n + '" class="' + (n === count ? 'active' : '') + '">' + n + '</button>').join('') + '</div></div>' +
        '<div><b>Chrono</b><div class="seg" id="c-timed" style="margin-top:8px"><button data-t="1" class="' + (timed ? 'active' : '') + '">1 min par question</button><button data-t="0" class="' + (timed ? '' : 'active') + '">Sans chrono</button></div></div></div>' +
        '<div><button class="btn lg" id="c-go">' + icon('clock') + ' Commencer le contrôle</button> <span class="small muted" id="c-avail"></span></div></div>' + history();
      const upd = () => { const n = pool().length; $('#c-avail', v).textContent = plural(n, 'question disponible', 'questions disponibles') + (n && n < count ? ' : le contrôle en aura ' + n + '.' : ''); };
      $('#c-sid', v).onchange = (e) => { sid = e.target.value; picked = null; setup(); };
      const all = $('#c-all', v);
      if (all) all.onclick = () => { const boxes = $$('.check-list input', v); const on = !boxes.every((c) => c.checked); boxes.forEach((c) => { c.checked = on; }); picked = on ? null : []; upd(); };
      $$('.check-list input', v).forEach((c) => { c.onchange = () => { picked = $$('.check-list input', v).filter((x) => x.checked).map((x) => x.value); upd(); }; });
      $$('#c-count button', v).forEach((b) => { b.onclick = () => { count = +b.dataset.n; Store.setSetting('ctrlCount', count); $$('#c-count button', v).forEach((x) => x.classList.toggle('active', x === b)); upd(); }; });
      $$('#c-timed button', v).forEach((b) => { b.onclick = () => { timed = b.dataset.t === '1'; Store.setSetting('ctrlTimed', timed); $$('#c-timed button', v).forEach((x) => x.classList.toggle('active', x === b)); }; });
      $('#c-go', v).onclick = () => {
        const p = pool();
        if (p.length < 4) { App.toast('Pas assez de questions : choisis plus de chapitres.'); return; }
        const title = plan ? 'Contrôle blanc : ' + plan.title : sid ? 'Contrôle de ' + RC.SUBJ[sid].name : 'Contrôle toutes matières';
        run(RC.shuffle(p).slice(0, count), { title, key: plan ? 'c:p:' + plan.id : sid ? 'c:s:' + sid : 'c:mix', timed });
      };
      upd();
    }

    function run(questions, meta) {
      const qs = questions.map((q) => ({ q, order: RC.shuffle(q.options.map((_, k) => k)) }));
      const ans = qs.map(() => null);
      const total = meta.timed ? qs.length * 60 : null;
      const t0 = Date.now();
      let i = 0, over = false;
      App.setTitle('Contrôle en cours');
      const left = () => Math.max(0, total - Math.floor((Date.now() - t0) / 1000));
      function paint() {
        const { q, order } = qs[i], s = RC.SUBJ[q.fiche.subject];
        const nAns = ans.filter((a) => a != null).length;
        v.innerHTML = '<div class="session ctrl" style="--c:' + s.color + '">' +
          '<div class="ctrl-top card"><div style="flex:1;min-width:0"><b>' + E(meta.title) + '</b><div class="small muted">' + nAns + ' / ' + qs.length + ' réponses</div></div>' +
          (total != null ? '<span class="ctrl-timer" id="timer">' + icon('clock') + '<b>' + mmss(left()) + '</b></span>' : '') +
          '<button class="btn sm" data-finish>Rendre ma copie</button></div>' +
          '<div class="ctrl-grid" aria-label="Aller à une question">' + qs.map((x, k) => '<button data-go="' + k + '" class="' + (k === i ? 'cur ' : '') + (ans[k] != null ? 'done' : '') + '">' + (k + 1) + '</button>').join('') + '</div>' +
          '<div class="card"><div class="small muted" style="margin-bottom:6px">Question ' + (i + 1) + ' · ' + E(s.name) + '</div><div class="q-text md">' + md(q.q) + '</div><div class="options">' +
          order.map((k, n) => '<button class="option' + (ans[i] === k ? ' chosen' : '') + '" data-k="' + k + '" aria-pressed="' + (ans[i] === k) + '"><span class="key">' + 'ABCDEF'.charAt(n) + '</span><span>' + RCMD.inline(q.options[k]) + '</span></button>').join('') + '</div>' +
          '<div class="row between" style="margin-top:16px"><button class="btn secondary" data-prev' + (i ? '' : ' disabled') + '>' + icon('left') + ' Précédente</button>' +
          (i + 1 < qs.length ? '<button class="btn" data-next>Suivante ' + icon('right') + '</button>' : '<button class="btn" data-finish>Rendre ma copie</button>') + '</div></div></div>';
      }
      function go(k) { i = Math.max(0, Math.min(qs.length - 1, k)); paint(); window.scrollTo(0, 0); }
      v.onclick = (e) => {
        if (over) return;
        const b = e.target.closest('button');
        if (!b || !v.contains(b)) return;
        if (b.dataset.k != null) { ans[i] = +b.dataset.k; paint(); }
        else if (b.dataset.go != null) go(+b.dataset.go);
        else if (b.hasAttribute('data-prev')) go(i - 1);
        else if (b.hasAttribute('data-next')) go(i + 1);
        else if (b.hasAttribute('data-finish')) {
          const miss = ans.filter((a) => a == null).length;
          if (miss && !confirm('Il reste ' + plural(miss, 'question') + ' sans réponse. Rendre quand même ta copie ?')) return;
          finish(false);
        }
      };
      App.setKeys((e) => {
        const k = e.key.toLowerCase();
        const n = k.length === 1 ? 'abcd1234'.indexOf(k) : -1;
        if (n !== -1) { const btn = $$('.option', v)[n % 4]; if (btn) btn.click(); }
        else if (e.key === 'ArrowRight') go(i + 1);
        else if (e.key === 'ArrowLeft') go(i - 1);
      });
      if (total != null) {
        iv = setInterval(() => {
          const l = left(), el = $('#timer', v);
          if (el) { el.querySelector('b').textContent = mmss(l); el.classList.toggle('low', l <= 60); }
          if (l <= 0) finish(true);
        }, 1000);
      }
      function finish(timeout) {
        if (over) return;
        over = true; clearInterval(iv); App.setKeys(null); v.onclick = null;
        const score = qs.reduce((a, x, k) => a + (ans[k] === x.q.answer ? 1 : 0), 0);
        const note = noteOf(score, qs.length);
        Store.saveQuiz(meta.key, score, qs.length);
        const secs = Math.round((Date.now() - t0) / 1000);
        const byF = {};
        qs.forEach((x, k) => { const id = x.q.fiche.id; byF[id] = byF[id] || { f: x.q.fiche, ok: 0, n: 0 }; byF[id].n++; if (ans[k] === x.q.answer) byF[id].ok++; });
        const weak = Object.values(byF).filter((x) => x.ok / x.n < 0.7).sort((a, b) => a.ok / a.n - b.ok / b.n);
        App.setTitle('Résultat du contrôle');
        v.innerHTML = '<div class="session"><div class="card result">' + (timeout ? '<p class="badge warn">Temps écoulé : copie ramassée !</p>' : '') + '<h2>' + E(meta.title) + '</h2>' +
          '<div class="big" style="color:' + noteColor(note) + '">' + fmt(note) + '<span class="sur20"> / 20</span></div><p><b>' + mention(note) + '</b></p>' +
          '<div class="result-stats"><div><b>' + score + '/' + qs.length + '</b><span>bonnes réponses</span></div><div><b>' + mmss(secs) + '</b><span>temps passé</span></div><div><b>' + ans.filter((a) => a == null).length + '</b><span>sans réponse</span></div></div>' +
          '<div class="row" style="justify-content:center"><button class="btn" data-again>' + icon('refresh') + ' Nouveau contrôle</button>' + (plan ? '<a class="btn secondary" href="#/planning/' + plan.id + '">Mon planning</a>' : '') + '</div></div>' +
          (weak.length ? '<div class="card section"><h3>Chapitres à retravailler</h3><ul class="list-plain">' + weak.map((x) => '<li class="row between"><a href="#/fiche/' + encodeURIComponent(x.f.id) + '">' + E(x.f.title) + '</a><span class="badge bad">' + x.ok + '/' + x.n + '</span></li>').join('') + '</ul></div>' : '') +
          '<div class="card section"><h3>Corrigé</h3>' + qs.map((x, k) => {
            const a = ans[k], ok = a === x.q.answer;
            return '<div class="review-item"><div class="q"><b>' + (k + 1) + '.</b> ' + RCMD.inline(x.q.q.split('\n')[0]) + '</div>' +
              (a == null ? '<div class="small a-bad">Pas de réponse</div>' : '<div class="small ' + (ok ? 'a-ok' : 'a-bad') + '">' + (ok ? '✓ ' : '✗ ') + RCMD.inline(x.q.options[a]) + '</div>') +
              (ok ? '' : '<div class="small a-ok">✓ ' + RCMD.inline(x.q.options[x.q.answer]) + '</div>') +
              (x.q.explain ? '<div class="small muted">' + RCMD.inline(x.q.explain.replace(/\n/g, ' ')) + '</div>' : '') + '</div>';
          }).join('') + '</div></div>';
        $('[data-again]', v).onclick = setup;
        App.renderNav();
        window.scrollTo(0, 0);
      }
      paint();
    }

    setup();
    return () => { clearInterval(iv); };
  });

  /* ================= PLANNING AVANT UN CONTRÔLE ================= */
  function tasksOf(p) {
    const fiches = p.fiches.map((id) => RC.fiche(id)).filter(Boolean);
    const learn = [];
    fiches.forEach((f) => {
      learn.push({ key: 'lire:' + f.id, label: 'Lire la fiche « ' + f.title + ' »', href: '#/fiche/' + encodeURIComponent(f.id), auto: () => !!Store.state.read[f.id] });
      if (f.cards.length) learn.push({ key: 'cartes:' + f.id, label: 'Apprendre les cartes de « ' + f.title + ' »', href: '#/fiche/' + encodeURIComponent(f.id) + '/cartes', auto: () => f.cards.every((c) => !Store.isNew(c.id)) });
      if (f.quiz.length) learn.push({ key: 'quiz:' + f.id, label: 'Quiz de « ' + f.title + ' »', href: '#/fiche/' + encodeURIComponent(f.id) + '/quiz', auto: () => { const q = Store.state.quiz['f:' + f.id]; return !!q && q.date >= p.created; } });
      if (f.exercises && f.exercises.length) learn.push({ key: 'exos:' + f.id, label: 'Exercices de « ' + f.title + ' »', href: '#/fiche/' + encodeURIComponent(f.id) + '/exercices', auto: () => { const q = Store.state.quiz['x:' + f.id]; return !!q && q.date >= p.created; } });
    });
    const finalT = [
      { key: 'revoir', label: 'Revoir les cartes du jour', href: '#/reviser', auto: () => false },
      { key: 'controle', label: 'Contrôle blanc noté sur 20', href: '#/controle?plan=' + p.id, auto: () => (Store.state.quizLog || []).some((x) => x.k === 'c:p:' + p.id) }
    ];
    // jours de révision : de la création du planning à la veille du contrôle
    const start = p.created < p.date ? p.created : p.date;
    const nDays = Math.max(1, daysBetween(start, p.date));
    const days = [];
    for (let k = 0; k < nDays; k++) days.push({ date: Store.addDays(start, k), items: [] });
    if (nDays === 1) days[0].items = learn.concat(finalT);
    else {
      learn.forEach((t, k) => { days[Math.floor((k * (nDays - 1)) / learn.length)].items.push(t); });
      days[nDays - 1].items = days[nDays - 1].items.concat(finalT);
    }
    days.forEach((d) => d.items.forEach((t) => { t.done = !!(p.done && p.done[t.key]) || t.auto(); }));
    return days.filter((d) => d.items.length);
  }
  function planStatus(p) {
    const days = tasksOf(p), t = Store.today();
    const all = days.flatMap((d) => d.items);
    const done = all.filter((x) => x.done).length;
    const late = days.filter((d) => d.date < t).flatMap((d) => d.items).filter((x) => !x.done);
    const today = (days.find((d) => d.date === t) || { items: [] }).items;
    return { days, all, done, late, today, left: daysBetween(t, p.date) };
  }
  const whenTxt = (n) => (n < 0 ? 'passé' : n === 0 ? 'aujourd\'hui' : n === 1 ? 'demain' : 'dans ' + n + ' jours');
  function taskLi(p, t) {
    return '<li class="task' + (t.done ? ' done' : '') + '"><button class="tick" data-tick="' + E(t.key) + '" aria-label="' + (t.done ? 'Marquer à faire' : 'Marquer comme fait') + '">' + (t.done ? icon('check') : '') + '</button><a href="' + t.href + '">' + E(t.label) + '</a></li>';
  }

  /* carte « mon prochain contrôle » pour l'accueil */
  App.planHomeCard = () => {
    const t = Store.today();
    const next = Store.state.plans.filter((p) => p.date >= t).sort((a, b) => (a.date < b.date ? -1 : 1))[0];
    if (!next) return '';
    const st = planStatus(next), s = RC.SUBJ[next.subject] || RC.SUBJ.perso;
    const todo = st.late.concat(st.today).filter((x) => !x.done);
    return '<a class="card plan-card section" style="--c:' + s.color + '" href="#/planning/' + next.id + '"><span class="s-icon">' + icon('calendar') + '</span><div style="flex:1;min-width:0">' +
      '<div class="small muted">Contrôle ' + whenTxt(st.left) + ' · ' + E(s.name) + '</div><b>' + E(next.title) + '</b>' + bar(st.all.length ? st.done / st.all.length : 0, s.color) +
      '<div class="small" style="margin-top:6px">' + (todo.length ? 'Aujourd\'hui : ' + E(todo[0].label) + (todo.length > 1 ? ' (+' + (todo.length - 1) + ')' : '') : '✓ Rien d\'autre à faire aujourd\'hui') + '</div></div>' + icon('right', 'chev') + '</a>';
  };

  App.route(/^\/planning$/, (v) => {
    App.setTitle('Planning de révision');
    const t = Store.today();
    const subs = RC.SUBJECTS.filter((s) => RC.subjectFiches(s.id).length);
    let sid = subs[0] ? subs[0].id : '';
    function render() {
      const plans = Store.state.plans.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
      const coming = plans.filter((p) => p.date >= t), past = plans.filter((p) => p.date < t);
      const row = (p) => {
        const st = planStatus(p), s = RC.SUBJ[p.subject] || RC.SUBJ.perso;
        return '<a class="fiche-row" style="--c:' + s.color + '" href="#/planning/' + p.id + '"><span class="num">' + icon('calendar') + '</span><div class="body"><h3>' + E(p.title) + '</h3><p>' + E(s.name) + ' · ' + dateFr(p.date) + ' (' + whenTxt(st.left) + ')</p>' +
          '<div class="badges"><span class="badge ' + (st.done === st.all.length ? 'ok' : '') + '">' + st.done + ' / ' + st.all.length + ' tâches</span>' + (st.late.length && st.left >= 0 ? '<span class="badge warn">' + st.late.length + ' en retard</span>' : '') + '</div></div>' + icon('right', 'chev') + '</a>';
      };
      const fiches = RC.subjectFiches(sid);
      v.innerHTML = '<div class="page-head"><h1>Planning de révision</h1><p>Indique la date de ton contrôle et les chapitres : RéviCIEL te dit quoi réviser chaque jour, en petites étapes, jusqu\'au contrôle blanc la veille.</p></div>' +
        (coming.length ? '<section class="section"><div class="section-head"><h2>Mes prochains contrôles</h2></div><div class="fiche-list">' + coming.map(row).join('') + '</div></section>' : '') +
        '<section class="section"><div class="card stack" id="new-plan"><h2 style="margin:0">' + icon('plus') + ' Ajouter un contrôle</h2>' +
        '<div class="pc-grid" style="margin:0"><label class="field"><span>Matière</span><select class="input" id="p-sid">' + subs.map((s) => '<option value="' + s.id + '"' + (s.id === sid ? ' selected' : '') + '>' + E(s.name) + '</option>').join('') + '</select></label>' +
        '<label class="field"><span>Date du contrôle</span><input class="input" type="date" id="p-date" min="' + t + '" value="' + Store.addDays(t, 7) + '"></label>' +
        '<label class="field"><span>Nom (facultatif)</span><input class="input" id="p-title" maxlength="60" placeholder="Contrôle de ' + E((RC.SUBJ[sid] || {}).name || '') + '"></label></div>' +
        '<div><b>Chapitres au programme du contrôle</b><div class="check-list" style="margin-top:8px">' + fiches.map((f) => '<label class="check"><input type="checkbox" value="' + E(f.id) + '"> ' + E(f.title) + '</label>').join('') + '</div></div>' +
        '<div><button class="btn" id="p-add">' + icon('calendar') + ' Créer mon planning</button></div></div></section>' +
        (past.length ? '<section class="section"><div class="section-head"><h2>Contrôles passés</h2></div><div class="fiche-list">' + past.reverse().map(row).join('') + '</div></section>' : '');
      $('#p-sid', v).onchange = (e) => { sid = e.target.value; render(); };
      $('#p-add', v).onclick = () => {
        const ids = $$('.check-list input', v).filter((c) => c.checked).map((c) => c.value);
        const date = $('#p-date', v).value;
        if (!ids.length) { App.toast('Coche au moins un chapitre.'); return; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date < t) { App.toast('Choisis une date à partir d\'aujourd\'hui.'); return; }
        const title = $('#p-title', v).value.trim() || 'Contrôle de ' + RC.SUBJ[sid].name;
        const p = Store.addPlan({ id: 'pl' + Date.now().toString(36), title, subject: sid, fiches: ids, date, created: t, done: {} });
        App.toast('Planning créé !');
        location.hash = '#/planning/' + p.id;
      };
    }
    render();
  });

  App.route(/^\/planning\/([\w-]+)$/, (v, [id]) => {
    const p = Store.state.plans.find((x) => x.id === id);
    if (!p) return App.notFound(v, 'Planning introuvable');
    App.setTitle(p.title);
    function render() {
      const st = planStatus(p), s = RC.SUBJ[p.subject] || RC.SUBJ.perso, t = Store.today();
      v.innerHTML = '<div class="crumbs"><a href="#/">Accueil</a><span>›</span><a href="#/planning">Planning</a><span>›</span><span>' + E(p.title) + '</span></div>' +
        '<div class="page-head"><h1>' + E(p.title) + '</h1><p>' + E(s.name) + ' · le ' + JOURS[parse(p.date).getDay()] + ' ' + dateFr(p.date) + ' (' + whenTxt(st.left) + ')</p></div>' +
        '<div class="card">' + bar(st.all.length ? st.done / st.all.length : 0, s.color) + '<div class="row between small" style="margin-top:8px"><span>' + st.done + ' / ' + st.all.length + ' tâches faites</span><span>Les tâches se cochent toutes seules quand tu les fais dans l\'appli.</span></div></div>' +
        (st.late.length && st.left >= 0 ? '<div class="card section plan-day late"><h3>' + icon('clock') + ' En retard</h3><ul class="tasks">' + st.late.map((x) => taskLi(p, x)).join('') + '</ul></div>' : '') +
        st.days.map((d) => '<div class="card section plan-day' + (d.date === t ? ' today' : d.date < t ? ' past' : '') + '"><h3>' + dayLabel(d.date) + '</h3><ul class="tasks">' + d.items.map((x) => taskLi(p, x)).join('') + '</ul></div>').join('') +
        '<div class="card section plan-day exam"><h3>' + icon('star') + ' ' + dayLabel(p.date) + ' : le contrôle !</h3><p class="small muted">Dors bien la veille et relis seulement tes cartes le matin.</p></div>' +
        '<div class="row section"><a class="btn secondary" href="#/controle?plan=' + p.id + '">' + icon('clock') + ' Contrôle blanc</a><button class="btn ghost" data-del>' + icon('trash') + ' Supprimer ce planning</button></div>';
    }
    v.addEventListener('click', (e) => {
      const tk = e.target.closest('[data-tick]');
      if (tk) { Store.togglePlanTask(p.id, tk.dataset.tick); render(); return; }
      if (e.target.closest('[data-del]') && confirm('Supprimer le planning « ' + p.title + ' » ?')) { Store.removePlan(p.id); location.hash = '#/planning'; }
    });
    render();
  });
})();

</script>
<script>
/* RéviCIEL — compte en ligne (Firebase) : connexion par e-mail, synchronisation de la progression,
   des fiches perso et des réseaux du mode libre entre tous les appareils. */
(function () {
  'use strict';
  const { E, icon, $ } = App;
  const CFG = {
    apiKey: 'AIzaSyAGKF9_kHy-QWg_NL0YQw9BBlOLGuNjjfA',
    authDomain: 'reviciel.firebaseapp.com',
    projectId: 'reviciel',
    storageBucket: 'reviciel.firebasestorage.app',
    messagingSenderId: '261030889818',
    appId: '1:261030889818:web:2cc1e2519ad51b5cf9cb63'
  };
  const SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const FLAG = 'reviciel.compte';
  const ls = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: (k) => { try { localStorage.removeItem(k); } catch (e) { /* rien */ } }
  };
  const ERR = {
    'auth/email-already-in-use': 'Cette adresse e-mail a déjà un compte : connecte-toi plutôt.',
    'auth/invalid-email': 'Adresse e-mail invalide.',
    'auth/missing-email': 'Saisis ton adresse e-mail.',
    'auth/weak-password': 'Mot de passe trop court : 6 caractères minimum.',
    'auth/missing-password': 'Saisis ton mot de passe.',
    'auth/invalid-credential': 'E-mail ou mot de passe incorrect.',
    'auth/invalid-login-credentials': 'E-mail ou mot de passe incorrect.',
    'auth/wrong-password': 'E-mail ou mot de passe incorrect.',
    'auth/user-not-found': 'Aucun compte avec cette adresse.',
    'auth/too-many-requests': 'Trop d\'essais : attends quelques minutes avant de recommencer.',
    'auth/network-request-failed': 'Pas de connexion Internet.',
    'auth/requires-recent-login': 'Par sécurité, reconnecte-toi puis recommence.',
    'permission-denied': 'Accès refusé.',
    unavailable: 'Serveur injoignable : vérifie ta connexion Internet.'
  };
  const msg = (e) => ERR[e && e.code] || (e && e.message) || 'Erreur inconnue.';

  let fb = null, loading = null, user = null, admin = false, ready = false;
  let syncing = false, again = false, pushT = null, lastSync = null, status = 'idle', lastError = '', atelierTooBig = false;
  const lastPushed = {};
  const subs = new Set();
  const emit = () => { subs.forEach((fn) => { try { fn(); } catch (e) { /* rien */ } }); badge(); };

  /* ---------- Chargement de Firebase (seulement si on en a besoin) ---------- */
  function load() {
    if (fb) return Promise.resolve(fb);
    if (loading) return loading;
    loading = Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')])
      .then(([appM, A, F]) => {
        const app = appM.initializeApp(CFG);
        const auth = A.getAuth(app);
        auth.languageCode = 'fr';
        const db = F.getFirestore(app);
        fb = { app, auth, db, A, F };
        return new Promise((resolve) => {
          let first = true;
          A.onAuthStateChanged(auth, (u) => { onUser(u); if (first) { first = false; ready = true; resolve(fb); } });
        });
      })
      .catch((e) => { loading = null; console.warn(e); throw new Error('Impossible de joindre le service de comptes : vérifie ta connexion Internet.'); });
    return loading;
  }

  async function onUser(u) {
    const was = user && user.uid;
    user = u; admin = false;
    if (u) {
      ls.set(FLAG, '1');
      emit();
      try { admin = (await fb.F.getDoc(fb.F.doc(fb.db, 'admins', u.uid))).exists(); } catch (e) { admin = false; }
      if (was !== u.uid) await sync();
    } else {
      ls.del(FLAG);
      Object.keys(lastPushed).forEach((k) => delete lastPushed[k]);
      status = 'idle';
    }
    emit();
  }

  /* ---------- Fusion des données de deux appareils ---------- */
  const clone = (o) => JSON.parse(JSON.stringify(o));
  function mergeProgress(L, R) {
    if (!R) return clone(L);
    const out = clone(L);
    out.read = Object.assign({}, R.read || {}, L.read || {});
    out.fav = Object.assign({}, R.fav || {}, L.fav || {});
    out.quiz = Object.assign({}, R.quiz || {});
    Object.keys(L.quiz || {}).forEach((k) => {
      const a = L.quiz[k], b = out.quiz[k];
      if (!b) { out.quiz[k] = a; return; }
      const newer = (a.date || '') >= (b.date || '') ? a : b;
      out.quiz[k] = Object.assign({}, newer, { best: Math.max(a.best || 0, b.best || 0), attempts: Math.max(a.attempts || 0, b.attempts || 0) });
    });
    out.cards = Object.assign({}, R.cards || {});
    Object.keys(L.cards || {}).forEach((k) => {
      const a = L.cards[k], b = out.cards[k];
      if (!b || (a.reps || 0) > (b.reps || 0) || ((a.reps || 0) === (b.reps || 0) && (a.seen || '') >= (b.seen || ''))) out.cards[k] = a;
    });
    out.trainers = Object.assign({}, R.trainers || {});
    Object.keys(L.trainers || {}).forEach((k) => {
      const a = L.trainers[k], b = out.trainers[k] || {};
      out.trainers[k] = Object.assign({}, (a.total || 0) >= (b.total || 0) ? a : b, { best: Math.max(a.best || 0, b.best || 0) });
    });
    out.labs = Object.assign({}, R.labs || {});
    Object.keys(L.labs || {}).forEach((k) => {
      const a = L.labs[k], b = out.labs[k];
      if (!b) { out.labs[k] = a; return; }
      const ga = a.goals || [], gb = b.goals || [], g = [];
      for (let i = 0; i < Math.max(ga.length, gb.length); i++) g.push(!!(ga[i] || gb[i]));
      out.labs[k] = { goals: g, done: !!(a.done || b.done) };
    });
    out.activity = Object.assign({}, R.activity || {});
    Object.keys(L.activity || {}).forEach((k) => { out.activity[k] = Math.max(L.activity[k] || 0, out.activity[k] || 0); });
    const seen = new Set();
    out.quizLog = (R.quizLog || []).concat(L.quizLog || []).filter((x) => { const id = x.k + '|' + x.d + '|' + x.p + '|' + x.n; if (seen.has(id)) return false; seen.add(id); return true; })
      .sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0)).slice(-300);
    out.plansDel = Object.assign({}, R.plansDel || {}, L.plansDel || {});
    const plans = {};
    (R.plans || []).concat(L.plans || []).forEach((p) => { const c = plans[p.id]; plans[p.id] = c ? Object.assign({}, p, { done: Object.assign({}, c.done || {}, p.done || {}) }) : p; });
    out.plans = Object.values(plans).filter((p) => !out.plansDel[p.id]);
    const sa = L.streak || {}, sb = R.streak || {};
    out.streak = (sa.last || '') > (sb.last || '') ? sa : (sb.last || '') > (sa.last || '') ? sb : { last: sa.last || null, count: Math.max(sa.count || 0, sb.count || 0) };
    out.last = L.last || R.last || null;
    out.settings = L.settings;
    return out;
  }
  function mergeFiches(L, R, dl, dr) {
    const del = Object.assign({}, dr || {});
    Object.keys(dl || {}).forEach((k) => { del[k] = Math.max(del[k] || 0, dl[k]); });
    const by = {}, order = [];
    (L || []).concat(R || []).forEach((f) => {
      if (!f || typeof f.id !== 'string' || typeof f.src !== 'string') return;
      const c = by[f.id];
      if (!c) order.push(f.id);
      if (!c || (f.updated || 0) > (c.updated || 0)) by[f.id] = f;
    });
    return { list: order.map((id) => by[id]).filter((f) => !(del[f.id] && del[f.id] >= (f.updated || 0))), del };
  }
  const ATL_IDX = 'reviciel.atelier.index', ATL_P = 'reviciel.atelier.p.', ATL_DEL = 'reviciel.atelier.supprimes';
  function localAtelier() {
    let index = [], del = {};
    try { index = JSON.parse(ls.get(ATL_IDX) || '[]'); } catch (e) { index = []; }
    try { del = JSON.parse(ls.get(ATL_DEL) || '{}'); } catch (e) { del = {}; }
    const projets = {};
    (Array.isArray(index) ? index : []).forEach((p) => {
      try { const d = JSON.parse(ls.get(ATL_P + p.id) || 'null'); if (d) { (d.devices || []).forEach((x) => { delete x.screen; delete x.history; }); projets[p.id] = d; } } catch (e) { /* projet illisible */ }
    });
    return { index: Array.isArray(index) ? index : [], projets, del };
  }
  function mergeAtelier(L, R) {
    const del = Object.assign({}, R.del || {});
    Object.keys(L.del || {}).forEach((k) => { del[k] = Math.max(del[k] || 0, L.del[k]); });
    const by = {};
    [['R', R], ['L', L]].forEach(([from, src]) => (src.index || []).forEach((p) => {
      const c = by[p.id];
      if ((src.projets || {})[p.id] && (!c || (p.updated || 0) > (c.p.updated || 0))) by[p.id] = { p, data: src.projets[p.id], from };
    }));
    const keep = Object.values(by).filter((x) => !(del[x.p.id] && del[x.p.id] >= (x.p.updated || 0))).sort((a, b) => (b.p.updated || 0) - (a.p.updated || 0));
    return { keep, out: { index: keep.map((x) => x.p), projets: Object.fromEntries(keep.map((x) => [x.p.id, x.data])), del } };
  }
  function applyAtelier(m) {
    const ids = new Set(m.keep.map((x) => x.p.id));
    let idx = [];
    try { idx = JSON.parse(ls.get(ATL_IDX) || '[]'); } catch (e) { idx = []; }
    (Array.isArray(idx) ? idx : []).forEach((p) => { if (!ids.has(p.id)) ls.del(ATL_P + p.id); });
    m.keep.forEach((x) => { if (x.from === 'R') ls.set(ATL_P + x.p.id, JSON.stringify(x.data)); });
    ls.set(ATL_IDX, JSON.stringify(m.out.index));
    ls.set(ATL_DEL, JSON.stringify(m.out.del));
  }

  /* ---------- Synchronisation : on récupère, on fusionne, on renvoie ---------- */
  async function sync() {
    if (!fb || !user) return;
    if (syncing) { again = true; return; }
    syncing = true; status = 'sync'; emit();
    try {
      const F = fb.F, ref = (n) => F.doc(fb.db, 'users', user.uid, 'donnees', n);
      const snaps = await Promise.all(['progression', 'fiches', 'atelier'].map((n) => F.getDoc(ref(n))));
      const remote = snaps.map((s) => { if (!s.exists()) return null; try { return JSON.parse(s.data().json || 'null'); } catch (e) { return null; } });
      const raw = snaps.map((s) => (s.exists() ? s.data().json : null));
      const before = JSON.stringify([Store.state, Store.userFiches]);
      const mP = mergeProgress(Store.state, remote[0]);
      const mF = mergeFiches(Store.userFiches, remote[1] && remote[1].list, Store.deletedFiches, remote[1] && remote[1].del);
      const mA = mergeAtelier(localAtelier(), remote[2] || {});
      Store.setAll(mP, mF.list, mF.del);
      applyAtelier(mA);
      const changedHere = before !== JSON.stringify([Store.state, Store.userFiches]);
      const out = { progression: JSON.stringify(Store.state), fiches: JSON.stringify({ list: mF.list, del: mF.del }), atelier: JSON.stringify(mA.out) };
      atelierTooBig = out.atelier.length > 900000;
      if (out.fiches.length > 900000) throw new Error('Tes fiches perso sont trop volumineuses pour être synchronisées (plus de 900 Ko).');
      await Promise.all(['progression', 'fiches', 'atelier'].map((n, k) => {
        if (n === 'atelier' && atelierTooBig) return null;
        if (raw[k] === out[n] || lastPushed[n] === out[n]) { lastPushed[n] = out[n]; return null; }
        return F.setDoc(ref(n), { json: out[n], maj: F.serverTimestamp() }).then(() => { lastPushed[n] = out[n]; });
      }));
      lastSync = new Date(); status = 'ok'; lastError = '';
      if (changedHere) {
        RC.load(); App.renderNav();
        const path = (location.hash.slice(1) || '/').split('?')[0];
        if (/^\/($|progression|mes-fiches|compte|planning|matiere\/|favoris|labo$)/.test(path)) App.navigate();
      }
    } catch (e) {
      status = 'err'; lastError = msg(e); console.warn(e);
    }
    syncing = false; emit();
    if (again) { again = false; schedule(1000); }
  }
  function schedule(ms) {
    if (!user) return;
    clearTimeout(pushT);
    pushT = setTimeout(sync, ms == null ? 5000 : ms);
  }
  Store.subscribe(() => schedule());
  window.addEventListener('reviciel-change', () => schedule());
  document.addEventListener('visibilitychange', () => { if (user) { if (document.hidden) { if (pushT) { clearTimeout(pushT); sync(); } } else schedule(800); } });
  window.addEventListener('online', () => { if (!fb && ls.get(FLAG)) load().catch(() => { /* toujours hors ligne */ }); else schedule(500); });

  /* ---------- Actions du compte ---------- */
  const PSEUDO_RE = /^[\p{L}\p{N} ._-]{2,24}$/u;
  async function signUp(pseudo, email, pass) {
    pseudo = pseudo.trim();
    if (!PSEUDO_RE.test(pseudo)) throw new Error('Pseudo : 2 à 24 lettres, chiffres, espaces, points ou tirets.');
    const f = await load();
    const cred = await f.A.createUserWithEmailAndPassword(f.auth, email.trim(), pass);
    await f.A.updateProfile(cred.user, { displayName: pseudo });
    user = f.auth.currentUser;
    emit();
  }
  async function signIn(email, pass) { const f = await load(); await f.A.signInWithEmailAndPassword(f.auth, email.trim(), pass); }
  async function resetPassword(email) { const f = await load(); await f.A.sendPasswordResetEmail(f.auth, email.trim()); }
  async function signOut(wipe) {
    const f = await load();
    clearTimeout(pushT);
    if (user) { try { await sync(); } catch (e) { /* on se déconnecte quand même */ } }
    await f.A.signOut(f.auth);
    if (wipe) {
      Store.resetProgress();
      Store.setAll(null, [], {});
      let idx = [];
      try { idx = JSON.parse(ls.get(ATL_IDX) || '[]'); } catch (e) { idx = []; }
      (Array.isArray(idx) ? idx : []).forEach((p) => ls.del(ATL_P + p.id));
      [ATL_IDX, ATL_DEL, 'reviciel.atelier.courant'].forEach(ls.del);
      RC.load(); App.renderNav();
    }
  }
  async function setPseudo(p) {
    p = p.trim();
    if (!PSEUDO_RE.test(p)) throw new Error('Pseudo : 2 à 24 lettres, chiffres, espaces, points ou tirets.');
    await fb.A.updateProfile(fb.auth.currentUser, { displayName: p });
    user = fb.auth.currentUser; emit();
  }
  async function deleteAccount(pass) {
    const f = await load(), A = f.A, F = f.F, u = f.auth.currentUser;
    await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, pass));
    const mine = await F.getDocs(F.query(F.collection(f.db, 'partages'), F.where('uid', '==', u.uid)));
    await Promise.all(mine.docs.map((d) => F.deleteDoc(d.ref)));
    await Promise.all(['progression', 'fiches', 'atelier'].map((n) => F.deleteDoc(F.doc(f.db, 'users', u.uid, 'donnees', n))));
    await A.deleteUser(u);
  }

  /* ---------- Bouton du compte dans la barre du haut ---------- */
  function badge() {
    const b = document.getElementById('account-btn');
    if (!b) return;
    b.classList.toggle('signed', !!user);
    b.setAttribute('aria-label', user ? 'Mon compte : ' + (user.displayName || 'connecté') : 'Se connecter');
    b.title = user ? 'Connecté : ' + (user.displayName || '') : 'Se connecter';
  }

  /* ---------- Page « Mon compte » ---------- */
  const ago = (d) => { if (!d) return 'jamais'; const s = Math.round((Date.now() - d) / 1000); return s < 60 ? 'à l\'instant' : s < 3600 ? 'il y a ' + Math.round(s / 60) + ' min' : 'à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };
  App.route(/^\/compte$/, (v, _, params) => {
    App.setTitle('Mon compte');
    const back = params.get('retour');
    let mode = 'login', busy = false;
    function render() {
      if (!ready) {
        v.innerHTML = '<div class="page-head"><h1>Mon compte</h1></div><div class="card empty"><p>Connexion au service de comptes…</p></div>';
        return;
      }
      if (!user) {
        v.innerHTML = '<div class="page-head"><h1>Mon compte</h1><p>Un compte gratuit te permet de retrouver ta progression, tes fiches perso et tes réseaux du labo sur <b>n\'importe quel PC, ton téléphone et le site web</b>, et de partager des fiches avec les autres élèves.</p></div>' +
          '<div class="card auth-card"><div class="seg" id="auth-mode"><button data-m="login" class="' + (mode === 'login' ? 'active' : '') + '">Se connecter</button><button data-m="signup" class="' + (mode === 'signup' ? 'active' : '') + '">Créer un compte</button></div>' +
          '<form id="auth-form" class="stack" novalidate>' +
          (mode === 'signup' ? '<label class="field"><span>Pseudo (visible si tu partages une fiche)</span><input class="input" name="pseudo" maxlength="24" autocomplete="nickname" placeholder="Ex. : Noah_CIEL" required></label>' : '') +
          '<label class="field"><span>Adresse e-mail</span><input class="input" name="email" type="email" autocomplete="email" inputmode="email" required></label>' +
          '<label class="field"><span>Mot de passe' + (mode === 'signup' ? ' (6 caractères minimum)' : '') + '</span><input class="input" name="pass" type="password" autocomplete="' + (mode === 'signup' ? 'new-password' : 'current-password') + '" required minlength="6"></label>' +
          (mode === 'signup' ? '<label class="field"><span>Confirme le mot de passe</span><input class="input" name="pass2" type="password" autocomplete="new-password" required></label>' : '') +
          '<div class="row"><button class="btn lg" type="submit">' + icon('user') + ' ' + (mode === 'signup' ? 'Créer mon compte' : 'Me connecter') + '</button>' +
          (mode === 'login' ? '<button class="btn ghost sm" type="button" id="forgot">Mot de passe oublié ?</button>' : '') + '</div><p class="small" id="auth-msg" role="alert"></p></form>' +
          '<p class="small muted">Ton adresse e-mail n\'est jamais montrée aux autres élèves. Choisis un pseudo, pas ton nom complet. Tes données servent uniquement à faire marcher RéviCIEL.</p></div>';
        const form = $('#auth-form', v), say = (t, ok) => { const m = $('#auth-msg', v); m.textContent = t; m.className = 'small ' + (ok ? 'status-ok' : 'status-warn'); };
        $('#auth-mode', v).onclick = (e) => { const b = e.target.closest('[data-m]'); if (b) { mode = b.dataset.m; render(); } };
        const fg = $('#forgot', v);
        if (fg) fg.onclick = async () => {
          const email = form.email.value.trim();
          if (!email) { say('Saisis d\'abord ton adresse e-mail, puis clique à nouveau.'); return; }
          try { await resetPassword(email); say('Un e-mail pour choisir un nouveau mot de passe vient d\'être envoyé (regarde aussi dans les spams).', true); } catch (err) { say(msg(err)); }
        };
        form.onsubmit = async (e) => {
          e.preventDefault();
          if (busy) return;
          const email = form.email.value, pass = form.pass.value;
          if (mode === 'signup' && pass !== form.pass2.value) { say('Les deux mots de passe ne sont pas identiques.'); return; }
          busy = true; say('Un instant…', true);
          try {
            if (mode === 'signup') await signUp(form.pseudo.value, email, pass); else await signIn(email, pass);
            App.toast(mode === 'signup' ? 'Compte créé ! Ta progression est maintenant sauvegardée en ligne.' : 'Connecté ! Synchronisation de tes données…');
            if (back) { location.hash = '#/' + back; return; }
          } catch (err) { say(msg(err)); }
          busy = false;
          render();
        };
        return;
      }
      const nf = Store.userFiches.length;
      let nr = 0;
      try { nr = JSON.parse(ls.get(ATL_IDX) || '[]').length; } catch (e) { nr = 0; }
      const st = status === 'sync' ? '<span class="status-ok">Synchronisation…</span>' : status === 'err' ? '<span class="status-warn">Problème : ' + E(lastError) + '</span>' : '<span class="status-ok">✓ Synchronisé ' + ago(lastSync) + '</span>';
      v.innerHTML = '<div class="page-head"><h1>Mon compte</h1></div>' +
        '<div class="card account-card"><span class="avatar">' + E((user.displayName || '?').charAt(0).toUpperCase()) + '</span><div style="flex:1;min-width:0"><b>' + E(user.displayName || 'Sans pseudo') + '</b>' + (admin ? ' <span class="badge violet">Administrateur</span>' : '') +
        '<div class="small muted">' + E(user.email || '') + '</div><div class="small">' + st + '</div></div></div>' +
        '<div class="card section"><h2>Ce qui est synchronisé</h2><ul class="list-plain">' +
        '<li class="row between"><span>' + icon('chart') + ' Progression (cartes, quiz, contrôles, labs, planning)</span><span class="badge ok">' + icon('check') + '</span></li>' +
        '<li class="row between"><span>' + icon('pen') + ' Mes fiches perso</span><span class="badge ok">' + nf + '</span></li>' +
        '<li class="row between"><span>' + icon('network') + ' Réseaux du mode libre</span><span class="badge ' + (atelierTooBig ? 'warn">trop gros' : 'ok">' + nr) + '</span></li></ul>' +
        '<p class="small muted">La synchronisation est automatique quelques secondes après chaque changement, et à chaque ouverture de l\'appli. Hors connexion, tout reste enregistré sur l\'appareil et part au retour d\'Internet.</p>' +
        '<div class="row"><button class="btn" data-a="sync">' + icon('refresh') + ' Synchroniser maintenant</button><a class="btn secondary" href="#/partage">' + icon('share') + ' Fiches partagées</a></div></div>' +
        '<div class="card section"><h2>Mon pseudo</h2><div class="row"><input class="input" id="pseudo" maxlength="24" value="' + E(user.displayName || '') + '" style="flex:1;min-width:160px"><button class="btn secondary" data-a="pseudo">Enregistrer</button></div></div>' +
        '<div class="card section"><h2>Se déconnecter</h2><p class="small muted">Sur un ordinateur du lycée, coche la case pour effacer tes données de cet appareil (elles restent dans ton compte).</p>' +
        '<label class="check"><input type="checkbox" id="wipe"> Effacer aussi mes données de cet appareil</label><div class="row" style="margin-top:10px"><button class="btn secondary" data-a="logout">Se déconnecter</button></div></div>' +
        '<div class="card section"><h2>Supprimer mon compte</h2><p class="small muted">Efface ton compte, tes données en ligne et les fiches que tu as partagées. Ce qui est sur cet appareil reste.</p><button class="btn danger" data-a="delete">' + icon('trash') + ' Supprimer mon compte</button></div>';
    }
    v.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-a]');
      if (!b || busy) return;
      const a = b.dataset.a;
      try {
        if (a === 'sync') { await sync(); App.toast(status === 'err' ? lastError : 'Synchronisé !'); }
        else if (a === 'pseudo') { await setPseudo($('#pseudo', v).value); App.toast('Pseudo enregistré.'); }
        else if (a === 'logout') { busy = true; await signOut($('#wipe', v).checked); busy = false; App.toast('Déconnecté.'); }
        else if (a === 'delete') {
          const pass = prompt('Pour supprimer ton compte, retape ton mot de passe :');
          if (!pass) return;
          if (!confirm('Supprimer définitivement ton compte et tes données en ligne ? Impossible de revenir en arrière.')) return;
          busy = true; await deleteAccount(pass); busy = false; App.toast('Compte supprimé.');
        }
      } catch (err) { busy = false; App.toast(msg(err), { duration: 6000 }); }
      render();
    });
    subs.add(render);
    render();
    load().then(render).catch((err) => { v.innerHTML = '<div class="page-head"><h1>Mon compte</h1></div><div class="card empty">' + icon('cloud') + '<p>' + E(err.message) + '</p><button class="btn" onclick="location.reload()">Réessayer</button></div>'; });
    return () => subs.delete(render);
  });

  /* ---------- Démarrage : reprise de la session et synchronisation ---------- */
  window.Cloud = {
    load, sync, msg, _test: { mergeProgress, mergeFiches, mergeAtelier },
    get user() { return user; }, get admin() { return admin; }, get ready() { return ready; }, get db() { return fb && fb.db; }, get F() { return fb && fb.F; },
    onChange: (fn) => { subs.add(fn); return () => subs.delete(fn); }
  };
  badge();
  if (ls.get(FLAG) && location.protocol !== 'file:') setTimeout(() => { load().catch(() => { /* hors connexion : on réessaiera */ }); }, 1200);
})();

</script>
<script>
/* RéviCIEL — onglet Partage : les élèves connectés publient leurs fiches perso et récupèrent celles des autres. */
(function () {
  'use strict';
  const { E, icon, $, $$, plural } = App;
  const MAX = 60000;
  const dateFr = (ts) => (ts && ts.toDate ? ts.toDate().toLocaleDateString('fr-FR') : '');
  const C = () => window.Cloud;

  function parse(src) { try { return RCMD.parseFiche(src); } catch (e) { return null; } }
  function addToMine(d) {
    const id = 'perso-' + Date.now().toString(36);
    const src = String(d.src).replace(/\r\n?/g, '\n').replace(/^---\n([\s\S]*?)\n---/, (m, head) => '---\n' + head.split('\n').filter((l) => !/^\s*id\s*:/i.test(l)).concat(['id: ' + id]).join('\n') + '\n---');
    Store.upsertUserFiche(id, src);
    RC.load(); App.renderNav();
    const F = C().F;
    F.updateDoc(F.doc(C().db, 'partages', d.id), { imports: F.increment(1) }).catch(() => { /* compteur facultatif */ });
    return id;
  }
  function needAccount(v, title) {
    v.innerHTML = '<div class="page-head"><h1>' + E(title) + '</h1><p>Les élèves partagent ici leurs fiches perso : tu peux les lire et les ajouter à tes fiches en un clic.</p></div>' +
      '<div class="card empty">' + icon('share') + '<h2>Connecte-toi pour voir les fiches partagées</h2><p>Le partage est réservé aux élèves qui ont un compte RéviCIEL (gratuit).</p><a class="btn" href="#/compte?retour=partage">' + icon('user') + ' Se connecter ou créer un compte</a></div>';
  }
  function loadingView(v, title) { v.innerHTML = '<div class="page-head"><h1>' + E(title) + '</h1></div><div class="card empty"><p>Chargement…</p></div>'; }
  function errorView(v, title, err) { v.innerHTML = '<div class="page-head"><h1>' + E(title) + '</h1></div><div class="card empty">' + icon('cloud') + '<p>' + E(C().msg(err)) + '</p><button class="btn" onclick="location.reload()">Réessayer</button></div>'; }

  /* ---------- Liste des fiches partagées ---------- */
  App.route(/^\/partage$/, (v) => {
    App.setTitle('Fiches partagées');
    let items = [], mineShared = {}, reports = [], sid = '', q = '', alive = true;
    loadingView(v, 'Fiches partagées');
    async function fetchAll() {
      const F = C().F, db = C().db, me = C().user.uid;
      const snap = await F.getDocs(F.query(F.collection(db, 'partages'), F.orderBy('cree', 'desc'), F.limit(200)));
      items = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      mineShared = {};
      items.filter((x) => x.uid === me && x.fiche).forEach((x) => { mineShared[x.fiche] = x; });
      reports = [];
      if (C().admin) {
        const r = await F.getDocs(F.collection(db, 'signalements'));
        reports = r.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      }
    }
    function card(x) {
      const s = RC.SUBJ[x.matiere] || RC.SUBJ.perso, mine = x.uid === C().user.uid;
      return '<div class="share-card" style="--c:' + s.color + '"><div class="small" style="color:' + s.color + ';font-weight:700">' + E(s.name) + '</div><h3><a href="#/partage/' + x.id + '">' + E(x.titre) + '</a></h3>' +
        (x.resume ? '<p class="small">' + E(x.resume) + '</p>' : '') +
        '<div class="small muted">par <b>' + E(x.pseudo || '?') + '</b>' + (mine ? ' (toi)' : '') + ' · ' + dateFr(x.maj || x.cree) + ' · ' + plural(x.imports || 0, 'ajout') + '</div>' +
        '<div class="row" style="margin-top:8px"><a class="btn sm secondary" href="#/partage/' + x.id + '">Lire</a><button class="btn sm" data-add="' + x.id + '">' + icon('plus') + ' Ajouter à mes fiches</button>' +
        (mine || C().admin ? '<button class="btn sm ghost" data-del="' + x.id + '">' + icon('trash') + ' Retirer</button>' : '<button class="btn sm ghost" data-report="' + x.id + '">' + icon('flag') + ' Signaler</button>') + '</div></div>';
    }
    function render() {
      if (!alive) return;
      const n = RC.norm(q);
      const list = items.filter((x) => (!sid || x.matiere === sid) && (!n || RC.norm(x.titre + ' ' + x.resume + ' ' + x.pseudo).indexOf(n) !== -1));
      const subs = RC.SUBJECTS.filter((s) => items.some((x) => x.matiere === s.id));
      const mine = Store.userFiches.map((u) => ({ u, f: parse(u.src) })).filter((x) => x.f);
      v.innerHTML = '<div class="page-head"><h1>Fiches partagées</h1><p>Les fiches des élèves de RéviCIEL. Ajoute celles qui t\'aident à tes fiches perso (tu peux ensuite les modifier), et partage les tiennes.</p></div>' +
        '<div class="callout attention"><div class="callout-title">' + icon('info') + ' Fiches écrites par des élèves</div><p>Vérifie toujours avec ton cours. Si une fiche contient une erreur grave, des propos blessants ou des infos personnelles, signale-la.</p></div>' +
        (reports.length ? '<div class="card section"><h2>' + icon('flag') + ' Signalements (' + reports.length + ')</h2><ul class="list-plain">' + reports.map((r) => { const it = items.find((x) => x.id === r.partage); return '<li class="row between"><span>' + (it ? '<a href="#/partage/' + it.id + '">' + E(it.titre) + '</a> par ' + E(it.pseudo) : '<span class="muted">fiche déjà retirée</span>') + '<br><span class="small muted">' + E(r.motif || '') + '</span></span><span class="row">' + (it ? '<button class="btn sm danger" data-del="' + it.id + '">Retirer la fiche</button>' : '') + '<button class="btn sm ghost" data-close="' + r.id + '">Classer</button></span></li>'; }).join('') + '</ul></div>' : '') +
        '<details class="card section"' + (mine.length && !Object.keys(mineShared).length ? ' open' : '') + '><summary><b>' + icon('share') + ' Partager une de mes fiches</b></summary>' +
        (mine.length ? '<ul class="list-plain" style="margin-top:10px">' + mine.map(({ u, f }) => '<li class="row between"><span>' + E(f.title) + (mineShared[u.id] ? ' <span class="badge ok">partagée</span>' : '') + '</span><button class="btn sm' + (mineShared[u.id] ? ' secondary' : '') + '" data-share="' + E(u.id) + '">' + (mineShared[u.id] ? 'Mettre à jour' : 'Partager') + '</button></li>').join('') + '</ul>' :
          '<p class="small muted" style="margin-top:10px">Tu n\'as pas encore de fiche perso. <a href="#/editeur">Crée une fiche</a> (ou copie une fiche officielle pour la modifier), puis reviens ici.</p>') + '</details>' +
        '<div class="card section share-filters"><input class="input" type="search" id="sh-q" placeholder="Rechercher une fiche, un élève…" value="' + E(q) + '"><select class="input" id="sh-sid"><option value="">Toutes les matières</option>' + subs.map((s) => '<option value="' + s.id + '"' + (s.id === sid ? ' selected' : '') + '>' + E(s.name) + '</option>').join('') + '</select></div>' +
        (list.length ? '<div class="share-grid section">' + list.map(card).join('') + '</div>' : '<div class="card empty section">' + icon('share') + '<p>' + (items.length ? 'Aucune fiche ne correspond.' : 'Personne n\'a encore partagé de fiche. Sois le premier !') + '</p></div>');
      const qi = $('#sh-q', v);
      qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; render(); const n2 = $('#sh-q', v); n2.focus(); n2.setSelectionRange(pos, pos); };
      $('#sh-sid', v).onchange = (e) => { sid = e.target.value; render(); };
    }
    async function share(localId) {
      const u = Store.userFiches.find((x) => x.id === localId), f = u && parse(u.src);
      if (!f) return;
      if (u.src.length > MAX) { App.toast('Fiche trop longue pour être partagée (60 000 caractères maximum).'); return; }
      const F = C().F, db = C().db, me = C().user;
      const data = { titre: f.title.slice(0, 120) || 'Sans titre', matiere: RC.SUBJ[f.subject] ? f.subject : 'perso', resume: String(f.summary || '').slice(0, 300), src: u.src, pseudo: me.displayName || 'Élève', fiche: localId, maj: F.serverTimestamp() };
      const ex = mineShared[localId];
      if (ex) await F.updateDoc(F.doc(db, 'partages', ex.id), data);
      else {
        if (!confirm('Partager « ' + data.titre + ' » ? Elle sera visible par tous les élèves connectés, avec ton pseudo « ' + data.pseudo + ' ».')) return;
        await F.addDoc(F.collection(db, 'partages'), Object.assign(data, { uid: me.uid, cree: F.serverTimestamp(), imports: 0 }));
      }
      App.toast(ex ? 'Fiche partagée mise à jour.' : 'Fiche partagée ! Merci pour les autres élèves.');
      await fetchAll(); render();
    }
    v.addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (!b || !C().user) return;
      const F = C().F, db = C().db;
      try {
        if (b.dataset.add) { const d = items.find((x) => x.id === b.dataset.add); const id = addToMine(d); d.imports = (d.imports || 0) + 1; App.toast('Ajoutée à « Mes fiches » !'); App.go('#/fiche/' + encodeURIComponent(id)); }
        else if (b.dataset.share) await share(b.dataset.share);
        else if (b.dataset.del) {
          if (!confirm('Retirer cette fiche du partage ?')) return;
          await F.deleteDoc(F.doc(db, 'partages', b.dataset.del));
          if (C().admin) await Promise.all(reports.filter((r) => r.partage === b.dataset.del).map((r) => F.deleteDoc(F.doc(db, 'signalements', r.id))));
          App.toast('Fiche retirée.'); await fetchAll(); render();
        } else if (b.dataset.report) {
          const motif = prompt('Pourquoi signales-tu cette fiche ? (erreur, propos blessants, infos personnelles…)');
          if (motif == null) return;
          await F.addDoc(F.collection(db, 'signalements'), { partage: b.dataset.report, motif: motif.slice(0, 300), uid: C().user.uid, cree: F.serverTimestamp() });
          App.toast('Merci, la fiche a été signalée.');
        } else if (b.dataset.close) { await F.deleteDoc(F.doc(db, 'signalements', b.dataset.close)); await fetchAll(); render(); }
      } catch (err) { App.toast(C().msg(err), { duration: 6000 }); }
    });
    const start = () => {
      if (!C().ready) return;
      if (!C().user) { needAccount(v, 'Fiches partagées'); return; }
      fetchAll().then(render).catch((err) => errorView(v, 'Fiches partagées', err));
    };
    const off = C().onChange(() => { if (!items.length) start(); });
    C().load().then(start).catch((err) => errorView(v, 'Fiches partagées', err));
    return () => { alive = false; off(); };
  });

  /* ---------- Lire une fiche partagée ---------- */
  App.route(/^\/partage\/([\w-]+)$/, (v, [id]) => {
    App.setTitle('Fiche partagée');
    let alive = true;
    loadingView(v, 'Fiche partagée');
    async function show() {
      if (!alive || !C().ready) return;
      if (!C().user) { needAccount(v, 'Fiche partagée'); return; }
      const F = C().F, snap = await F.getDoc(F.doc(C().db, 'partages', id));
      if (!snap.exists()) { App.notFound(v, 'Cette fiche n\'est plus partagée'); return; }
      const d = Object.assign({ id }, snap.data()), f = parse(d.src);
      const s = RC.SUBJ[d.matiere] || RC.SUBJ.perso;
      App.setTitle(d.titre);
      v.innerHTML = '<div class="crumbs"><a href="#/">Accueil</a><span>›</span><a href="#/partage">Partage</a><span>›</span><span>' + E(d.titre) + '</span></div>' +
        '<div class="page-head"><div class="small" style="color:' + s.color + ';font-weight:700">' + E(s.name) + '</div><h1>' + E(d.titre) + '</h1><p>Partagée par <b>' + E(d.pseudo || '?') + '</b> · ' + dateFr(d.maj || d.cree) + ' · ' + plural(d.imports || 0, 'ajout') + '</p></div>' +
        '<div class="row section"><button class="btn" data-add>' + icon('plus') + ' Ajouter à mes fiches</button><a class="btn ghost" href="#/partage">← Toutes les fiches partagées</a></div>' +
        '<div class="callout attention"><div class="callout-title">' + icon('info') + ' Fiche écrite par un élève</div><p>Vérifie avec ton cours avant de l\'apprendre par cœur.</p></div>' +
        '<article class="card md fiche-body">' + (f ? RCMD.render(f.body).html : '<p>Fiche illisible.</p>') + '</article>' +
        (f && (f.cards.length || f.quiz.length) ? '<p class="small muted section">Cette fiche contient ' + plural(f.cards.length, 'carte') + ' et ' + plural(f.quiz.length, 'question') + ' de quiz : ajoute-la à tes fiches pour t\'entraîner.</p>' : '');
      $('[data-add]', v).onclick = () => { const nid = addToMine(d); App.toast('Ajoutée à « Mes fiches » !'); App.go('#/fiche/' + encodeURIComponent(nid)); };
    }
    C().load().then(() => show().catch((err) => errorView(v, 'Fiche partagée', err))).catch((err) => errorView(v, 'Fiche partagée', err));
    return () => { alive = false; };
  });
})();

</script>
<script>
/* RéviCIEL — application installable (PWA) : hors connexion, installation, mises à jour */
(function () {
  'use strict';
  const emit = () => window.dispatchEvent(new Event('pwa-change'));
  const PWA = {
    deferred: null, reg: null, updating: false,
    isStandalone: () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true,
    isIOS: () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
    canInstall: () => !!PWA.deferred,
    offlineReady: () => !!(navigator.serviceWorker && navigator.serviceWorker.controller),
    async install() {
      if (!PWA.deferred) return false;
      PWA.deferred.prompt();
      const choice = await PWA.deferred.userChoice;
      PWA.deferred = null;
      emit();
      return choice.outcome === 'accepted';
    },
    async checkUpdate() {
      if (!PWA.reg) return false;
      await PWA.reg.update();
      return !!(PWA.reg.installing || PWA.reg.waiting);
    }
  };
  window.PWA = PWA;

  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); PWA.deferred = e; emit(); });
  window.addEventListener('appinstalled', () => {
    PWA.deferred = null;
    App.toast('Appli installée ! Lance-la depuis ton écran d\'accueil.');
    emit();
  });

  // Indicateur « Hors ligne »
  const badge = document.getElementById('net-badge');
  const net = () => { badge.hidden = navigator.onLine; };
  window.addEventListener('online', net);
  window.addEventListener('offline', net);
  net();

  // Service worker : met tout le site en cache pour réviser sans connexion
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    const promptUpdate = (worker) => {
      App.toast('Une nouvelle version de RéviCIEL est disponible.', {
        action: 'Mettre à jour', duration: 20000,
        onAction: () => { PWA.updating = true; worker.postMessage({ type: 'SKIP_WAITING' }); }
      });
    };
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        PWA.reg = reg;
        if (reg.waiting && navigator.serviceWorker.controller) promptUpdate(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state !== 'installed') return;
            if (navigator.serviceWorker.controller) promptUpdate(nw);
            else App.toast('RéviCIEL est prêt : il fonctionne maintenant sans connexion ✓');
          });
        });
        emit();
      }).catch((err) => console.warn('Service worker non enregistré :', err));
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (PWA.updating) { PWA.updating = false; location.reload(); } else emit();
    });
  }
})();

</script>
<script>
/* RéviCIEL — démarrage de l'application */
(function () {
  'use strict';
  Store.onError = () => App.toast('Attention : ta progression ne peut pas être enregistrée (navigation privée ou stockage plein).', { duration: 8000 });
  RC.load();
  App.applySettings();
  App.renderNav();
  App.bindTopSearch();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', App.applySettings);
  window.addEventListener('hashchange', App.navigate);
  // Met à jour le compteur « Réviser » quand on revient sur l'appli le lendemain
  document.addEventListener('visibilitychange', () => { if (!document.hidden) App.renderNav(); });
  App.navigate();
})();

</script>
